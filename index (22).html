답할 것입니다. ‘주님, 언제 우리가 주님께서 배고프시거나 목마르시거나 나그네 되시거나 헐벗으시거나 병드시거나 감옥에 계신 것을 보고도 섬기지 않았습니까?’","45":"그때 왕이 그들에게 대답할 것입니다. ‘내가 진실로 여러분에게 말합니다. 여러분이 이 가장 작은 사람들 가운데 하나에게 하지 않은 것이 곧 나에게 하지 않은 것입니다.’","46":"그들은 영원한 형벌로 들어가고 의인들은 영원한 생명으로 들어갈 것입니다.”"},"26":{"1":"예수님께서 이 모든 말씀을 마치신 뒤 제자들에게 말씀하셨습니다.","2":"“여러분이 알듯이 이틀 뒤에는 유월절입니다. 사람의 아들이 십자가에 못 박히도록 넘겨질 것입니다.”","3":"그때 대제사장들과 백성의 장로들이 가야바라는 대제사장의 관저에 모여","4":"예수님을 속임수로 붙잡아 죽이려고 의논했습니다.","5":"그러나 그들은 “명절 중에는 하지 말자. 백성 가운데 소동이 일어날 수 있다”라고 말했습니다.","6":"예수님께서 베다니에서 나병 환자 시몬의 집에 계실 때","7":"한 여자가 매우 값진 향유가 든 옥합을 가지고 그분께 와서, 식사 자리에 기대어 계신 그분의 머리에 부었습니다.","8":"제자들은 이것을 보고 분개하여 말했습니다. “왜 이렇게 낭비합니까?","9":"이것을 비싼 값에 팔아 가난한 사람들에게 줄 수 있었을 것입니다.”","10":"예수님께서 아시고 그들에게 말씀하셨습니다. “왜 이 여자를 괴롭힙니까? 이 여자는 나에게 아름다운 일을 했습니다.","11":"가난한 사람들은 언제나 여러분과 함께 있지만, 나는 언제나 여러분과 함께 있는 것이 아닙니다.","12":"이 여자가 이 향유를 내 몸에 부은 것은 내 장례를 준비하려고 한 것입니다.","13":"내가 진실로 여러분에게 말합니다. 이 복음이 온 세상 어디에서 선포되든 이 여자가 한 일도 함께 말해져 그를 기억하게 될 것입니다.”","14":"그때 열둘 가운데 하나인 가룟 유다가 대제사장들에게 가서","15":"말했습니다. “내가 그를 여러분에게 넘겨주면 무엇을 주겠습니까?” 그들이 은 삼십을 달아 주었습니다.","16":"그때부터 유다는 예수님을 넘겨줄 기회를 찾았습니다.","17":"무교절 첫날에 제자들이 예수님께 와서 말했습니다. “주님께서 유월절 음식을 드실 곳을 우리가 어디에 준비하기를 원하십니까?”","18":"예수님께서 말씀하셨습니다. “성 안으로 어떤 사람에게 가서 말하십시오. ‘선생님께서 말씀하십니다. 내 때가 가까웠다. 내가 내 제자들과 함께 네 집에서 유월절을 지키겠다.’”","19":"제자들은 예수님께서 지시하신 대로 하여 유월절을 준비했습니다.","20":"저녁이 되자 예수님께서 열두 제자와 함께 식사 자리에 기대어 앉으셨습니다.","21":"그들이 먹고 있을 때 그분께서 말씀하셨습니다. “내가 진실로 여러분에게 말합니다. 여러분 가운데 한 사람이 나를 넘겨줄 것입니다.”","22":"그들은 몹시 슬퍼하며 각자 “주님, 저는 아니지요?”라고 말하기 시작했습니다.","23":"예수님께서 대답하셨습니다. “나와 함께 그릇에 손을 넣은 사람이 나를 넘겨줄 것입니다.","24":"사람의 아들은 자기에 관하여 기록된 대로 가지만, 사람의 아들을 넘겨주는 그 사람에게는 화가 있습니다! 그 사람은 태어나지 않았더라면 더 좋았을 것입니다.”","25":"예수님을 넘겨주려던 유다가 대답했습니다. “랍비, 저는 아니지요?” 예수님께서 그에게 말씀하셨습니다. “네가 말했다.”","26":"그들이 먹고 있을 때 예수님께서 빵을 가지시고 축복하신 뒤 떼어 제자들에게 주시며 말씀하셨습니다. “받아 먹으십시오. 이것은 내 몸입니다.”","27":"또 잔을 가지시고 감사를 드린 뒤 그들에게 주시며 말씀하셨습니다. “여러분 모두 이것을 마십시오.","28":"이것은 죄들의 용서를 위하여 많은 사람을 위해 흘리는 나의 언약의 피입니다.","29":"내가 여러분에게 말합니다. 내 아버지의 왕국에서 여러분과 함께 새것으로 마시는 그날까지 이제부터 포도나무에서 난 것을 결코 마시지 않을 것입니다.”","30":"그들은 찬송을 부른 뒤 올리브산으로 나갔습니다.","31":"그때 예수님께서 그들에게 말씀하셨습니다. “오늘 밤 여러분 모두 나 때문에 걸려 넘어질 것입니다. 기록되어 있기 때문입니다. ‘내가 목자를 칠 것이며 양 떼의 양들이 흩어질 것이다.’","32":"그러나 내가 일으켜진 뒤 여러분보다 먼저 갈릴리로 갈 것입니다.”","33":"베드로가 그분께 대답했습니다. “모두가 주님 때문에 걸려 넘어져도 저는 결코 걸려 넘어지지 않겠습니다.”","34":"예수님께서 그에게 말씀하셨습니다. “내가 진실로 당신에게 말합니다. 오늘 밤 닭이 울기 전에 당신이 나를 세 번 부인할 것입니다.”","35":"베드로가 말했습니다. “주님과 함께 죽어야 할지라도 결코 주님을 부인하지 않겠습니다.” 다른 모든 제자도 그렇게 말했습니다.","36":"그때 예수님께서 제자들과 함께 겟세마네라 하는 곳에 가셔서 말씀하셨습니다. “내가 저쪽에 가서 기도하는 동안 여기 앉아 있으십시오.”","37":"그분께서 베드로와 세베대의 두 아들을 데리고 가시며 슬퍼하고 괴로워하기 시작하셨습니다.","38":"그때 그들에게 말씀하셨습니다. “내 혼이 죽을 만큼 몹시 슬픕니다. 여기 머물러 나와 함께 깨어 있으십시오.”","39":"조금 더 나아가 얼굴을 땅에 대고 엎드려 기도하셨습니다. “내 아버지, 가능하다면 이 잔이 나에게서 지나가게 해 주십시오. 그러나 내가 원하는 대로가 아니라 아버지께서 원하시는 대로 되게 하십시오.”","40":"제자들에게 돌아오셔서 그들이 자고 있는 것을 보시고 베드로에게 말씀하셨습니다. “이렇게 한 시간도 나와 함께 깨어 있을 수 없었습니까?","41":"시험에 들어가지 않도록 깨어 기도하십시오. 영은 원하지만 육체는 약합니다.”","42":"다시 두 번째로 가셔서 기도하셨습니다. “내 아버지, 내가 마시지 않고서는 이것이 지나갈 수 없다면 아버지의 뜻이 이루어지게 하십시오.”","43":"다시 돌아오셔서 그들이 자고 있는 것을 보셨습니다. 그들의 눈이 무거웠기 때문입니다.","44":"그들을 두고 다시 가셔서 세 번째로 같은 말씀으로 기도하셨습니다.","45":"그때 제자들에게 돌아와 말씀하셨습니다. “이제 자고 쉬고 있습니까? 보십시오, 때가 가까웠고 사람의 아들이 죄인들의 손에 넘겨집니다.","46":"일어나십시오. 가십시오. 보십시오, 나를 넘겨주는 사람이 가까이 왔습니다.”","47":"예수님께서 아직 말씀하고 계실 때 열둘 가운데 하나인 유다가 왔습니다. 대제사장들과 백성의 장로들이 보낸 큰 무리가 칼과 몽둥이를 들고 그와 함께 왔습니다.","48":"예수님을 넘겨주는 자가 그들에게 표를 정해 주며 말했습니다. “내가 입 맞추는 사람이 그 사람입니다. 그를 붙잡으십시오.”","49":"그는 곧 예수님께 다가와 “랍비, 안녕하십니까?” 하고 입 맞추었습니다.","50":"예수님께서 그에게 말씀하셨습니다. “친구여, 네가 하러 온 일을 하여라.” 그때 그들이 다가와 예수님께 손을 대어 붙잡았습니다.","51":"그런데 보십시오, 예수님과 함께 있던 사람 가운데 하나가 손을 뻗어 칼을 빼어 대제사장의 종을 쳐서 그의 귀를 잘라 버렸습니다.","52":"그때 예수님께서 그에게 말씀하셨습니다. “당신의 칼을 제자리로 돌려놓으십시오. 칼을 잡는 사람은 모두 칼로 망할 것입니다.","53":"내가 아버지께 구하면 지금 당장 열두 군단보다 더 많은 천사를 보내 주실 수 없다고 생각합니까?","54":"그러나 그렇게 하면 반드시 이렇게 되어야 한다고 한 성경이 어떻게 이루어지겠습니까?”","55":"그때 예수님께서 무리에게 말씀하셨습니다. “여러분이 강도를 잡듯 칼과 몽둥이를 들고 나를 잡으러 나왔습니까? 나는 날마다 성전에 앉아 가르쳤지만 여러분은 나를 붙잡지 않았습니다.","56":"그러나 이 모든 일은 예언자들의 성경이 이루어지게 하려는 것입니다.” 그때 모든 제자가 그분을 버리고 달아났습니다.","57":"예수님을 붙잡은 사람들은 그분을 대제사장 가야바에게 데려갔고, 율법학자들과 장로들이 거기에 모여 있었습니다.","58":"베드로는 멀찍이 예수님을 따라 대제사장의 뜰까지 들어가, 그 결과를 보려고 경비원들과 함께 앉았습니다.","59":"대제사장들과 온 공회는 예수님을 죽이려고 그분에 대한 거짓 증언을 찾고 있었습니다.","60":"많은 거짓 증인이 왔지만 그들은 찾지 못했습니다. 마침내 두 사람이 와서","61":"말했습니다. “이 사람이 ‘나는 하나님의 성전을 헐고 사흘 만에 다시 세울 수 있다’라고 말했습니다.”","62":"대제사장이 일어나 예수님께 말했습니다. “아무 대답도 하지 않습니까? 이 사람들이 당신에게 불리하게 증언하는 것이 무엇입니까?”","63":"그러나 예수님께서는 침묵하셨습니다. 대제사장이 그분께 말했습니다. “살아 계신 하나님을 두고 내가 당신에게 맹세하게 하니, 당신이 그리스도, 하나님의 아들인지 우리에게 말하십시오.”","64":"예수님께서 그에게 말씀하셨습니다. “당신이 말했습니다. 그러나 내가 여러분에게 말합니다. 이제부터 여러분은 사람의 아들이 능력의 오른편에 앉아 하늘의 구름들을 타고 오는 것을 볼 것입니다.”","65":"그때 대제사장이 자기 옷을 찢으며 말했습니다. “그가 신성모독을 했습니다! 우리가 더 이상 무슨 증인이 필요합니까? 보십시오, 이제 여러분이 그 신성모독을 들었습니다.","66":"여러분은 어떻게 생각합니까?” 그들이 대답했습니다. “그는 죽어 마땅합니다.”","67":"그때 그들은 예수님의 얼굴에 침을 뱉고 주먹으로 쳤으며, 어떤 사람들은 손바닥으로 때리며","68":"말했습니다. “그리스도야, 우리에게 예언해 보아라. 너를 친 사람이 누구냐?”","69":"베드로는 바깥 뜰에 앉아 있었는데 한 여종이 그에게 와서 말했습니다. “당신도 갈릴리 사람 예수와 함께 있었지요.”","70":"그러나 베드로는 모든 사람 앞에서 부인하며 말했습니다. “나는 당신이 무슨 말을 하는지 모르겠습니다.”","71":"그가 문간으로 나가자 다른 여종이 그를 보고 거기 있는 사람들에게 말했습니다. “이 사람은 나사렛 사람 예수와 함께 있었습니다.”","72":"그는 다시 맹세하며 부인했습니다. “나는 그 사람을 알지 못합니다.”","73":"조금 뒤에 곁에 서 있던 사람들이 다가와 베드로에게 말했습니다. “틀림없이 당신도 그들 가운데 한 사람입니다. 당신의 말씨가 당신을 드러냅니다.”","74":"그때 베드로는 저주하고 맹세하며 “나는 그 사람을 알지 못합니다”라고 말하기 시작했습니다. 곧 닭이 울었습니다.","75":"베드로는 예수님께서 “닭이 울기 전에 당신이 나를 세 번 부인할 것입니다”라고 하신 말씀을 기억하고 밖으로 나가 몹시 울었습니다."},"27":{"1":"아침이 되자 모든 대제사장들과 백성의 장로들이 예수님을 죽이려고 의논했습니다.","2":"그들은 예수님을 결박하여 끌고 가 총독 빌라도에게 넘겨주었습니다.","3":"그때 예수님을 넘겨준 유다는 그분께서 유죄 판결을 받으신 것을 보고 뉘우쳐 은 삼십을 대제사장들과 장로들에게 돌려주며","4":"말했습니다. “내가 무죄한 피를 넘겨주어 죄를 지었습니다.” 그러나 그들은 “그것이 우리와 무슨 상관이냐? 네가 알아서 하라”라고 말했습니다.","5":"유다는 은을 성전에 던져 놓고 떠나가 목을 매었습니다.","6":"대제사장들은 그 은을 거두며 말했습니다. “이것은 피 값이므로 성전 금고에 넣는 것이 허용되지 않는다.”","7":"그들은 의논하여 그 돈으로 나그네들의 묘지로 쓰려고 토기장이의 밭을 샀습니다.","8":"그래서 그 밭은 오늘날까지 ‘피 밭’이라고 불립니다.","9":"그때 예언자 예레미야를 통하여 말씀하신 것이 이루어졌습니다. “그들이 값 매겨진 사람, 곧 이스라엘 자손 가운데 몇 사람이 값을 매긴 사람의 값 은 삼십을 가져다가","10":"주님께서 나에게 명하신 대로 토기장이의 밭 값으로 주었다.”","11":"예수님께서 총독 앞에 서셨습니다. 총독이 그분께 물었습니다. “당신이 유대인의 왕이오?” 예수님께서 말씀하셨습니다. “당신이 말했습니다.”","12":"그러나 대제사장들과 장로들이 고발할 때에는 아무 대답도 하지 않으셨습니다.","13":"그때 빌라도가 예수님께 말했습니다. “그들이 당신에게 불리하게 얼마나 많은 것을 증언하는지 듣지 못하시오?”","14":"그러나 예수님께서는 단 한마디에도 대답하지 않으셨습니다. 그래서 총독은 매우 놀랐습니다.","15":"명절 때마다 총독은 무리가 원하는 죄수 한 사람을 풀어 주는 관례가 있었습니다.","16":"그때 바라바라 하는 악명 높은 죄수 한 사람이 있었습니다.","17":"무리가 모였을 때 빌라도가 그들에게 물었습니다. “여러분은 내가 누구를 풀어 주기를 원합니까? 바라바입니까, 아니면 그리스도라고 불리는 예수입니까?”","18":"그는 그들이 시기 때문에 예수님을 넘겨준 줄 알고 있었기 때문입니다.","19":"빌라도가 재판석에 앉아 있을 때 그의 아내가 사람을 보내 말했습니다. “저 의로운 사람에게 아무 일도 하지 마십시오. 오늘 꿈에서 그 사람 때문에 많이 괴로웠습니다.”","20":"그러나 대제사장들과 장로들은 무리에게 바라바를 요구하고 예수님은 죽이도록 설득했습니다.","21":"총독이 그들에게 물었습니다. “둘 가운데 누구를 여러분에게 풀어 주기를 원합니까?” 그들이 “바라바입니다”라고 말했습니다.","22":"빌라도가 그들에게 말했습니다. “그러면 그리스도라고 불리는 예수는 어떻게 해야 합니까?” 그들이 모두 말했습니다. “십자가에 못 박으십시오!”","23":"빌라도가 말했습니다. “왜요? 그가 무슨 악한 일을 했습니까?” 그러나 그들은 더욱 크게 외쳤습니다. “십자가에 못 박으십시오!”","24":"빌라도는 아무 소용이 없고 오히려 소동이 일어나는 것을 보고 물을 가져다가 무리 앞에서 손을 씻으며 말했습니다. “나는 이 사람의 피에 책임이 없습니다. 여러분이 알아서 하십시오.”","25":"온 백성이 대답했습니다. “그의 피가 우리와 우리 자녀들에게 돌아가도 좋습니다!”","26":"그때 빌라도는 바라바를 그들에게 풀어 주고 예수님은 채찍질한 뒤 십자가에 못 박도록 넘겨주었습니다.","27":"그때 총독의 군인들이 예수님을 총독 관저 안으로 데려가 온 부대를 그분 주위에 모았습니다.","28":"그들은 예수님의 옷을 벗기고 진홍색 망토를 입혔습니다.","29":"가시로 관을 엮어 그분의 머리에 씌우고 오른손에는 갈대를 쥐게 했습니다. 그리고 그분 앞에 무릎을 꿇으며 조롱했습니다. “유대인의 왕이여, 만세!”","30":"그들은 그분께 침을 뱉고 갈대를 빼앗아 머리를 때렸습니다.","31":"조롱을 마친 뒤 망토를 벗기고 그분의 옷을 다시 입힌 다음 십자가에 못 박으려고 끌고 갔습니다.","32":"그들이 나가다가 구레네 사람 시몬이라는 사람을 만나 그에게 예수님의 십자가를 지게 했습니다.","33":"그들은 골고다, 곧 ‘해골의 곳’이라 하는 곳에 이르렀습니다.","34":"그들은 예수님께 쓸개를 섞은 포도주를 마시게 했지만, 그분께서는 맛보신 뒤 마시려 하지 않으셨습니다.","35":"그들은 예수님을 십자가에 못 박은 뒤 제비를 뽑아 그분의 옷을 나누었습니다.","36":"그리고 거기 앉아 그분을 지켰습니다.","37":"그들은 그분의 머리 위에 죄목을 써 붙였습니다. “이는 유대인의 왕 예수다.”","38":"그때 강도 두 사람이 예수님과 함께 십자가에 못 박혔는데 하나는 오른편에, 하나는 왼편에 있었습니다.","39":"지나가는 사람들이 머리를 흔들며 예수님을 모욕하여","40":"말했습니다. “성전을 헐고 사흘 만에 세우는 자여, 너 자신을 구원해 보아라! 네가 하나님의 아들이라면 십자가에서 내려와라!”","41":"대제사장들도 율법학자들과 장로들과 함께 똑같이 조롱하며 말했습니다.","42":"“그가 다른 사람들은 구원했지만 자기는 구원하지 못하는군! 그가 이스라엘의 왕이라면 지금 십자가에서 내려오게 하라. 그러면 우리가 그를 믿겠다.","43":"그가 하나님을 신뢰했으니 하나님께서 그를 원하시면 지금 구해 주시게 하라. 그가 ‘나는 하나님의 아들이다’라고 말했기 때문이다.”","44":"그와 함께 십자가에 못 박힌 강도들도 같은 식으로 그분을 모욕했습니다.","45":"제육시부터 제구시까지 온 땅에 어둠이 내렸습니다.","46":"제구시쯤 예수님께서 큰 소리로 외치셨습니다. “엘리 엘리 레마 사박타니?” 곧 “나의 하나님, 나의 하나님, 왜 나를 버리셨습니까?”라는 뜻입니다.","47":"거기 서 있던 사람들 가운데 몇 사람이 듣고 말했습니다. “이 사람이 엘리야를 부른다.”","48":"그들 가운데 한 사람이 곧 달려가 해면을 가져다가 신 포도주를 적셔 갈대에 꽂아 그분께 마시게 했습니다.","49":"그러나 다른 사람들이 말했습니다. “가만두어라. 엘리야가 와서 그를 구해 주는지 보자.”","50":"예수님께서 다시 큰 소리로 외치시고 영을 내어주셨습니다.","51":"그때 보십시오, 성전 휘장이 위에서 아래까지 둘로 찢어졌고 땅이 흔들리며 바위들이 갈라졌습니다.","52":"무덤들이 열렸고 잠들었던 많은 성도들의 몸이 일으켜졌습니다.","53":"그들은 예수님의 부활 후에 무덤에서 나와 거룩한 성에 들어가 많은 사람에게 나타났습니다.","54":"백부장과 그와 함께 예수님을 지키던 사람들이 지진과 일어난 일들을 보고 몹시 두려워하며 말했습니다. “참으로 이분은 하나님의 아들이셨다.”","55":"거기에는 멀리서 지켜보던 많은 여자도 있었습니다. 그들은 갈릴리에서 예수님을 따라오며 섬기던 사람들이었습니다.","56":"그 가운데 막달라 마리아와 야고보와 요셉의 어머니 마리아와 세베대의 아들들의 어머니가 있었습니다.","57":"저녁이 되자 아리마대에서 온 요셉이라는 부자가 왔는데 그도 예수님의 제자였습니다.","58":"그가 빌라도에게 가서 예수님의 몸을 달라고 요청했습니다. 그러자 빌라도는 그것을 내주라고 명령했습니다.","59":"요셉은 그 몸을 받아 깨끗한 세마포로 싸서","60":"바위 속에 판 자기의 새 무덤에 모셨습니다. 그리고 무덤 입구에 큰 돌을 굴려 놓고 떠났습니다.","61":"막달라 마리아와 다른 마리아는 무덤 맞은편에 앉아 있었습니다.","62":"그다음 날, 곧 준비일 다음 날에 대제사장들과 바리새인들이 빌라도에게 함께 모여","63":"말했습니다. “각하, 저 속이는 자가 살아 있을 때 ‘사흘 뒤에 내가 일으켜질 것이다’라고 말한 것을 기억합니다.","64":"그러므로 셋째 날까지 무덤을 단단히 지키라고 명령해 주십시오. 그렇지 않으면 그의 제자들이 와서 그를 훔쳐 간 뒤 백성에게 ‘그가 죽은 사람들 가운데서 일으켜졌다’라고 말할 수 있습니다. 그러면 마지막 속임이 처음 것보다 더 심할 것입니다.”","65":"빌라도가 그들에게 말했습니다. “경비병들이 있으니 가서 여러분이 아는 대로 단단히 지키십시오.”","66":"그들은 가서 돌을 봉인하고 경비병들을 세워 무덤을 단단히 지켰습니다."},"28":{"1":"안식일이 지난 뒤, 그 주의 첫날이 밝아올 무렵 막달라 마리아와 다른 마리아가 무덤을 보러 갔습니다.","2":"그런데 보십시오, 큰 지진이 일어났습니다. 주님의 천사가 하늘에서 내려와 다가가 돌을 굴려 내고 그 위에 앉았기 때문입니다.","3":"그의 모습은 번개 같았고 그의 옷은 눈처럼 희었습니다.","4":"경비병들은 그를 두려워하여 떨며 죽은 사람들처럼 되었습니다.","5":"천사가 여자들에게 말했습니다. “두려워하지 마십시오. 여러분이 십자가에 못 박히신 예수님을 찾고 있는 줄 압니다.","6":"그분은 여기 계시지 않습니다. 말씀하신 대로 일으켜지셨습니다. 와서 그분이 누워 계시던 곳을 보십시오.","7":"그리고 빨리 가서 제자들에게 말하십시오. ‘그분이 죽은 사람들 가운데서 일으켜지셨고, 보십시오, 여러분보다 먼저 갈릴리로 가십니다. 거기서 여러분이 그분을 볼 것입니다.’ 보십시오, 내가 여러분에게 말했습니다.”","8":"여자들은 두려움과 큰 기쁨으로 무덤을 빨리 떠나 제자들에게 알리려고 달려갔습니다.","9":"그런데 보십시오, 예수님께서 그들을 만나 말씀하셨습니다. “평안하십시오.” 여자들은 다가가 그분의 발을 붙잡고 그분께 경배했습니다.","10":"그때 예수님께서 그들에게 말씀하셨습니다. “두려워하지 마십시오. 가서 내 형제들에게 갈릴리로 가라고 알리십시오. 거기서 그들이 나를 볼 것입니다.”","11":"여자들이 가는 동안 보십시오, 경비병들 가운데 몇 사람이 성으로 들어가 일어난 모든 일을 대제사장들에게 알렸습니다.","12":"대제사장들은 장로들과 함께 모여 의논한 뒤 군인들에게 많은 돈을 주며","13":"말했습니다. “너희는 ‘그의 제자들이 밤에 와서 우리가 자는 동안 그를 훔쳐 갔다’라고 말하여라.","14":"이 일이 총독에게 들리면 우리가 그를 설득하여 너희가 걱정하지 않도록 하겠다.”","15":"그들은 돈을 받고 지시받은 대로 했습니다. 이 말이 오늘날까지 유대인들 사이에 널리 퍼져 있습니다.","16":"열한 제자는 예수님께서 지시하신 갈릴리의 산으로 갔습니다.","17":"그들은 예수님을 보고 경배했지만, 몇 사람은 의심했습니다.","18":"예수님께서 다가와 그들에게 말씀하셨습니다. “하늘과 땅의 모든 권위가 나에게 주어졌습니다.","19":"그러므로 가서 모든 민족을 제자로 삼아 아버지와 아들과 성령의 이름 안으로 침례를 주고,","20":"내가 여러분에게 명령한 모든 것을 지키도록 그들을 가르치십시오. 보십시오, 나는 시대의 완성까지 모든 날에 여러분과 함께 있습니다.”"}};
const EN={"1":{"1":"The book of the genealogy of Jesus Christ, son of David, son of Abraham.","2":"Abraham fathered Isaac, Isaac fathered Jacob, and Jacob fathered Judah and his brothers.","3":"Judah fathered Perez and Zerah by Tamar, Perez fathered Hezron, and Hezron fathered Aram.","4":"Aram fathered Amminadab, Amminadab fathered Nahshon, and Nahshon fathered Salmon.","5":"Salmon fathered Boaz by Rahab, Boaz fathered Obed by Ruth, and Obed fathered Jesse.","6":"Jesse fathered David the king. David fathered Solomon by the wife of Uriah.","7":"Solomon fathered Rehoboam, Rehoboam fathered Abijah, and Abijah fathered Asaph.","8":"Asaph fathered Jehoshaphat, Jehoshaphat fathered Joram, and Joram fathered Uzziah.","9":"Uzziah fathered Jotham, Jotham fathered Ahaz, and Ahaz fathered Hezekiah.","10":"Hezekiah fathered Manasseh, Manasseh fathered Amos, and Amos fathered Josiah.","11":"Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon.","12":"After the deportation to Babylon, Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.","13":"Zerubbabel fathered Abiud, Abiud fathered Eliakim, and Eliakim fathered Azor.","14":"Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.","15":"Eliud fathered Eleazar, Eleazar fathered Matthan, and Matthan fathered Jacob.","16":"Jacob fathered Joseph, the husband of Mary, from whom Jesus was born, who is called Christ.","17":"So all the generations from Abraham to David were fourteen generations, from David to the deportation to Babylon fourteen generations, and from the deportation to Babylon to the Christ fourteen generations.","18":"Now the birth of Jesus Christ happened in this way. When His mother Mary had been betrothed to Joseph, before they came together she was found to be pregnant from the Holy Spirit.","19":"Joseph her husband, being righteous and not wishing to expose her publicly, intended to divorce her quietly.","20":"But while he was considering these things, look, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.","21":"She will bear a son, and you shall call His name Jesus, for He will save His people from their sins.”","22":"Now all this happened so that what was spoken by the Lord through the prophet might be fulfilled:","23":"“Look, the virgin will conceive and bear a son, and they will call His name Immanuel,” which translated means, “God with us.”","24":"Then Joseph, having awakened from sleep, did as the angel of the Lord commanded him and took his wife.","25":"But he did not know her until she had borne a son, and he called His name Jesus."},"2":{"1":"Now after Jesus was born in Bethlehem of Judea in the days of Herod the king, look, magi from the east arrived in Jerusalem,","2":"saying, “Where is the One who has been born King of the Jews? For we saw His star in the east and have come to worship Him.”","3":"When Herod the king heard this, he was troubled, and all Jerusalem with him.","4":"And gathering all the chief priests and scribes of the people, he inquired of them where the Christ was to be born.","5":"They said to him, “In Bethlehem of Judea, for so it has been written through the prophet:","6":"‘And you, Bethlehem, land of Judah, are by no means least among the rulers of Judah; for from you will come a Ruler who will shepherd My people Israel.’”","7":"Then Herod secretly called the magi and determined from them precisely the time when the star appeared.","8":"And sending them to Bethlehem, he said, “Go and search carefully for the child, and when you have found Him, report to me, so that I too may go and worship Him.”","9":"After hearing the king, they went their way. And look, the star that they had seen in the east went before them until it came and stood over the place where the child was.","10":"When they saw the star, they rejoiced with exceedingly great joy.","11":"And entering the house, they saw the child with Mary His mother, and falling down they worshiped Him. Then opening their treasures, they offered Him gifts: gold, frankincense, and myrrh.","12":"And having been warned by God in a dream not to return to Herod, they withdrew to their own country by another way.","13":"After they had withdrawn, look, an angel of the Lord appeared to Joseph in a dream, saying, “Rise, take the child and His mother, flee to Egypt, and remain there until I tell you, for Herod is about to seek the child to destroy Him.”","14":"So he rose and took the child and His mother by night and withdrew to Egypt,","15":"and remained there until the death of Herod, so that what was spoken by the Lord through the prophet might be fulfilled: “Out of Egypt I called My Son.”","16":"Then Herod, seeing that he had been deceived by the magi, became exceedingly enraged, and he sent and killed all the boys in Bethlehem and in all its surrounding region who were two years old and under, according to the time that he had precisely determined from the magi.","17":"Then what was spoken through Jeremiah the prophet was fulfilled:","18":"“A voice was heard in Ramah, weeping and great mourning: Rachel weeping for her children, and she refused to be comforted, because they are no more.”","19":"But after Herod died, look, an angel of the Lord appeared in a dream to Joseph in Egypt,","20":"saying, “Rise, take the child and His mother, and go to the land of Israel, for those who were seeking the child’s life are dead.”","21":"So he rose, took the child and His mother, and entered the land of Israel.","22":"But hearing that Archelaus was reigning over Judea in place of his father Herod, he was afraid to go there. And having been warned by God in a dream, he withdrew to the region of Galilee.","23":"And he came and settled in a town called Nazareth, so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”"},"3":{"1":"In those days John the Baptist came, proclaiming in the wilderness of Judea","2":"and saying, “Repent, for the kingdom of the heavens has drawn near.”","3":"For this is the one spoken of through Isaiah the prophet: “A voice of one crying in the wilderness, ‘Prepare the way of the Lord; make His paths straight.’”","4":"Now this John wore clothing of camel’s hair and a leather belt around his waist, and his food was locusts and wild honey.","5":"Then Jerusalem and all Judea and all the region around the Jordan were going out to him,","6":"and they were being baptized by him in the Jordan River, confessing their sins.","7":"But seeing many of the Pharisees and Sadducees coming for baptism, he said to them, “Offspring of vipers, who warned you to flee from the coming wrath?","8":"Therefore produce fruit worthy of repentance.","9":"And do not think to say among yourselves, ‘We have Abraham as our father.’ For I tell you that God is able from these stones to raise up children for Abraham.","10":"Already the axe is laid at the root of the trees. Therefore every tree not producing good fruit is cut down and thrown into the fire.","11":"I baptize you in water for repentance, but the One coming after me is mightier than I, whose sandals I am not worthy to carry. He will baptize you in the Holy Spirit and fire.","12":"His winnowing fork is in His hand, and He will thoroughly cleanse His threshing floor and gather His wheat into the barn, but the chaff He will burn with unquenchable fire.”","13":"Then Jesus came from Galilee to the Jordan, to John, to be baptized by him.","14":"But John tried to prevent Him, saying, “I need to be baptized by You, and do You come to me?”","15":"But Jesus answered and said to him, “Allow it now, for in this way it is fitting for us to fulfill all righteousness.” Then he allowed Him.","16":"And after being baptized, Jesus immediately came up from the water. And look, the heavens were opened to Him, and He saw the Spirit of God descending like a dove and coming upon Him.","17":"And look, a voice from the heavens said, “This is My beloved Son, in whom I am well pleased.”"},"4":{"1":"Then Jesus was led up by the Spirit into the wilderness to be tempted by the devil.","2":"And after fasting forty days and forty nights, He became hungry.","3":"And the tempter came and said to Him, “If You are the Son of God, speak so that these stones may become loaves of bread.”","4":"But He answered and said, “It is written: ‘Man shall not live by bread alone, but by every word that proceeds through the mouth of God.’”","5":"Then the devil took Him into the holy city and set Him on the pinnacle of the temple","6":"and said to Him, “If You are the Son of God, throw Yourself down, for it is written: ‘He will command His angels concerning You,’ and, ‘On their hands they will bear You up, lest You strike Your foot against a stone.’”","7":"Jesus said to him, “Again it is written: ‘You shall not put the Lord your God to the test.’”","8":"Again the devil took Him to a very high mountain and showed Him all the kingdoms of the world and their glory.","9":"And he said to Him, “All these things I will give You if You fall down and worship me.”","10":"Then Jesus said to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and Him alone you shall serve.’”","11":"Then the devil left Him, and look, angels came and ministered to Him.","12":"Now when Jesus heard that John had been handed over, He withdrew into Galilee.","13":"And leaving Nazareth, He came and settled in Capernaum by the sea, in the regions of Zebulun and Naphtali,","14":"so that what was spoken through Isaiah the prophet might be fulfilled:","15":"“Land of Zebulun and land of Naphtali, way of the sea, beyond the Jordan, Galilee of the Gentiles—","16":"the people sitting in darkness saw a great light, and for those sitting in the land and shadow of death, a light arose.”","17":"From that time Jesus began to proclaim and to say, “Repent, for the kingdom of the heavens has drawn near.”","18":"And walking by the Sea of Galilee, He saw two brothers, Simon called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.","19":"And He said to them, “Come after Me, and I will make you fishers of people.”","20":"And immediately they left the nets and followed Him.","21":"And going on from there, He saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and He called them.","22":"And immediately they left the boat and their father and followed Him.","23":"And Jesus went throughout all Galilee, teaching in their synagogues, proclaiming the gospel of the kingdom, and healing every disease and every sickness among the people.","24":"And the report about Him went out into all Syria. And they brought to Him all those who were ill, afflicted with various diseases and pains, those possessed by demons, those having seizures, and paralytics; and He healed them.","25":"And great crowds followed Him from Galilee and Decapolis and Jerusalem and Judea and from beyond the Jordan."},"5":{"1":"And seeing the crowds, He went up on the mountain; and when He sat down, His disciples came to Him.","2":"And opening His mouth, He taught them, saying:","3":"“Blessed are the poor in spirit, for theirs is the kingdom of the heavens.","4":"Blessed are those who mourn, for they will be comforted.","5":"Blessed are the meek, for they will inherit the earth.","6":"Blessed are those who hunger and thirst for righteousness, for they will be filled.","7":"Blessed are the merciful, for they will receive mercy.","8":"Blessed are the pure in heart, for they will see God.","9":"Blessed are the peacemakers, for they will be called sons of God.","10":"Blessed are those who have been persecuted for righteousness, for theirs is the kingdom of the heavens.","11":"Blessed are you when people insult you and persecute you and falsely say every kind of evil against you because of Me.","12":"Rejoice and be exceedingly glad, for your reward is great in the heavens; for in the same way they persecuted the prophets who were before you.","13":"You are the salt of the earth. But if the salt becomes tasteless, with what will it be salted? It is no longer good for anything except to be thrown outside and trampled by people.","14":"You are the light of the world. A city set on a mountain cannot be hidden.","15":"Nor do people light a lamp and put it under a basket, but on the lampstand, and it shines for everyone in the house.","16":"In the same way, let your light shine before people, so that they may see your good works and glorify your Father who is in the heavens.","17":"Do not think that I came to abolish the Law or the Prophets. I did not come to abolish but to fulfill.","18":"For truly I tell you, until heaven and earth pass away, not one iota or one stroke will pass from the Law until all things happen.","19":"Therefore whoever loosens one of the least of these commandments and teaches people so will be called least in the kingdom of the heavens; but whoever does and teaches them will be called great in the kingdom of the heavens.","20":"For I tell you that unless your righteousness exceeds that of the scribes and Pharisees, you will certainly not enter the kingdom of the heavens.","21":"You heard that it was said to the ancients, ‘You shall not murder,’ and ‘Whoever murders will be liable to judgment.’","22":"But I tell you that everyone who is angry with his brother will be liable to judgment; whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says, ‘Fool,’ will be liable to the Gehenna of fire.","23":"Therefore if you are offering your gift at the altar and there remember that your brother has something against you,","24":"leave your gift there before the altar, and first go and be reconciled to your brother; then come and offer your gift.","25":"Come to terms quickly with your accuser while you are with him on the way, lest the accuser hand you over to the judge, and the judge to the guard, and you be thrown into prison.","26":"Truly I tell you, you will certainly not come out from there until you have paid the last penny.","27":"You heard that it was said, ‘You shall not commit adultery.’","28":"But I tell you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart.","29":"And if your right eye causes you to stumble, tear it out and throw it from you; for it is better for you that one of your members perish than that your whole body be thrown into Gehenna.","30":"And if your right hand causes you to stumble, cut it off and throw it from you; for it is better for you that one of your members perish than that your whole body go into Gehenna.","31":"It was also said, ‘Whoever divorces his wife, let him give her a certificate of divorce.’","32":"But I tell you that everyone who divorces his wife, except on account of sexual immorality, makes her commit adultery; and whoever marries a divorced woman commits adultery.","33":"Again, you heard that it was said to the ancients, ‘You shall not swear falsely, but shall fulfill your oaths to the Lord.’","34":"But I tell you not to swear at all: neither by heaven, because it is the throne of God;","35":"nor by the earth, because it is the footstool of His feet; nor by Jerusalem, because it is the city of the great King.","36":"Nor shall you swear by your head, because you cannot make one hair white or black.","37":"But let your word be ‘Yes, yes,’ ‘No, no.’ Anything beyond these is from evil [or: from the evil one].","38":"You heard that it was said, ‘An eye for an eye and a tooth for a tooth.’","39":"But I tell you not to retaliate against an evil person. Rather, whoever strikes you on your right cheek, turn the other to him also.","40":"And to the one who wants to sue you and take your tunic, let him have your cloak also.","41":"And whoever compels you to go one mile, go with him two.","42":"Give to the one who asks you, and do not turn away from the one who wants to borrow from you.","43":"You heard that it was said, ‘You shall love your neighbor and hate your enemy.’","44":"But I tell you: love your enemies and pray for those who persecute you,","45":"so that you may become sons of your Father who is in the heavens; for He makes His sun rise on evil and good people and sends rain on righteous and unrighteous people.","46":"For if you love those who love you, what reward do you have? Do not even the tax collectors do the same?","47":"And if you greet only your brothers, what extraordinary thing are you doing? Do not even the Gentiles do the same?","48":"Therefore you shall be perfect [also: complete, mature, whole], as your heavenly Father is perfect."},"6":{"1":"Be careful not to practice your righteousness before people in order to be seen by them; otherwise you have no reward with your Father who is in the heavens.","2":"Therefore when you give to the needy, do not sound a trumpet before you as the hypocrites do in the synagogues and streets so that they may be glorified by people. Truly I tell you, they have received their reward in full.","3":"But when you give to the needy, do not let your left hand know what your right hand is doing,","4":"so that your giving may be in secret; and your Father who sees in secret will repay you.","5":"And when you pray, you shall not be like the hypocrites, for they love to stand and pray in the synagogues and at the street corners so that they may be seen by people. Truly I tell you, they have received their reward in full.","6":"But when you pray, enter your inner room, shut your door, and pray to your Father who is in secret; and your Father who sees in secret will repay you.","7":"And when you pray, do not babble repetitively like the Gentiles, for they think that in their many words they will be heard.","8":"Therefore do not be like them, for your Father knows what you need before you ask Him.","9":"Therefore pray in this way: ‘Our Father who is in the heavens, let Your name be sanctified.","10":"Let Your kingdom come. Let Your will be done, as in heaven, so also on earth.","11":"Give us today our necessary bread [also: bread for today; bread for the coming day],","12":"and forgive us our debts, as we also have forgiven our debtors,","13":"and do not bring us into temptation [also: testing], but deliver us from evil [or: the evil one].’","14":"For if you forgive people their trespasses, your heavenly Father will also forgive you.","15":"But if you do not forgive people, neither will your Father forgive your trespasses.","16":"And when you fast, do not become gloomy like the hypocrites, for they disfigure their faces so that their fasting may be seen by people. Truly I tell you, they have received their reward in full.","17":"But when you fast, anoint your head and wash your face,","18":"so that your fasting may not be seen by people but by your Father who is in secret; and your Father who sees in secret will repay you.","19":"Do not store up for yourselves treasures on earth, where moth and corrosion destroy and where thieves break in and steal.","20":"But store up for yourselves treasures in heaven, where neither moth nor corrosion destroys and where thieves do not break in or steal.","21":"For where your treasure is, there your heart will be also.","22":"The lamp of the body is the eye. Therefore if your eye is clear [also: single, sincere, generous], your whole body will be full of light.","23":"But if your eye is bad, your whole body will be dark. Therefore if the light in you is darkness, how great is the darkness!","24":"No one can serve two masters, for either he will hate the one and love the other, or he will be devoted to one and despise the other. You cannot serve God and mammon.","25":"Therefore I tell you, do not be anxious about your life, what you will eat or what you will drink, nor about your body, what you will wear. Is not life more than food and the body more than clothing?","26":"Look at the birds of heaven: they neither sow nor reap nor gather into barns, and your heavenly Father feeds them. Are you not worth much more than they?","27":"And which of you by being anxious can add one cubit to his lifespan [or: stature]?","28":"And why are you anxious about clothing? Consider carefully how the lilies of the field grow: they neither labor nor spin.","29":"Yet I tell you that not even Solomon in all his glory was clothed like one of these.","30":"But if God so clothes the grass of the field, which is here today and tomorrow is thrown into an oven, will He not much more clothe you, you of little faith?","31":"Therefore do not be anxious, saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’","32":"For the Gentiles eagerly seek all these things, and your heavenly Father knows that you need them all.","33":"But seek first His kingdom and His righteousness, and all these things will be added to you.","34":"Therefore do not be anxious about tomorrow, for tomorrow will be anxious for itself. Sufficient for the day is its own trouble."},"7":{"1":"Do not judge, so that you may not be judged.","2":"For with the judgment you judge, you will be judged; and with the measure you measure, it will be measured to you.","3":"And why do you see the speck in your brother’s eye but do not notice the beam in your own eye?","4":"Or how will you say to your brother, ‘Let me remove the speck from your eye,’ and look, the beam is in your eye?","5":"Hypocrite! First remove the beam from your own eye, and then you will see clearly to remove the speck from your brother’s eye.","6":"Do not give what is holy to dogs, nor throw your pearls before pigs, lest they trample them with their feet and turn and tear you apart.","7":"Ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.","8":"For everyone who asks receives, and the one who seeks finds, and to the one who knocks it will be opened.","9":"Or what person among you, if his son asks him for bread, will give him a stone?","10":"Or if he asks for a fish, will give him a snake?","11":"Therefore if you, being evil, know how to give good gifts to your children, how much more will your Father who is in the heavens give good things to those who ask Him!","12":"Therefore, whatever you want people to do to you, do the same also to them; for this is the Law and the Prophets.","13":"Enter through the narrow gate, for wide is the gate and broad is the way that leads to destruction, and many are those who enter through it.","14":"For narrow is the gate and constricted is the way that leads to life, and few are those who find it.","15":"Beware of false prophets, who come to you in sheep’s clothing but inwardly are ravenous wolves.","16":"You will know them by their fruits. Do people gather grapes from thorns or figs from thistles?","17":"In the same way, every good tree produces good fruit, but the bad tree produces bad fruit.","18":"A good tree cannot produce bad fruit, nor can a bad tree produce good fruit.","19":"Every tree not producing good fruit is cut down and thrown into the fire.","20":"Therefore you will know them by their fruits.","21":"Not everyone who says to Me, ‘Lord, Lord,’ will enter the kingdom of the heavens, but the one who does the will of My Father who is in the heavens.","22":"Many will say to Me in that day, ‘Lord, Lord, did we not prophesy in Your name, and in Your name cast out demons, and in Your name do many works of power?’","23":"And then I will declare to them, ‘I never knew you. Depart from Me, you workers of lawlessness.’","24":"Therefore everyone who hears these words of Mine and does them will be like a wise man who built his house on the rock.","25":"And the rain came down, the floods came, and the winds blew and beat against that house, and it did not fall, for it had been founded on the rock.","26":"And everyone who hears these words of Mine and does not do them will be like a foolish man who built his house on the sand.","27":"And the rain came down, the floods came, and the winds blew and struck that house, and it fell, and great was its fall.","28":"And when Jesus finished these words, the crowds were astonished at His teaching,","29":"for He was teaching them as one having authority, and not as their scribes."},
8:{"1": "When He came down from the mountain, large crowds followed Him.", "2": "And behold, a leper came to Him and bowed before Him, saying, “Lord, if You are willing, You are able to cleanse me.”", "3": "And stretching out His hand, He touched him, saying, “I am willing. Be cleansed.” And immediately his leprosy was cleansed.", "4": "And Jesus said to him, “See that you tell no one. But go, show yourself to the priest, and offer the gift that Moses commanded, as a testimony to them.”", "5": "When He entered Capernaum, a centurion came to Him, pleading with Him", "6": "and saying, “Lord, my servant is lying paralyzed in the house, suffering terribly.”", "7": "And He said to him, “I will come and heal him.”", "8": "But the centurion answered, “Lord, I am not worthy for You to come under my roof. But only speak a word, and my servant will be healed.", "9": "For I too am a man under authority, having soldiers under me. I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.”", "10": "When Jesus heard this, He marveled and said to those following Him, “Truly I say to you, with no one in Israel have I found such great faith.", "11": "And I say to you that many will come from east and west and recline at table with Abraham and Isaac and Jacob in the kingdom of the heavens,", "12": "but the sons of the kingdom will be cast into the outer darkness. There will be weeping and gnashing of teeth.”", "13": "Then Jesus said to the centurion, “Go; let it be done for you as you have believed.” And his servant was healed in that hour.", "14": "When Jesus came into Peter’s house, He saw his mother-in-law lying sick with a fever.", "15": "He touched her hand, and the fever left her; and she arose and served Him.", "16": "When evening came, they brought to Him many who were demon-possessed. He cast out the spirits with a word and healed all who were sick,", "17": "so that what was spoken through Isaiah the prophet might be fulfilled: “He Himself took our weaknesses and bore our diseases.”", "18": "When Jesus saw a crowd around Him, He gave orders to go to the other side.", "19": "And a scribe came and said to Him, “Teacher, I will follow You wherever You go.”", "20": "Jesus said to him, “The foxes have dens and the birds of heaven have nests, but the Son of Man has nowhere to lay His head.”", "21": "Another of the disciples said to Him, “Lord, permit me first to go and bury my father.”", "22": "But Jesus said to him, “Follow Me, and let the dead bury their own dead.”", "23": "And when He got into the boat, His disciples followed Him.", "24": "And behold, a great storm arose on the sea, so that the boat was being covered by the waves; but He was sleeping.", "25": "They came and awakened Him, saying, “Lord, save us! We are perishing!”", "26": "And He said to them, “Why are you afraid, you of little faith?” Then He arose and rebuked the winds and the sea, and there was a great calm.", "27": "And the men marveled, saying, “What kind of man is this, that even the winds and the sea obey Him?”", "28": "When He came to the other side, into the region of the Gadarenes, two demon-possessed men coming out of the tombs met Him. They were extremely violent, so that no one was able to pass by that way.", "29": "And behold, they cried out, saying, “What do we have to do with You, Son of God? Have You come here to torment us before the appointed time?”", "30": "Now a large herd of pigs was feeding at some distance from them.", "31": "And the demons pleaded with Him, saying, “If You cast us out, send us into the herd of pigs.”", "32": "And He said to them, “Go.” So they came out and went into the pigs. And behold, the whole herd rushed down the steep slope into the sea and died in the waters.", "33": "Those tending them fled, went into the city, and reported everything, including what had happened to the demon-possessed men.", "34": "And behold, the whole city came out to meet Jesus. When they saw Him, they pleaded with Him to depart from their region."},
9:{"1": "And getting into a boat, He crossed over and came to His own city.", "2": "And behold, they brought to Him a paralyzed man lying on a bed. Seeing their faith, Jesus said to the paralyzed man, “Take courage, child; your sins are forgiven.”", "3": "And behold, some of the scribes said among themselves, “This man blasphemes.”", "4": "Knowing their thoughts, Jesus said, “Why do you think evil things in your hearts?", "5": "For which is easier, to say, ‘Your sins are forgiven,’ or to say, ‘Rise and walk’?", "6": "But so that you may know that the Son of Man has authority on earth to forgive sins”—then He said to the paralyzed man—“Rise, take up your bed, and go to your house.”", "7": "And he rose and went to his house.", "8": "When the crowds saw this, they were afraid and glorified God, who had given such authority to human beings.", "9": "As Jesus passed on from there, He saw a man called Matthew sitting at the tax booth, and He said to him, “Follow Me.” And he rose and followed Him.", "10": "And as Jesus reclined at table in the house, behold, many tax collectors and sinners came and reclined with Jesus and His disciples.", "11": "When the Pharisees saw this, they said to His disciples, “Why does your Teacher eat with tax collectors and sinners?”", "12": "But when He heard it, He said, “Those who are healthy have no need of a physician, but those who are sick do.", "13": "Go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous, but sinners.”", "14": "Then the disciples of John came to Him, saying, “Why do we and the Pharisees fast, but Your disciples do not fast?”", "15": "And Jesus said to them, “Can the wedding guests mourn while the bridegroom is with them? But days will come when the bridegroom is taken away from them, and then they will fast.", "16": "No one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment and a worse tear results.", "17": "Nor do they put new wine into old wineskins. Otherwise the wineskins burst, the wine is poured out, and the wineskins are ruined. But they put new wine into fresh wineskins, and both are preserved.”", "18": "While He was saying these things to them, behold, a ruler came and bowed before Him, saying, “My daughter has just died. But come and lay Your hand on her, and she will live.”", "19": "And Jesus rose and followed him, and so did His disciples.", "20": "And behold, a woman suffering from a flow of blood for twelve years came up behind Him and touched the fringe of His garment.", "21": "For she was saying to herself, “If only I touch His garment, I will be saved.”", "22": "But Jesus turned, saw her, and said, “Take courage, daughter; your faith has saved you.” And the woman was healed from that hour.", "23": "When Jesus came into the ruler’s house and saw the flute players and the crowd making a commotion,", "24": "He said, “Go away, for the girl has not died but is sleeping.” And they laughed at Him.", "25": "But when the crowd had been put outside, He went in and took her by the hand, and the girl arose.", "26": "And the report of this went out into that whole region.", "27": "As Jesus passed on from there, two blind men followed Him, crying out, “Have mercy on us, Son of David!”", "28": "When He entered the house, the blind men came to Him. And Jesus said to them, “Do you believe that I am able to do this?” They said to Him, “Yes, Lord.”", "29": "Then He touched their eyes, saying, “Let it be done to you according to your faith.”", "30": "And their eyes were opened. Jesus sternly warned them, saying, “See that no one knows it.”", "31": "But they went out and spread the report about Him throughout that whole region.", "32": "As they were going out, behold, they brought to Him a demon-possessed man who could not speak.", "33": "And when the demon had been cast out, the mute man spoke. The crowds marveled, saying, “Never has anything like this appeared in Israel.”", "34": "But the Pharisees said, “By the ruler of the demons He casts out the demons.”", "35": "And Jesus went throughout all the cities and villages, teaching in their synagogues, proclaiming the gospel of the kingdom, and healing every disease and every sickness.", "36": "Seeing the crowds, He was moved with compassion for them, because they were harassed and cast down, like sheep without a shepherd.", "37": "Then He said to His disciples, “The harvest is plentiful, but the workers are few.", "38": "Therefore ask the Lord of the harvest to send out workers into His harvest.”"},
10:{"1": "Calling His twelve disciples to Him, He gave them authority over unclean spirits, to cast them out and to heal every disease and every sickness.", "2": "Now the names of the twelve apostles are these: first Simon, who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother;", "3": "Philip and Bartholomew; Thomas and Matthew the tax collector; James the son of Alphaeus, and Thaddaeus;", "4": "Simon the Cananaean, and Judas Iscariot, who also handed Him over.", "5": "These twelve Jesus sent out, instructing them, saying, “Do not go into a way of the Gentiles, and do not enter a city of the Samaritans.", "6": "But go rather to the lost sheep of the house of Israel.", "7": "And as you go, proclaim, saying, ‘The kingdom of the heavens has drawn near.’", "8": "Heal the sick, raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.", "9": "Do not acquire gold or silver or copper for your belts,", "10": "no bag for the journey, nor two tunics, nor sandals, nor a staff; for the worker is worthy of his food.", "11": "Whatever city or village you enter, find out who in it is worthy, and stay there until you leave.", "12": "As you enter the house, greet it.", "13": "And if the house is worthy, let your peace come upon it; but if it is not worthy, let your peace return to you.", "14": "And whoever does not receive you or listen to your words, as you go out of that house or city, shake the dust off your feet.", "15": "Truly I say to you, it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that city.", "16": "Behold, I send you out as sheep in the midst of wolves. Therefore be wise as serpents and innocent as doves.", "17": "But beware of people, for they will hand you over to councils and flog you in their synagogues.", "18": "And you will be brought before governors and kings because of Me, as a testimony to them and to the Gentiles.", "19": "But when they hand you over, do not be anxious about how or what you should speak, for what you should speak will be given to you in that hour.", "20": "For it is not you who speak, but the Spirit of your Father speaking in you.", "21": "Brother will hand over brother to death, and a father his child; and children will rise up against parents and put them to death.", "22": "And you will be hated by all because of My name. But the one who endures to the end will be saved.", "23": "When they persecute you in this city, flee to another. For truly I say to you, you will certainly not finish going through the cities of Israel until the Son of Man comes.", "24": "A disciple is not above the teacher, nor a servant above his master.", "25": "It is enough for the disciple to become like his teacher and the servant like his master. If they have called the master of the house Beelzebul, how much more those of his household!", "26": "Therefore do not fear them, for nothing is covered that will not be revealed, and nothing hidden that will not be made known.", "27": "What I say to you in the darkness, speak in the light; and what you hear in the ear, proclaim on the housetops.", "28": "And do not fear those who kill the body but are unable to kill the soul. Rather fear the One who is able to destroy both soul and body in Gehenna.", "29": "Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father.", "30": "But even the hairs of your head are all numbered.", "31": "Therefore do not fear; you are worth more than many sparrows.", "32": "Therefore everyone who acknowledges Me before people, I also will acknowledge before My Father who is in the heavens.", "33": "But whoever denies Me before people, I also will deny before My Father who is in the heavens.", "34": "Do not think that I came to bring peace upon the earth. I did not come to bring peace, but a sword.", "35": "For I came to set a man against his father, a daughter against her mother, and a daughter-in-law against her mother-in-law;", "36": "and a person’s enemies will be those of his own household.", "37": "The one who loves father or mother more than Me is not worthy of Me, and the one who loves son or daughter more than Me is not worthy of Me.", "38": "And the one who does not take his cross and follow after Me is not worthy of Me.", "39": "The one who finds his life will lose it, and the one who loses his life because of Me will find it.", "40": "The one who receives you receives Me, and the one who receives Me receives the One who sent Me.", "41": "The one who receives a prophet in the name of a prophet will receive a prophet’s reward, and the one who receives a righteous person in the name of a righteous person will receive a righteous person’s reward.", "42": "And whoever gives one of these little ones even a cup of cold water to drink in the name of a disciple, truly I say to you, he will certainly not lose his reward.”"},
11:{"1": "When Jesus had finished instructing His twelve disciples, He departed from there to teach and proclaim in their cities.", "2": "Now when John heard in prison about the works of the Christ, he sent word through his disciples", "3": "and said to Him, “Are You the One who is coming, or should we wait for another?”", "4": "Jesus answered them, “Go and report to John what you hear and see:", "5": "the blind see, the lame walk, lepers are cleansed, the deaf hear, the dead are raised, and the poor have good news proclaimed to them.", "6": "And blessed is anyone who does not stumble because of Me.”", "7": "As they were leaving, Jesus began to speak to the crowds concerning John: “What did you go out into the wilderness to see? A reed shaken by the wind?", "8": "But what did you go out to see? A man dressed in soft clothing? Behold, those who wear soft clothing are in kings’ houses.", "9": "But what did you go out to see? A prophet? Yes, I tell you, and more than a prophet.", "10": "This is the one about whom it is written, ‘Behold, I send My messenger before Your face, who will prepare Your way before You.’", "11": "Truly I say to you, among those born of women no one greater than John the Baptist has arisen; yet the one who is smaller in the kingdom of the heavens is greater than he.", "12": "From the days of John the Baptist until now, the kingdom of the heavens advances forcefully [or: suffers violence], and forceful people seize it [or: violent people take it by force].", "13": "For all the prophets and the Law prophesied until John.", "14": "And if you are willing to receive it, he is Elijah who is to come.", "15": "The one who has ears, let him hear.", "16": "But to what shall I compare this generation? It is like children sitting in the marketplaces who call to the others", "17": "and say, ‘We played the flute for you, and you did not dance; we mourned, and you did not beat your breasts.’", "18": "For John came neither eating nor drinking, and they say, ‘He has a demon.’", "19": "The Son of Man came eating and drinking, and they say, ‘Behold, a glutton and a wine drinker, a friend of tax collectors and sinners!’ Yet wisdom is shown to be right by her works.”", "20": "Then He began to reproach the cities in which most of His mighty works had been done, because they did not repent.", "21": "“Woe to you, Chorazin! Woe to you, Bethsaida! For if the mighty works done in you had been done in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.", "22": "But I tell you, it will be more bearable for Tyre and Sidon on the day of judgment than for you.", "23": "And you, Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had been done in Sodom, it would have remained until today.", "24": "But I tell you that it will be more bearable for the land of Sodom on the day of judgment than for you.”", "25": "At that time Jesus answered and said, “I praise You, Father, Lord of heaven and earth, because You hid these things from the wise and understanding and revealed them to little children.", "26": "Yes, Father, for this was pleasing before You.", "27": "All things have been handed over to Me by My Father. No one fully knows the Son except the Father, nor does anyone fully know the Father except the Son and anyone to whom the Son chooses to reveal Him.", "28": "Come to Me, all who labor and are burdened, and I will give you rest.", "29": "Take My yoke upon you and learn from Me, for I am gentle and humble in heart, and you will find rest for your souls.", "30": "For My yoke is easy [also: kind, well-fitting], and My burden is light.”"},
12:{"1": "At that time Jesus went through the grainfields on the Sabbath. His disciples became hungry and began to pluck heads of grain and eat.", "2": "When the Pharisees saw it, they said to Him, “Behold, Your disciples are doing what is not lawful to do on the Sabbath.”", "3": "But He said to them, “Have you not read what David did when he and those with him were hungry?", "4": "He entered the house of God and ate the bread of the Presence, which it was not lawful for him or those with him to eat, but only for the priests.", "5": "Or have you not read in the Law that on the Sabbath the priests in the temple profane the Sabbath and are guiltless?", "6": "But I tell you that something greater than the temple is here.", "7": "If you had known what this means, ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.", "8": "For the Son of Man is Lord of the Sabbath.”", "9": "Departing from there, He went into their synagogue.", "10": "And behold, there was a man with a withered hand. They asked Him, “Is it lawful to heal on the Sabbath?” so that they might accuse Him.", "11": "He said to them, “What man among you, having one sheep, if it falls into a pit on the Sabbath, will not take hold of it and lift it out?", "12": "How much more valuable, then, is a human being than a sheep! Therefore it is lawful to do good on the Sabbath.”", "13": "Then He said to the man, “Stretch out your hand.” He stretched it out, and it was restored, healthy like the other.", "14": "But the Pharisees went out and took counsel against Him as to how they might destroy Him.", "15": "Jesus, knowing this, withdrew from there. Many followed Him, and He healed them all", "16": "and warned them not to make Him known.", "17": "This was so that what was spoken through Isaiah the prophet might be fulfilled:", "18": "“Behold My servant whom I chose, My beloved in whom My soul delights. I will put My Spirit upon Him, and He will proclaim justice to the Gentiles.", "19": "He will not quarrel or cry out, nor will anyone hear His voice in the streets.", "20": "A bruised reed He will not break, and a smoldering wick He will not extinguish, until He brings justice to victory.", "21": "And in His name the Gentiles will hope.”", "22": "Then a demon-possessed man who was blind and mute was brought to Him, and He healed him, so that the mute man spoke and saw.", "23": "All the crowds were amazed and said, “Can this be the Son of David?”", "24": "But when the Pharisees heard it, they said, “This man does not cast out demons except by Beelzebul, ruler of the demons.”", "25": "Knowing their thoughts, He said to them, “Every kingdom divided against itself is laid waste, and every city or house divided against itself will not stand.", "26": "And if Satan casts out Satan, he is divided against himself. How then will his kingdom stand?", "27": "And if I cast out demons by Beelzebul, by whom do your sons cast them out? Therefore they will be your judges.", "28": "But if I cast out demons by the Spirit of God, then the kingdom of God has come upon you.", "29": "Or how can someone enter the strong man’s house and plunder his possessions unless he first binds the strong man? Then he will plunder his house.", "30": "The one who is not with Me is against Me, and the one who does not gather with Me scatters.", "31": "Therefore I tell you, every sin and blasphemy will be forgiven people, but blasphemy against the Spirit will not be forgiven.", "32": "And whoever speaks a word against the Son of Man will be forgiven; but whoever speaks against the Holy Spirit will not be forgiven, either in this age or in the age to come.", "33": "Either make the tree good and its fruit good, or make the tree bad and its fruit bad, for the tree is known by its fruit.", "34": "Offspring of vipers! How can you, being evil, speak good things? For out of the abundance of the heart the mouth speaks.", "35": "The good person brings good things out of the good treasure, and the evil person brings evil things out of the evil treasure.", "36": "But I tell you that for every useless word people speak, they will give an account on the day of judgment.", "37": "For by your words you will be justified, and by your words you will be condemned.”", "38": "Then some of the scribes and Pharisees answered Him, saying, “Teacher, we want to see a sign from You.”", "39": "But He answered them, “An evil and adulterous generation seeks a sign, and no sign will be given to it except the sign of Jonah the prophet.", "40": "For just as Jonah was in the belly of the great fish three days and three nights, so the Son of Man will be in the heart of the earth three days and three nights.", "41": "The men of Nineveh will rise up at the judgment with this generation and condemn it, because they repented at the proclamation of Jonah; and behold, something greater than Jonah is here.", "42": "The queen of the South will rise up at the judgment with this generation and condemn it, because she came from the ends of the earth to hear the wisdom of Solomon; and behold, something greater than Solomon is here.", "43": "When the unclean spirit goes out from a person, it passes through waterless places seeking rest and does not find it.", "44": "Then it says, ‘I will return to my house from which I came.’ And when it comes, it finds it empty, swept, and put in order.", "45": "Then it goes and takes with it seven other spirits more evil than itself, and they enter and dwell there; and the last state of that person becomes worse than the first. So also will it be with this evil generation.”", "46": "While He was still speaking to the crowds, behold, His mother and brothers stood outside, seeking to speak to Him.", "47": "[Some manuscripts include: Someone said to Him, “Behold, Your mother and Your brothers are standing outside, seeking to speak to You.”]", "48": "But He answered the one speaking to Him, “Who is My mother, and who are My brothers?”", "49": "And stretching out His hand toward His disciples, He said, “Behold My mother and My brothers!", "50": "For whoever does the will of My Father who is in the heavens, that person is My brother and sister and mother.”"},
13:{"1": "That day Jesus went out of the house and sat beside the sea.", "2": "And large crowds gathered around Him, so that He got into a boat and sat down, while the whole crowd stood on the shore.", "3": "And He spoke many things to them in parables, saying, “Behold, the sower went out to sow.", "4": "And as he sowed, some seeds fell beside the road, and the birds came and devoured them.", "5": "Others fell on rocky places where they did not have much soil, and immediately they sprang up because they had no depth of soil.", "6": "But when the sun rose, they were scorched; and because they had no root, they withered away.", "7": "Others fell among the thorns, and the thorns came up and choked them.", "8": "But others fell on the good soil and produced fruit, some a hundredfold, some sixty, and some thirty.", "9": "The one who has ears, let him hear.”", "10": "And the disciples came and said to Him, “Why do You speak to them in parables?”", "11": "He answered them, “To you it has been given to know the mysteries of the kingdom of the heavens, but to them it has not been given.", "12": "For whoever has, more will be given, and he will have abundance; but whoever does not have, even what he has will be taken away from him.", "13": "Therefore I speak to them in parables, because seeing they do not see, and hearing they do not hear or understand.", "14": "And in them the prophecy of Isaiah is fulfilled, which says, ‘You will indeed hear but never understand, and you will indeed see but never perceive.", "15": "For the heart of this people has become dull; with their ears they have heard heavily, and they have closed their eyes, lest they should see with their eyes, hear with their ears, understand with their heart, turn, and I would heal them.’", "16": "But blessed are your eyes because they see, and your ears because they hear.", "17": "For truly I say to you, many prophets and righteous people desired to see what you see and did not see it, and to hear what you hear and did not hear it.", "18": "You, therefore, hear the parable of the sower.", "19": "When anyone hears the word of the kingdom and does not understand it, the evil one comes and snatches away what was sown in his heart. This is the one sown beside the road.", "20": "The one sown on rocky places is the one who hears the word and immediately receives it with joy,", "21": "yet he has no root in himself but lasts only for a time; and when affliction or persecution arises because of the word, immediately he stumbles.", "22": "The one sown among the thorns is the one who hears the word, but the anxiety of this age and the deceitfulness of riches choke the word, and it becomes unfruitful.", "23": "But the one sown on the good soil is the one who hears the word and understands it, who indeed bears fruit and produces, one a hundredfold, another sixty, and another thirty.”", "24": "He set another parable before them, saying, “The kingdom of the heavens may be compared to a man who sowed good seed in his field.", "25": "But while people were sleeping, his enemy came and sowed weeds among the wheat and went away.", "26": "When the plants sprouted and produced fruit, then the weeds also appeared.", "27": "The servants of the master of the house came and said to him, ‘Master, did you not sow good seed in your field? Where then did the weeds come from?’", "28": "He said to them, ‘An enemy did this.’ The servants said to him, ‘Then do you want us to go and gather them?’", "29": "But he said, ‘No, lest in gathering the weeds you uproot the wheat along with them.", "30": "Let both grow together until the harvest; and at harvest time I will tell the reapers: Gather the weeds first and bind them in bundles to burn them, but gather the wheat into my barn.’”", "31": "He set another parable before them, saying, “The kingdom of the heavens is like a mustard seed that a man took and sowed in his field.", "32": "It is smaller than all the seeds, but when it has grown it is larger than the garden plants and becomes a tree, so that the birds of heaven come and nest in its branches.”", "33": "He spoke another parable to them: “The kingdom of the heavens is like leaven that a woman took and hid in three measures of flour until all of it was leavened.”", "34": "Jesus spoke all these things to the crowds in parables, and apart from a parable He spoke nothing to them.", "35": "This was so that what was spoken through the prophet might be fulfilled: “I will open My mouth in parables; I will utter things hidden from the foundation of the world.”", "36": "Then He left the crowds and went into the house. His disciples came to Him, saying, “Explain to us the parable of the weeds of the field.”", "37": "He answered, “The one who sows the good seed is the Son of Man.", "38": "The field is the world, and the good seed—these are the sons of the kingdom; the weeds are the sons of the evil one.", "39": "The enemy who sowed them is the devil, the harvest is the completion of the age, and the reapers are angels.", "40": "Therefore, just as the weeds are gathered and burned with fire, so it will be at the completion of the age.", "41": "The Son of Man will send His angels, and they will gather out of His kingdom all causes of stumbling and those who practice lawlessness,", "42": "and they will throw them into the furnace of fire. There will be weeping and gnashing of teeth.", "43": "Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.", "44": "The kingdom of the heavens is like treasure hidden in a field, which a man found and hid again; and from his joy he goes and sells all that he has and buys that field.", "45": "Again, the kingdom of the heavens is like a merchant seeking fine pearls.", "46": "When he found one pearl of great value, he went and sold all that he had and bought it.", "47": "Again, the kingdom of the heavens is like a net cast into the sea and gathering every kind.", "48": "When it was full, they drew it up on the shore, sat down, gathered the good into containers, but threw the bad away.", "49": "So it will be at the completion of the age. The angels will go out and separate the evil from among the righteous", "50": "and throw them into the furnace of fire. There will be weeping and gnashing of teeth.", "51": "“Have you understood all these things?” They said to Him, “Yes.”", "52": "And He said to them, “Therefore every scribe who has become a disciple for the kingdom of the heavens is like a master of a house who brings out of his treasure things new and old.”", "53": "When Jesus had finished these parables, He departed from there.", "54": "And coming to His hometown, He taught them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these mighty works?", "55": "Is this not the carpenter’s son? Is not His mother called Mary, and His brothers James and Joseph and Simon and Judas?", "56": "And are not all His sisters with us? Where then did this man get all these things?”", "57": "And they stumbled because of Him. But Jesus said to them, “A prophet is not without honor except in his hometown and in his own household.”", "58": "And He did not do many mighty works there because of their unbelief."},
14:{"1": "At that time Herod the tetrarch heard the report about Jesus", "2": "and said to his servants, “This is John the Baptist. He has been raised from the dead, and therefore these powers are at work in him.”", "3": "For Herod had seized John, bound him, and put him in prison because of Herodias, the wife of Philip his brother.", "4": "For John had been saying to him, “It is not lawful for you to have her.”", "5": "And though he wanted to kill him, he feared the crowd because they regarded John as a prophet.", "6": "But when Herod’s birthday came, the daughter of Herodias danced in their midst and pleased Herod,", "7": "so that with an oath he promised to give her whatever she asked.", "8": "Prompted by her mother, she said, “Give me here on a platter the head of John the Baptist.”", "9": "And the king was grieved, but because of his oaths and those reclining at table with him, he commanded it to be given.", "10": "And he sent and had John beheaded in the prison.", "11": "His head was brought on a platter and given to the girl, and she brought it to her mother.", "12": "And his disciples came, took the body, and buried it; then they went and told Jesus.", "13": "When Jesus heard this, He withdrew from there in a boat to a deserted place by Himself. When the crowds heard it, they followed Him on foot from the cities.", "14": "When He came out, He saw a large crowd, was moved with compassion for them, and healed their sick.", "15": "When evening came, the disciples came to Him, saying, “This place is deserted and the hour is already late. Send the crowds away so that they may go into the villages and buy food for themselves.”", "16": "But Jesus said to them, “They have no need to go away. You give them something to eat.”", "17": "They said to Him, “We have nothing here except five loaves and two fish.”", "18": "And He said, “Bring them here to Me.”", "19": "Then He ordered the crowds to sit down on the grass. Taking the five loaves and the two fish, looking up to heaven, He blessed them; and breaking the loaves, He gave them to the disciples, and the disciples gave them to the crowds.", "20": "And they all ate and were satisfied. They picked up what remained of the broken pieces—twelve baskets full.", "21": "Those who ate were about five thousand men, besides women and children.", "22": "Immediately He compelled the disciples to get into the boat and go ahead of Him to the other side, while He sent the crowds away.", "23": "After sending the crowds away, He went up on the mountain by Himself to pray. When evening came, He was there alone.", "24": "But the boat was already many stadia from the land, being battered by the waves, for the wind was against them.", "25": "And in the fourth watch of the night He came to them, walking on the sea.", "26": "When the disciples saw Him walking on the sea, they were terrified and said, “It is a ghost!” And they cried out in fear.", "27": "But immediately Jesus spoke to them, saying, “Take courage; it is I. Do not be afraid.”", "28": "Peter answered Him, “Lord, if it is You, command me to come to You on the water.”", "29": "And He said, “Come.” Peter got out of the boat and walked on the water and came toward Jesus.", "30": "But seeing the strong wind, he became afraid; and beginning to sink, he cried out, “Lord, save me!”", "31": "Immediately Jesus stretched out His hand and took hold of him, saying, “You of little faith, why did you doubt?”", "32": "And when they got into the boat, the wind ceased.", "33": "Those in the boat bowed before Him, saying, “Truly You are God’s Son.”", "34": "And when they had crossed over, they came to the land of Gennesaret.", "35": "When the men of that place recognized Him, they sent word throughout that whole surrounding region and brought to Him all who were sick.", "36": "And they pleaded with Him that they might only touch the fringe of His garment; and as many as touched it were completely healed."},
15:{"1": "Then Pharisees and scribes came to Jesus from Jerusalem, saying,", "2": "“Why do Your disciples transgress the tradition of the elders? For they do not wash their hands when they eat bread.”", "3": "He answered them, “And why do you transgress the commandment of God because of your tradition?", "4": "For God said, ‘Honor your father and your mother,’ and, ‘The one who speaks evil of father or mother must surely die.’", "5": "But you say, ‘Whoever says to his father or mother, “Whatever benefit you might have received from me is a gift offered to God,”", "6": "need not honor his father.’ Thus you have made the word of God invalid because of your tradition.", "7": "Hypocrites! Isaiah prophesied rightly about you, saying,", "8": "‘This people honors Me with their lips, but their heart is far away from Me.", "9": "In vain they worship Me, teaching as teachings the commandments of men.’”", "10": "And calling the crowd to Him, He said to them, “Hear and understand:", "11": "It is not what enters the mouth that defiles a person, but what comes out of the mouth—this defiles a person.”", "12": "Then the disciples came and said to Him, “Do You know that the Pharisees stumbled when they heard this saying?”", "13": "He answered, “Every plant that My heavenly Father did not plant will be uprooted.", "14": "Leave them. They are blind guides of the blind; and if a blind person guides a blind person, both will fall into a pit.”", "15": "Peter said to Him, “Explain this parable to us.”", "16": "And He said, “Are you also still without understanding?", "17": "Do you not understand that everything entering the mouth goes into the stomach and is expelled into the latrine?", "18": "But the things coming out of the mouth come from the heart, and these defile a person.", "19": "For out of the heart come evil thoughts, murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.", "20": "These are the things that defile a person; but eating with unwashed hands does not defile a person.”", "21": "And Jesus went away from there and withdrew into the region of Tyre and Sidon.", "22": "And behold, a Canaanite woman from that region came out and cried, “Have mercy on me, Lord, Son of David! My daughter is severely demon-possessed.”", "23": "But He did not answer her a word. His disciples came and urged Him, saying, “Send her away, because she keeps crying out behind us.”", "24": "He answered, “I was sent only to the lost sheep of the house of Israel.”", "25": "But she came and bowed before Him, saying, “Lord, help me.”", "26": "He answered, “It is not good to take the children’s bread and throw it to the little dogs.”", "27": "She said, “Yes, Lord, yet even the little dogs eat the crumbs that fall from their masters’ table.”", "28": "Then Jesus answered her, “Woman, great is your faith! Let it be done for you as you desire.” And her daughter was healed from that hour.", "29": "Jesus departed from there and came beside the Sea of Galilee; and going up on the mountain, He sat there.", "30": "Large crowds came to Him, bringing with them the lame, blind, crippled, mute, and many others. They laid them at His feet, and He healed them.", "31": "So the crowd marveled when they saw the mute speaking, the crippled restored, the lame walking, and the blind seeing; and they glorified the God of Israel.", "32": "Jesus called His disciples to Him and said, “I am moved with compassion for the crowd, because they have remained with Me three days already and have nothing to eat. I do not want to send them away hungry, lest they faint on the way.”", "33": "The disciples said to Him, “Where in this deserted place could we get so many loaves as to satisfy such a large crowd?”", "34": "Jesus said to them, “How many loaves do you have?” They said, “Seven, and a few small fish.”", "35": "And He commanded the crowd to sit down on the ground.", "36": "Taking the seven loaves and the fish, He gave thanks, broke them, and gave them to the disciples, and the disciples gave them to the crowds.", "37": "They all ate and were satisfied; and they picked up seven baskets full of the broken pieces that remained.", "38": "Those who ate were four thousand men, besides women and children.", "39": "And after sending the crowds away, He got into the boat and went to the region of Magadan."},
16:{"1": "The Pharisees and Sadducees came and, testing Him, asked Him to show them a sign from heaven.", "2": "He answered them, “When evening comes, you say, ‘It will be fair weather, for the sky is red,’", "3": "and in the morning, ‘Today it will be stormy, for the sky is red and overcast.’ You know how to discern the appearance of the sky, but can you not discern the signs of the times?", "4": "An evil and adulterous generation seeks a sign, but no sign will be given to it except the sign of Jonah.” And He left them and went away.", "5": "When the disciples reached the other side, they had forgotten to bring bread.", "6": "Jesus said to them, “Watch out and beware of the leaven of the Pharisees and Sadducees.”", "7": "They reasoned among themselves, saying, “It is because we brought no bread.”", "8": "Knowing this, Jesus said, “You of little faith, why are you reasoning among yourselves because you have no bread?", "9": "Do you still not understand? Do you not remember the five loaves for the five thousand, and how many baskets you gathered?", "10": "Or the seven loaves for the four thousand, and how many baskets you gathered?", "11": "How is it that you do not understand that I was not speaking to you about bread? But beware of the leaven of the Pharisees and Sadducees.”", "12": "Then they understood that He had not told them to beware of the leaven of bread, but of the teaching of the Pharisees and Sadducees.", "13": "When Jesus came into the region of Caesarea Philippi, He asked His disciples, “Who do people say that the Son of Man is?”", "14": "They said, “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”", "15": "He said to them, “But who do you say that I am?”", "16": "Simon Peter answered, “You are the Christ, the Son of the living God.”", "17": "Jesus answered him, “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you, but My Father who is in heaven.", "18": "And I also say to you that you are Peter, and upon this rock I will build My assembly [also: church], and the gates of Hades will not prevail against it.", "19": "I will give you the keys of the kingdom of the heavens; whatever you bind on earth will have been bound in the heavens, and whatever you loose on earth will have been loosed in the heavens.”", "20": "Then He strictly commanded the disciples to tell no one that He was the Christ.", "21": "From that time Jesus began to show His disciples that He must go to Jerusalem, suffer many things from the elders, chief priests, and scribes, be killed, and on the third day be raised.", "22": "Peter took Him aside and began to rebuke Him, saying, “Far be it from You, Lord! This shall never happen to You!”", "23": "But He turned and said to Peter, “Get behind Me, Satan! You are a stumbling block to Me, because you are not setting your mind on the things of God, but on the things of people.”", "24": "Then Jesus said to His disciples, “If anyone wants to come after Me, let him deny himself, take up his cross, and follow Me.", "25": "For whoever wants to save his life will lose it, but whoever loses his life because of Me will find it.", "26": "For what will it benefit a person if he gains the whole world but forfeits his life? Or what will a person give in exchange for his life?", "27": "For the Son of Man is going to come in the glory of His Father with His angels, and then He will repay each person according to his deeds.", "28": "Truly I say to you, there are some standing here who will certainly not taste death until they see the Son of Man coming in His kingdom.”"},"17":{"1":"Six days later Jesus took Peter, James, and John his brother and brought them up a high mountain by themselves.","2":"And He was transfigured before them; His face shone like the sun, and His garments became white as the light.","3":"And behold, Moses and Elijah appeared to them, talking with Him.","4":"Peter said to Jesus, “Lord, it is good for us to be here. If You wish, I will make three shelters here: one for You, one for Moses, and one for Elijah.”","5":"While he was still speaking, behold, a bright cloud overshadowed them, and a voice from the cloud said, “This is My beloved Son, in whom I delight. Listen to Him!”","6":"When the disciples heard this, they fell facedown and were greatly afraid.","7":"Jesus came and touched them, saying, “Rise, and do not be afraid.”","8":"When they lifted up their eyes, they saw no one except Jesus Himself.","9":"As they were coming down from the mountain, Jesus commanded them, “Tell the vision to no one until the Son of Man is raised from the dead.”","10":"The disciples asked Him, “Why then do the scribes say that Elijah must come first?”","11":"He answered, “Elijah indeed comes and will restore all things.","12":"But I tell you that Elijah has already come, and they did not recognize him but did to him whatever they wished. So also the Son of Man is about to suffer at their hands.”","13":"Then the disciples understood that He had spoken to them about John the Baptist.","14":"When they came to the crowd, a man approached Him, kneeling before Him","15":"and saying, “Lord, have mercy on my son, because he suffers severely from seizures; for he often falls into the fire and often into the water.","16":"I brought him to Your disciples, but they could not heal him.”","17":"Jesus answered, “O unbelieving and twisted generation! How long shall I be with you? How long shall I bear with you? Bring him here to Me.”","18":"And Jesus rebuked the demon, and it came out of him; and the boy was healed from that hour.","19":"Then the disciples came to Jesus privately and said, “Why could we not cast it out?”","20":"He said to them, “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move; and nothing will be impossible for you.”","21":"[Some later manuscripts include: “But this kind does not go out ex

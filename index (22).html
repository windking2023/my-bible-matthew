<style>

<body>
<header><div class="wrap">
<div style="font-size:12px;color:#777;letter-spacing:.12em">ΚΑΤΑ ΜΑΤΘΑΙΟΝ</div>
<h1 id="title">Matthew 1</h1>
<div class="nav" id="nav"></div>
<div id="status">내장 번역 + 비교역본 연결 준비</div>
<div class="chapter-audio">
  <button type="button" id="readKoChapter">🔊 한국어 장</button>
  <button type="button" id="readEnChapter">🔊 English chapter</button>
  <button type="button" id="pauseSpeech">⏸ Pause</button>
  <button type="button" id="stopSpeech">⏹ Stop</button>
</div>
</div></header>
<main id="reader"></main>
<div id="dictBackdrop" role="dialog" aria-modal="true" aria-label="Greek word details">
  <div id="dictBox">
    <button id="dictClose" type="button">Close</button>
    <div class="dictlabel">Greek word</div><div id="dictWord"></div>
    <div class="dictrow"><div class="dictlabel">English pronunciation</div><div id="dictTrans"></div></div>
    <div class="dictrow"><div class="dictlabel">English meaning</div><div id="dictMeaning">Loading…</div></div>
    <div class="dictrow"><div class="dictlabel">Strong's</div><div id="dictStrong">—</div></div>
    <div class="dictrow"><div class="dictlabel">Part of speech</div><div id="dictPos"></div></div>
    <div class="dictrow"><div class="dictlabel">Morphology / parse</div><div id="dictParse"></div></div>
    <div class="dictrow"><div class="dictlabel">Lemma</div><div id="dictLemma"></div></div>
  </div>
</div>
<script>

const GREEK_URL='https://raw.githubusercontent.com/morphgnt/sblgnt/master/61-Mt-morphgnt.txt';
let greekCache=null, greekLoading=null, currentChapter=1;

function withTimeout(url,ms=5000){
  const c=new AbortController();
  const timer=setTimeout(()=>c.abort(),ms);
  return fetch(url,{signal:c.signal,cache:'force-cache'}).finally(()=>clearTimeout(timer));
}
function parseMorphGNT(txt){
  const out={};
  txt.split(/\r?\n/).forEach(line=>{
    line=line.trim(); if(!line)return;
    const p=line.split(/\s+/);
    if(p.length<7)return;
    const bcv=p[0];
    const ch=Number(bcv.slice(2,4)), v=Number(bcv.slice(4,6));
    if(ch<1||ch>28)return;
    const item={pos:p[1],parse:p[2],surface:p[4],norm:p[5],lemma:p[6]};
    if(!out[ch])out[ch]={};
    if(!out[ch][v])out[ch][v]=[];
    out[ch][v].push(item);
  });
  return out;
}
function stripGreek(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function hasRough(s){return (s||'').normalize('NFD').includes('\u0314');}
function romanGreek(s){
  let x=stripGreek(s);
  [['αι','ai'],['ει','ei'],['οι','oi'],['ου','ou'],['αυ','au'],['ευ','eu'],['ηυ','ēu'],['γγ','ng'],['γκ','nk'],['γχ','nch']].forEach(([a,b])=>x=x.split(a).join(b));
  const m={'α':'a','β':'b','γ':'g','δ':'d','ε':'e','ζ':'z','η':'ē','θ':'th','ι':'i','κ':'k','λ':'l','μ':'m','ν':'n','ξ':'x','ο':'o','π':'p','ρ':'r','σ':'s','ς':'s','τ':'t','υ':'y','φ':'ph','χ':'ch','ψ':'ps','ω':'ō'};
  let r=[...x].map(c=>m[c]??c).join('');
  if(hasRough(s)&&/^[aeēioōy]/.test(r))r='h'+r;
  return r;
}

const MATT_PRON_OVERRIDES={
  'αβρααμ':'아브라암','εγεννησεν':'에겐네센','ισαακ':'이사악',
  'δαυιδ':'다위드','δαυιδ':'다위드',
  'ιακωβ':'이아코브','ιουδαν':'이우단','αδελφους':'아델푸스',
  'τον':'톤','τους':'투스','δε':'데','και':'카이','αυτου':'아우투',
  'γενεσεως':'게네세오스','κρινετε':'크리네테','κριθητε':'크리테테',
  'θεος':'테오스','θεον':'테온','θεου':'테우','υιος':'휘오스','υιου':'휘우','υιον':'휘온','υιω':'휘오','υιοι':'휘오이','υιους':'휘우스',
  'οψε':'옵세','σαββατων':'삽바톤'
};
function normGreekPron(x){
  return (x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
    .replace(/[·.,;:!?“”"'()[\]{}]/g,'');
}
function koApprox(s){
  // Traditional Bible-study style Korean approximation.
  // Important: compose final consonants into Hangul syllables instead of
  // exposing standalone jamo such as ㄴ/ㄹ/ㅁ.
  const strip=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const words=s.replace(/[·.,;:!?“”"'()[\]{}]/g,' ').split(/\s+/).filter(Boolean);

  const onsetMap={
    '':'ㅇ','b':'ㅂ','g':'ㄱ','d':'ㄷ','z':'ㅈ','th':'ㅌ','k':'ㅋ','l':'ㄹ',
    'm':'ㅁ','n':'ㄴ','x':'ㅋㅅ','p':'ㅍ','r':'ㄹ','s':'ㅅ','t':'ㅌ','ph':'ㅍ',
    'ch':'ㅋ','ps':'ㅍㅅ','h':'ㅎ'
  };
  const vowelMap={
    'a':'ㅏ','e':'ㅔ','i':'ㅣ','o':'ㅗ','u':'ㅜ',
    'ai':'ㅏㅣ','ei':'ㅔㅣ','oi':'ㅗㅣ','ui':'ㅟ','au':'ㅏㅜ','eu':'ㅔㅜ','ou':'ㅜ'
  };
  const finalMap={'n':'ㄴ','m':'ㅁ','l':'ㄹ','r':'ㄹ','k':'ㄱ','g':'ㄱ','t':'ㅅ','p':'ㅂ'};

  const L=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const V=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const T=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  function compose(on,vow,fin=''){
    let oi=L.indexOf(on), vi=V.indexOf(vow), fi=T.indexOf(fin);
    if(oi<0||vi<0||fi<0) return '';
    return String.fromCharCode(0xAC00+(oi*21+vi)*28+fi);
  }
  function vowelJamo(v){
    if(v==='a')return 'ㅏ'; if(v==='e')return 'ㅔ'; if(v==='i')return 'ㅣ';
    if(v==='o')return 'ㅗ'; if(v==='u')return 'ㅜ';
    return 'ㅏ';
  }
  function romanToKo(w){
    // Greek -> familiar study romanization first. Preserve rough breathing.
    const rough=w.normalize('NFD').includes('\u0314');
    let r=strip(w)
      .replace(/αι/g,'ai').replace(/ει/g,'ei').replace(/οι/g,'oi').replace(/ου/g,'ou')
      .replace(/αυ/g,'au').replace(/ευ/g,'eu')
      .replace(/γγ/g,'ng').replace(/γκ/g,'nk').replace(/γχ/g,'nch').replace(/γξ/g,'nx')
      .replace(/θ/g,'th').replace(/φ/g,'ph').replace(/χ/g,'ch').replace(/ψ/g,'ps')
      .replace(/ξ/g,'x')
      .replace(/α/g,'a').replace(/β/g,'b').replace(/γ/g,'g').replace(/δ/g,'d')
      .replace(/ε/g,'e').replace(/ζ/g,'z').replace(/η/g,'e').replace(/ι/g,'i')
      .replace(/κ/g,'k').replace(/λ/g,'l').replace(/μ/g,'m').replace(/ν/g,'n')
      .replace(/ο/g,'o').replace(/π/g,'p').replace(/ρ/g,'r').replace(/σ|ς/g,'s')
      .replace(/τ/g,'t').replace(/υ/g,'u').replace(/ω/g,'o');
    if(rough && /^[aeiou]/.test(r)) r='h'+r;

    // Syllabify conservatively. Final n/m/l/r are attached to preceding vowel
    // when they close a word/syllable: pan -> 판, pheron -> 페론, karpon -> 카르폰.
    let out='', i=0;
    while(i<r.length){
      let onset='', consumed=0;
      for(const c of ['th','ph','ch','ps']){
        if(r.startsWith(c,i)){ onset=c; consumed=c.length; break; }
      }
      if(!consumed && /[a-z]/.test(r[i]||'') && !/[aeiou]/.test(r[i])){ onset=r[i]; consumed=1; }
      let j=i+consumed;
      let vv='';
      for(const v of ['ai','ei','oi','ou','au','eu']){
        if(r.startsWith(v,j)){ vv=v; break; }
      }
      if(!vv && /[aeiou]/.test(r[j]||'')) vv=r[j];
      if(!vv){
        // consonant cluster: use a natural epenthetic vowel, never raw jamo
        if(onset){ out += ({k:'크',g:'그',p:'프',b:'브',t:'트',d:'드',l:'르',r:'르',m:'므',n:'느',s:'스',x:'크스',th:'트',ph:'프',ch:'크',ps:'프스',z:'즈'}[onset]||''); i+=consumed; continue; }
        i++; continue;
      }
      j += vv.length;
      let fin='';
      // Attach a single closing consonant if followed by end or another consonant.
      const nc=r[j]||'';
      const after=r[j+1]||'';
      const digraphAhead=['th','ph','ch','ps'].some(c=>r.startsWith(c,j));
      if(!digraphAhead && finalMap[nc] && (!after || !/[aeiou]/.test(after))){
        fin=finalMap[nc]; j++;
      }
      let on=onsetMap[onset]||'ㅇ';
      // Common study-style handling for diphthongs.
      if(vv==='ai'){ out += compose(on,'ㅏ',fin) + (fin?'':'이'); }
      else if(vv==='ei'){ out += compose(on,'ㅔ',fin) + (fin?'':'이'); }
      else if(vv==='oi'){ out += compose(on,'ㅗ',fin) + (fin?'':'이'); }
      else if(vv==='ou'){ out += compose(on,'ㅜ',fin); }
      else if(vv==='au'){ out += compose(on,'ㅏ',fin)+'우'; }
      else if(vv==='eu'){ out += compose(on,'ㅔ',fin)+'우'; }
      else out += compose(on,vowelJamo(vv),fin);
      i=j;
    }
    return out;
  }
  return words.map(w=>{
    const n=normGreekPron(w);
    return MATT_PRON_OVERRIDES[n] || romanToKo(w);
  }).join(' ');
}


function joinGreekDisplayTokens(words){
  const out=[];
  for(const w of words){
    const s=(w.surface||'').trim();
    if(!s) continue;
    if(/^[\u0300-\u036f·.,;:!?]+$/u.test(s) && out.length){
      out[out.length-1]+=s;
    }else{
      out.push(s);
    }
  }
  return out.join(' ');
}

function mattPronWord(w){
  const p=mattPronLine([w]).trim();
  return p && !/[\u0370-\u03ff\u1f00-\u1fff]/u.test(p) ? p : '';
}
function mattPronLine(words){
  const out=[];
  for(let i=0;i<words.length;i++){
    const surface=(words[i].surface||'').trim();
    const g=normGreekPron(surface);
    if(!g) continue;
    const k=MATT_PRON_OVERRIDES[g] || koApprox(surface);

    // Accent/breathing/punctuation must never become a separate visual token.
    if(/^[\u0300-\u036f·.,;:!?]+$/u.test(surface) && out.length){
      out[out.length-1]+=k;
      continue;
    }
    out.push(k);
  }
  return out.join(' ');
}
function greekClass(w){
  const lemma=stripGreek(w.lemma);
  if(['ζωη','ζαω','ζωοποιεω'].includes(lemma))return 'glife';
  if((w.pos||'').startsWith('N-'))return 'gnoun';
  if((w.pos||'').startsWith('V-'))return 'gverb';
  return '';
}
function posName(pos){
  if((pos||'').startsWith('N-'))return 'Noun';
  if((pos||'').startsWith('V-'))return 'Verb';
  if((pos||'').startsWith('A-'))return 'Adjective';
  if((pos||'').startsWith('D-'))return 'Adverb';
  if((pos||'').startsWith('P-'))return 'Pronoun';
  if((pos||'').startsWith('RA'))return 'Article';
  if((pos||'').startsWith('C-'))return 'Conjunction';
  if((pos||'').startsWith('PREP'))return 'Preposition';
  return pos||'—';
}

const LEXEMES_URL='https://raw.githubusercontent.com/jtauber/greek-lemma-mappings/master/lexemes.yaml';
const STRONGS_URL='https://raw.githubusercontent.com/morphgnt/strongs-dictionary-xml/master/strongsgreek.xml';
let lexemesText=null, strongsDoc=null, lexicalLoading=null;

async function ensureLexicalData(){
  if(lexemesText && strongsDoc)return;
  if(lexicalLoading)return lexicalLoading;
  lexicalLoading=Promise.all([
    withTimeout(LEXEMES_URL,7000).then(r=>{if(!r.ok)throw new Error('lemma map');return r.text();}),
    withTimeout(STRONGS_URL,7000).then(r=>{if(!r.ok)throw new Error('strongs dict');return r.text();})
  ]).then(([y,x])=>{
    lexemesText=y;
    strongsDoc=new DOMParser().parseFromString(x,'application/xml');
  }).finally(()=>{lexicalLoading=null});
  return lexicalLoading;
}
function lexicalKey(s){
  return (s||'').normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/[()]/g,'');
}
function strongForLemma(lemma){
  // First try the lemma-to-Strong's mapping file.
  if(lexemesText){
    const escaped=(lemma||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const re=new RegExp('(?:^|\\n)'+escaped+':\\s*\\n([\\s\\S]*?)(?=\\n\\S[^\\n]*:\\s*\\n|$)');
    const m=lexemesText.match(re);
    if(m){
      const s=m[1].match(/\\n?\\s*strongs:\\s*(\\d+)/);
      if(s)return String(Number(s[1]));
    }
  }
  // Fallback: find the lemma directly in Strong's XML.
  if(strongsDoc){
    const key=lexicalKey(lemma);
    for(const entry of strongsDoc.getElementsByTagName('entry')){
      const gr=entry.getElementsByTagName('greek')[0];
      if(gr && lexicalKey(gr.getAttribute('unicode'))===key){
        const a=entry.getAttribute('strongs');
        if(a)return String(Number(a));
      }
    }
  }
  return null;
}
function meaningForStrong(num){
  if(!strongsDoc||!num)return null;
  const entries=[...strongsDoc.getElementsByTagName('entry')];
  const entry=entries.find(el=>{
    const a=el.getAttribute('strongs');
    return Number(a)===Number(num);
  });
  if(!entry)return null;
  const def=entry.getElementsByTagName('strongs_def')[0];
  const kjv=entry.getElementsByTagName('kjv_def')[0];
  const parts=[];
  if(def?.textContent?.trim())parts.push(def.textContent.trim());
  if(kjv?.textContent?.trim())parts.push('KJV: '+kjv.textContent.trim());
  return parts.join(' — ')||null;
}
async function fillEnglishMeaning(w){
  const meaning=document.getElementById('dictMeaning');
  const strong=document.getElementById('dictStrong');
  meaning.textContent='Loading…'; strong.textContent='—';
  try{
    await ensureLexicalData();
    const n=strongForLemma(w.lemma);
    strong.textContent=n?'G'+n:'—';
    meaning.textContent=meaningForStrong(n)||'No English definition is available for this lemma in the connected Strong’s dictionary.';
  }catch(e){
    meaning.textContent='English definition could not be loaded. The Bible text remains available.';
  }
}
let dictOpenedAt=0;
function showDict(w){
  const now=Date.now(); if(now-dictOpenedAt<250)return; dictOpenedAt=now;
  document.getElementById('dictWord').textContent=w.surface;
  document.getElementById('dictTrans').textContent=romanGreek(w.surface);
  document.getElementById('dictPos').textContent=posName(w.pos);
  document.getElementById('dictParse').textContent=w.parse||'—';
  document.getElementById('dictLemma').textContent=w.lemma||'—';
  const bd=document.getElementById('dictBackdrop'); bd.style.display='block'; document.getElementById('dictBox').scrollTop=0;
  fillEnglishMeaning(w);
}
function closeDict(){document.getElementById('dictBackdrop').style.display='none';}
async function getGreek(){
  if(greekCache)return greekCache;
  if(greekLoading)return greekLoading;
  greekLoading=withTimeout(GREEK_URL,5000)
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status); return r.text();})
    .then(t=>greekCache=parseMorphGNT(t))
    .finally(()=>{greekLoading=null});
  return greekLoading;
}
async function loadGreek(ch){
  currentChapter=ch;
  try{
    const data=await getGreek();
    if(currentChapter!==ch)return;
    document.querySelectorAll(`[id^="g-${ch}-"]`).forEach(el=>{
      const v=Number(el.id.split('-')[2]);
      const words=data[ch]?.[v]||[];
      if(!words.length){el.textContent='헬라어 본문을 찾지 못했습니다.';return;}
      el.innerHTML='';
      el.classList.add('greek-paired');
      words.forEach((w)=>{
        const pair=document.createElement('span');
        pair.className='gpair';

        const sp=document.createElement('span');
        sp.className='gword '+greekClass(w);
        sp.textContent=(w.surface||'').normalize('NFC');
        sp.title=w.lemma;
        const openWord=(ev)=>{ev.preventDefault();ev.stopPropagation();showDict(w);};
        sp.addEventListener('click',openWord);
        sp.addEventListener('pointerup',ev=>{if(ev.pointerType==='touch')openWord(ev);});

        const kp=document.createElement('span');
        kp.className='gpair-pron';
        kp.textContent=mattPronWord(w);

        pair.appendChild(sp);
        pair.appendChild(kp);
        el.appendChild(pair);
      });
      const pel=document.getElementById(`p-${ch}-${v}`);
      if(pel){pel.textContent='';pel.classList.add('hidden-by-pair');}
      refreshCoreAnnotation(ch,v,words);
    });
    document.getElementById('status').textContent+= ' · 헬라어 연결 완료';
  }catch(e){
    if(currentChapter!==ch)return;
    document.querySelectorAll(`[id^="g-${ch}-"]`).forEach(el=>{
      el.textContent='헬라어 연결이 없어도 아래 우리 번역은 정상적으로 사용할 수 있습니다.';
      el.classList.add('extnote');
    });
    document.getElementById('status').textContent+= ' · 헬라어 연결 실패(본문 사용 가능)';
  }
}

const KO={"1":{"1":"예수 그리스도의 계보의 책이다. 그분은 다윗의 아들이시며 아브라함의 아들이시다.","2":"아브라함은 이삭을 낳았고, 이삭은 야곱을 낳았으며, 야곱은 유다와 그의 형제들을 낳았다.","3":"유다는 다말에게서 베레스와 세라를 낳았고, 베레스는 헤스론을 낳았으며, 헤스론은 아람을 낳았다.","4":"아람은 아미나답을 낳았고, 아미나답은 나손을 낳았으며, 나손은 살몬을 낳았다.","5":"살몬은 라합에게서 보아스를 낳았고, 보아스는 룻에게서 오벳을 낳았으며, 오벳은 이새를 낳았다.","6":"이새는 다윗 왕을 낳았다. 다윗은 우리아의 아내였던 여자에게서 솔로몬을 낳았고,","7":"솔로몬은 르호보암을 낳았고, 르호보암은 아비야를 낳았으며, 아비야는 아삽을 낳았다.","8":"아삽은 여호사밧을 낳았고, 여호사밧은 요람을 낳았으며, 요람은 웃시야를 낳았다.","9":"웃시야는 요담을 낳았고, 요담은 아하스를 낳았으며, 아하스는 히스기야를 낳았다.","10":"히스기야는 므낫세를 낳았고, 므낫세는 아모스를 낳았으며, 아모스는 요시야를 낳았다.","11":"요시야는 바빌론으로 이주되던 때에 여고냐와 그의 형제들을 낳았다.","12":"바빌론으로 이주된 후에 여고냐는 스알디엘을 낳았고, 스알디엘은 스룹바벨을 낳았다.","13":"스룹바벨은 아비훗을 낳았고, 아비훗은 엘리아김을 낳았으며, 엘리아김은 아소르를 낳았다.","14":"아소르는 사독을 낳았고, 사독은 아킴을 낳았으며, 아킴은 엘리웃을 낳았다.","15":"엘리웃은 엘르아살을 낳았고, 엘르아살은 맛단을 낳았으며, 맛단은 야곱을 낳았다.","16":"야곱은 마리아의 남편 요셉을 낳았고, 마리아에게서 그리스도라고 불리시는 예수님께서 태어나셨다.","17":"그러므로 아브라함부터 다윗까지 모든 세대가 열네 세대이고, 다윗부터 바빌론 이주까지 열네 세대이며, 바빌론 이주부터 그리스도까지 열네 세대이다.","18":"예수 그리스도의 나심은 이러하였다. 그분의 어머니 마리아가 요셉과 약혼하였는데, 두 사람이 함께 살기 전에 마리아가 성령으로 말미암아 잉태한 것이 드러났다.","19":"그의 남편 요셉은 의로운 사람이었고 마리아를 공개적으로 수치스럽게 만들고 싶지 않았으므로 조용히 파혼하려고 하였다.","20":"그가 이 일을 생각하고 있을 때, 보아라, 주님의 천사가 꿈에 그에게 나타나 말했다. “다윗의 아들 요셉아, 네 아내 마리아를 데려오는 것을 두려워하지 마라. 그 여자 안에 잉태된 것은 성령으로 말미암은 것이다.","21":"마리아가 아들을 낳을 것이니 그 이름을 예수라고 하여라. 그분께서 자기 백성을 그들의 죄들에서 구원하실 것이기 때문이다.”","22":"이 모든 일이 일어난 것은 주님께서 신언자를 통하여 하신 말씀이 이루어지게 하려는 것이었다.","23":"“보아라, 처녀가 잉태하여 아들을 낳을 것이며, 사람들이 그의 이름을 임마누엘이라고 부를 것이다.” 임마누엘은 번역하면 “하나님께서 우리와 함께 계신다”라는 뜻이다.","24":"요셉은 잠에서 깨어 주님의 천사가 명령한 대로 행하여 자기 아내를 데려왔다.","25":"그러나 마리아가 아들을 낳을 때까지 그 여자와 관계를 갖지 않았고, 그 아들의 이름을 예수라고 하였다."},"2":{"1":"헤롯 왕 시대에 예수님께서 유대의 베들레헴에서 태어나신 뒤, 보아라, 동방에서 박사들이 예루살렘에 와서","2":"말했다. “유대인의 왕으로 태어나신 분이 어디에 계십니까? 우리가 동방에서 그분의 별을 보고 그분께 경배하러 왔습니다.”","3":"헤롯 왕이 이 말을 듣고 당황하였고, 온 예루살렘도 그와 함께 당황하였다.","4":"헤롯은 백성의 모든 대제사장들과 율법학자들을 모아 놓고 그리스도께서 어디에서 태어나실 것인지 물었다.","5":"그들이 헤롯에게 말했다. “유대의 베들레헴입니다. 신언자를 통하여 이렇게 기록되어 있기 때문입니다.","6":"‘유다 땅 베들레헴아, 너는 유다의 지도자들 가운데 결코 가장 작은 곳이 아니다. 너에게서 한 통치자가 나와 내 백성 이스라엘을 목양할 것이기 때문이다.’”","7":"그때 헤롯은 박사들을 몰래 불러 별이 나타난 때를 그들에게 정확히 알아보았다.","8":"그리고 그들을 베들레헴으로 보내며 말했다. “가서 그 아기에 관하여 자세히 알아보고, 찾거든 나에게 알려 주시오. 나도 가서 그에게 경배하려 하오.”","9":"그들은 왕의 말을 듣고 떠났다. 그런데 보아라, 그들이 동방에서 보았던 별이 그들보다 앞서 가다가 아기가 있는 곳 위에 이르러 멈추었다.","10":"그들은 그 별을 보고 매우 크게 기뻐하였다.","11":"집 안으로 들어가 아기가 그의 어머니 마리아와 함께 있는 것을 보고 엎드려 그분께 경배하였다. 그리고 보물함을 열어 금과 유향과 몰약을 예물로 드렸다.","12":"그들은 꿈에 헤롯에게로 돌아가지 말라는 하나님의 지시를 받고 다른 길로 자기 나라로 돌아갔다.","13":"그들이 떠난 뒤, 보아라, 주님의 천사가 꿈에 요셉에게 나타나 말했다. “일어나 아기와 그의 어머니를 데리고 이집트로 피하여 내가 네게 말할 때까지 거기에 머물러라. 헤롯이 아기를 찾아 죽이려 하기 때문이다.”","14":"요셉은 일어나 밤에 아기와 그의 어머니를 데리고 이집트로 떠나","15":"헤롯이 죽을 때까지 거기에 있었다. 이것은 주님께서 신언자를 통하여 “내가 이집트에서 내 아들을 불러내었다”라고 하신 말씀이 이루어지게 하려는 것이었다.","16":"그때 헤롯은 박사들에게 속은 것을 알고 몹시 분노하여 사람들을 보내, 박사들에게 정확히 알아본 때를 기준으로 베들레헴과 그 모든 주변 지역에 있는 두 살 이하의 사내아이들을 모두 죽였다.","17":"그때 신언자 예레미야를 통하여 하신 말씀이 이루어졌다.","18":"“라마에서 한 소리가 들렸다. 울음과 큰 통곡이었다. 라헬이 자기 자녀들을 위하여 울며 위로받기를 원하지 않았으니, 그들이 없기 때문이다.”","19":"헤롯이 죽은 뒤, 보아라, 주님의 천사가 이집트에서 꿈에 요셉에게 나타나","20":"말했다. “일어나 아기와 그의 어머니를 데리고 이스라엘 땅으로 가거라. 아기의 생명을 찾던 사람들이 죽었기 때문이다.”","21":"요셉은 일어나 아기와 그의 어머니를 데리고 이스라엘 땅으로 들어갔다.","22":"그러나 아켈라오가 그의 아버지 헤롯을 이어 유대를 다스린다는 말을 듣고 그곳으로 가기를 두려워하였다. 꿈에 하나님의 지시를 받고 갈릴리 지역으로 물러가","23":"나사렛이라고 하는 동네에 가서 살았다. 이것은 신언자들을 통하여 “그분은 나사렛 사람이라고 불릴 것이다”라고 하신 말씀이 이루어지게 하려는 것이었다."},"3":{"1":"그 무렵 침례자 요한이 나타나 유대 광야에서 선포하며","2":"말했다. “회개하십시오. 하늘들의 왕국이 가까이 왔습니다.”","3":"이 사람이 바로 신언자 이사야를 통하여 말씀하신 그 사람이다. “광야에서 외치는 이의 소리이다. ‘주님의 길을 준비하여라. 그분의 길들을 곧게 하여라.’”","4":"이 요한은 낙타 털로 된 옷을 입고 허리에 가죽띠를 띠었으며, 그의 음식은 메뚜기와 들꿀이었다.","5":"그때 예루살렘과 온 유대와 요단강 주변의 온 지역이 그에게 나아와","6":"자기들의 죄들을 자백하며 요단강에서 그에게 침례를 받았다.","7":"그러나 많은 바리새인들과 사두개인들이 침례 받으러 오는 것을 보고 요한이 그들에게 말했다. “독사의 자식들이여, 누가 여러분에게 다가오는 진노를 피하라고 경고했습니까?","8":"그러므로 회개에 합당한 열매를 맺으십시오.","9":"그리고 여러분 속으로 ‘우리에게는 아브라함이 아버지로 있다’라고 생각하지 마십시오. 내가 여러분에게 말합니다. 하나님은 이 돌들에서도 아브라함을 위하여 자녀들을 일으키실 수 있습니다.","10":"이미 도끼가 나무들의 뿌리에 놓여 있습니다. 그러므로 좋은 열매를 맺지 않는 나무마다 찍혀 불 속에 던져집니다.","11":"나는 여러분을 회개에 이르게 하려고 물로 침례 줍니다. 그러나 내 뒤에 오시는 분은 나보다 더 강하신 분이시며, 나는 그분의 신발을 들 자격도 없습니다. 그분은 여러분을 성령과 불로 침례 주실 것입니다.","12":"그분의 키가 그분의 손에 있습니다. 그분은 자기 타작마당을 깨끗이 하시고, 밀은 곳간에 모으실 것이지만, 쭉정이는 꺼지지 않는 불로 태우실 것입니다.”","13":"그때 예수님께서 요한에게 침례를 받으시려고 갈릴리에서 요단강으로 요한에게 오셨다.","14":"그러나 요한은 예수님을 말리며 말했다. “제가 주님께 침례를 받아야 하는데, 주님께서 제게 오십니까?”","15":"예수님께서 그에게 대답하셨다. “지금은 허락하십시오. 우리가 이와 같이 모든 의를 이루는 것이 합당합니다.” 그러자 요한이 허락하였다.","16":"예수님께서 침례를 받으시고 곧 물에서 올라오셨다. 그런데 보아라, 하늘들이 그분께 열렸고, 그분은 하나님의 영께서 비둘기처럼 내려와 자기 위에 임하시는 것을 보셨다.","17":"그리고 보아라, 하늘들에서 한 음성이 들렸다. “이분은 내가 사랑하는 나의 아들이다. 내가 이분을 기뻐한다.”"},"4":{"1":"그때 예수님께서 마귀에게 시험을 받으시려고 그 영에 이끌려 광야로 가셨다.","2":"사십 일 밤낮을 금식하신 뒤에 배가 고프셨다.","3":"그 시험하는 자가 다가와 그분께 말했다. “당신이 하나님의 아들이라면 이 돌들에게 빵이 되라고 말해 보십시오.”","4":"그러나 예수님께서 대답하셨다. “기록되어 있다. ‘사람이 빵으로만 살 것이 아니라, 하나님의 입에서 나오는 모든 말씀으로 살 것이다.’”","5":"그때 마귀가 예수님을 거룩한 도시로 데려가 성전 꼭대기에 세우고","6":"그분께 말했다. “당신이 하나님의 아들이라면 아래로 몸을 던져 보십시오. 기록되어 있기 때문입니다. ‘그분께서 당신을 위하여 자기 천사들에게 명령하실 것이고’, 또 ‘그들이 손으로 당신을 받들어 당신의 발이 돌에 부딪히지 않게 할 것이다.’”","7":"예수님께서 그에게 말씀하셨다. “또 기록되어 있다. ‘주 너의 하나님을 시험하지 마라.’”","8":"다시 마귀가 예수님을 매우 높은 산으로 데려가 세상의 모든 왕국들과 그 영광을 보여 주며","9":"그분께 말했다. “당신이 엎드려 나에게 경배한다면 이 모든 것을 당신에게 주겠습니다.”","10":"그때 예수님께서 그에게 말씀하셨다. “사탄아, 물러가라! 기록되어 있다. ‘주 너의 하나님께 경배하고 오직 그분만 섬겨라.’”","11":"그러자 마귀가 예수님을 떠났고, 보아라, 천사들이 다가와 그분을 섬겼다.","12":"예수님께서 요한이 잡혔다는 말을 들으시고 갈릴리로 물러가셨다.","13":"그리고 나사렛을 떠나 스불론과 납달리 지역의 바닷가에 있는 가버나움에 가서 사셨다.","14":"이것은 신언자 이사야를 통하여 하신 말씀이 이루어지게 하려는 것이었다.","15":"“스불론 땅과 납달리 땅, 바다 길, 요단강 건너편, 이방인들의 갈릴리여,","16":"어둠 속에 앉아 있던 백성이 큰 빛을 보았고, 죽음의 땅과 그림자 속에 앉아 있던 사람들에게 빛이 떠올랐다.”","17":"그때부터 예수님께서 선포하기 시작하셨다. “회개하십시오. 하늘들의 왕국이 가까이 왔습니다.”","18":"예수님께서 갈릴리 바닷가를 걸어가시다가 두 형제, 곧 베드로라고 하는 시몬과 그의 형제 안드레가 바다에 그물을 던지는 것을 보셨다. 그들은 어부들이었다.","19":"예수님께서 그들에게 말씀하셨다. “나를 따라오십시오. 내가 여러분을 사람들을 낚는 어부들이 되게 하겠습니다.”","20":"그러자 그들은 즉시 그물들을 버리고 그분을 따랐다.","21":"거기서 더 가시다가 다른 두 형제, 곧 세베대의 아들 야고보와 그의 형제 요한이 자기 아버지 세베대와 함께 배에서 그물들을 손질하는 것을 보시고 그들을 부르셨다.","22":"그들은 즉시 배와 자기 아버지를 남겨 두고 그분을 따랐다.","23":"예수님께서 온 갈릴리를 두루 다니시며 그들의 회당들에서 가르치시고 왕국의 복음을 선포하시며 백성 가운데 있는 모든 질병과 모든 약함을 고치셨다.","24":"그분에 관한 소문이 온 시리아에 퍼졌다. 사람들이 여러 질병과 고통에 시달리는 모든 사람들, 귀신 들린 사람들, 간질하는 사람들, 중풍병자들을 그분께 데려왔고, 그분은 그들을 고쳐 주셨다.","25":"갈릴리와 데가볼리와 예루살렘과 유대와 요단강 건너편에서 온 큰 무리가 그분을 따랐다."},"5":{"1":"예수님께서 무리들을 보시고 산에 올라가 앉으시니 제자들이 그분께 나아왔다.","2":"예수님께서 입을 열어 그들을 가르치며 말씀하셨다.","3":"“영 안에서 가난한 사람들은 복이 있습니다. 하늘들의 왕국이 그들의 것이기 때문입니다.","4":"슬퍼하는 사람들은 복이 있습니다. 그들이 위로를 받을 것이기 때문입니다.","5":"온유한 사람들은 복이 있습니다. 그들이 땅을 상속받을 것이기 때문입니다.","6":"의를 굶주리고 목말라 하는 사람들은 복이 있습니다. 그들이 배부르게 될 것이기 때문입니다.","7":"긍휼히 여기는 사람들은 복이 있습니다. 그들이 긍휼히 여김을 받을 것이기 때문입니다.","8":"마음이 순수한 사람들은 복이 있습니다. 그들이 하나님을 볼 것이기 때문입니다.","9":"화평하게 하는 사람들은 복이 있습니다. 그들이 하나님의 아들들이라고 불릴 것이기 때문입니다.","10":"의를 위하여 박해받은 사람들은 복이 있습니다. 하늘들의 왕국이 그들의 것이기 때문입니다.","11":"나 때문에 사람들이 여러분을 모욕하고 박해하며 거짓으로 여러분을 거슬러 온갖 악한 말을 할 때 여러분은 복이 있습니다.","12":"기뻐하고 크게 즐거워하십시오. 하늘들에서 여러분의 보상이 크기 때문입니다. 여러분보다 먼저 있었던 신언자들도 그와 같이 박해했습니다.","13":"여러분은 땅의 소금입니다. 그러나 소금이 맛을 잃으면 무엇으로 다시 짜게 하겠습니까? 그것은 더 이상 아무 쓸모가 없어 밖에 던져져 사람들에게 밟힐 뿐입니다.","14":"여러분은 세상의 빛입니다. 산 위에 있는 도시는 숨겨질 수 없습니다.","15":"사람들이 등불을 켜서 됫박 아래 두지 않고 등잔대 위에 둡니다. 그러면 집 안에 있는 모든 사람에게 빛을 비춥니다.","16":"이와 같이 여러분의 빛을 사람들 앞에 비추어, 그들이 여러분의 좋은 행위들을 보고 하늘들에 계신 여러분의 아버지께 영광을 돌리게 하십시오.","17":"내가 율법이나 신언자들을 폐하러 왔다고 생각하지 마십시오. 폐하러 온 것이 아니라 이루러 왔습니다.","18":"진실로 내가 여러분에게 말합니다. 하늘과 땅이 없어지기 전에는 모든 것이 이루어질 때까지 율법에서 한 이오타나 한 획도 결코 없어지지 않을 것입니다.","19":"그러므로 이 계명들 가운데 가장 작은 것 하나라도 풀어 버리고 사람들에게 그렇게 가르치는 사람은 하늘들의 왕국에서 가장 작은 사람이라고 불릴 것입니다. 그러나 그것들을 행하고 가르치는 사람은 하늘들의 왕국에서 큰 사람이라고 불릴 것입니다.","20":"내가 여러분에게 말합니다. 여러분의 의가 율법학자들과 바리새인들의 의보다 더 넘치지 않으면 여러분은 결코 하늘들의 왕국에 들어가지 못할 것입니다.","21":"옛사람들에게 ‘살인하지 마라. 살인하는 사람은 심판을 받게 될 것이다’라고 말씀하신 것을 여러분이 들었습니다.","22":"그러나 나는 여러분에게 말합니다. 자기 형제에게 화를 내는 사람은 누구나 심판을 받게 될 것입니다. 자기 형제에게 ‘라카’라고 하는 사람은 공회에 넘겨질 것이며, ‘어리석은 자야’라고 하는 사람은 불의 게헨나에 들어갈 위험이 있습니다.","23":"그러므로 그대가 제단에 예물을 드리다가 거기서 형제가 그대에게 원망할 일이 있다는 것이 생각나거든,","24":"그 예물을 제단 앞에 두고 먼저 가서 형제와 화해하십시오. 그 후에 와서 예물을 드리십시오.","25":"그대를 고발하는 사람과 함께 길에 있을 때 빨리 그와 화해하십시오. 그렇지 않으면 고발하는 사람이 그대를 재판관에게 넘기고 재판관은 경비병에게 넘겨 그대가 감옥에 던져질 수 있습니다.","26":"진실로 내가 그대에게 말합니다. 그대가 마지막 한 푼까지 갚기 전에는 결코 거기서 나오지 못할 것입니다.","27":"‘간음하지 마라’라고 말씀하신 것을 여러분이 들었습니다.","28":"그러나 나는 여러분에게 말합니다. 여자를 욕망하여 바라보는 사람은 누구나 이미 자기 마음속에서 그 여자와 간음한 것입니다.","29":"만일 그대의 오른눈이 그대를 걸려 넘어지게 한다면 그것을 빼어 던져 버리십시오. 그대의 지체 하나가 없어지는 것이 온몸이 게헨나에 던져지는 것보다 낫습니다.","30":"또 그대의 오른손이 그대를 걸려 넘어지게 한다면 그것을 잘라 던져 버리십시오. 그대의 지체 하나가 없어지는 것이 온몸이 게헨나로 가는 것보다 낫습니다.","31":"또 ‘자기 아내와 이혼하는 사람은 이혼 증서를 주어라’라고 말씀하셨습니다.","32":"그러나 나는 여러분에게 말합니다. 음행의 사유 외에 자기 아내와 이혼하는 사람은 그 여자를 간음하게 하며, 이혼한 여자와 결혼하는 사람도 간음합니다.","33":"또 옛사람들에게 ‘거짓 맹세를 하지 말고 주님께 한 맹세를 지켜라’라고 말씀하신 것을 여러분이 들었습니다.","34":"그러나 나는 여러분에게 말합니다. 전혀 맹세하지 마십시오. 하늘을 두고도 하지 마십시오. 하늘은 하나님의 보좌이기 때문입니다.","35":"땅을 두고도 하지 마십시오. 땅은 그분의 발판이기 때문입니다. 예루살렘을 두고도 하지 마십시오. 예루살렘은 위대한 왕의 도시이기 때문입니다.","36":"그대의 머리를 두고도 맹세하지 마십시오. 그대는 머리카락 하나도 희거나 검게 만들 수 없기 때문입니다.","37":"여러분의 말은 ‘예’이면 ‘예’, ‘아니요’이면 ‘아니요’가 되게 하십시오. 이것을 넘어서는 것은 악에서 [또는: 악한 자에게서] 나옵니다.","38":"‘눈은 눈으로, 이는 이로’라고 말씀하신 것을 여러분이 들었습니다.","39":"그러나 나는 여러분에게 말합니다. 악한 사람에게 맞서 보복하지 마십시오. 누가 그대의 오른뺨을 치거든 다른 뺨도 그에게 돌려 대십시오.","40":"누가 그대를 고소하여 속옷을 가지려 하거든 겉옷까지도 그에게 내주십시오.","41":"누가 그대에게 억지로 일 마일을 가게 하거든 그와 함께 이 마일을 가십시오.","42":"그대에게 요구하는 사람에게 주고, 그대에게 빌리려는 사람을 외면하지 마십시오.","43":"‘그대의 이웃을 사랑하고 그대의 원수를 미워하여라’라고 말씀하신 것을 여러분이 들었습니다.","44":"그러나 나는 여러분에게 말합니다. 여러분의 원수들을 사랑하고 여러분을 박해하는 사람들을 위하여 기도하십시오.","45":"그래야 여러분이 하늘들에 계신 여러분의 아버지의 아들들이 될 것입니다. 그분은 악한 사람들과 선한 사람들 위에 자기 해를 떠오르게 하시고 의로운 사람들과 불의한 사람들 위에 비를 내리십니다.","46":"여러분을 사랑하는 사람들만 사랑한다면 무슨 보상을 받겠습니까? 세리들도 그렇게 하지 않습니까?","47":"여러분이 여러분의 형제들에게만 인사한다면 무슨 특별한 일을 하는 것입니까? 이방인들도 그렇게 하지 않습니까?","48":"그러므로 하늘의 여러분의 아버지께서 온전하신 것처럼 여러분도 온전하십시오 [또는: 완전하고 성숙하며 온전한 사람이 되십시오]."},"6":{"1":"사람들에게 보이려고 그들 앞에서 여러분의 의를 행하지 않도록 주의하십시오. 그렇지 않으면 하늘들에 계신 여러분의 아버지에게서 보상을 받지 못합니다.","2":"그러므로 그대가 구제할 때 위선자들이 사람들에게 영광을 받으려고 회당들과 거리들에서 하는 것처럼 그대 앞에서 나팔을 불지 마십시오. 진실로 내가 여러분에게 말합니다. 그들은 자기들의 보상을 이미 다 받았습니다.","3":"그러나 그대가 구제할 때에는 그대의 왼손이 오른손이 하는 것을 알지 못하게 하여,","4":"그대의 구제가 은밀한 가운데 있게 하십시오. 그러면 은밀한 가운데 보시는 그대의 아버지께서 그대에게 갚아 주실 것입니다.","5":"또 여러분이 기도할 때 위선자들처럼 하지 마십시오. 그들은 사람들에게 보이려고 회당들과 큰길 모퉁이에 서서 기도하기를 좋아합니다. 진실로 내가 여러분에게 말합니다. 그들은 자기들의 보상을 이미 다 받았습니다.","6":"그러나 그대가 기도할 때에는 그대의 방으로 들어가 문을 닫고 은밀한 가운데 계시는 그대의 아버지께 기도하십시오. 그러면 은밀한 가운데 보시는 그대의 아버지께서 그대에게 갚아 주실 것입니다.","7":"또 기도할 때 이방인들처럼 의미 없는 말을 되풀이하지 마십시오. 그들은 말을 많이 해야 자기들의 기도가 들릴 것이라고 생각합니다.","8":"그러므로 그들과 같이 되지 마십시오. 여러분이 구하기 전에 여러분의 아버지께서 여러분에게 무엇이 필요한지 알고 계시기 때문입니다.","9":"그러므로 여러분은 이렇게 기도하십시오. ‘하늘들에 계신 우리 아버지, 아버지의 이름이 거룩하게 여겨지게 하시며,","10":"아버지의 왕국이 오게 하시며, 아버지의 뜻이 하늘에서 이루어진 것처럼 땅에서도 이루어지게 하십시오.","11":"오늘 우리에게 필요한 양식을 [또는: 오늘을 위한 양식, 오는 날의 양식] 주시고,","12":"우리가 우리에게 빚진 사람들을 용서한 것처럼 우리의 빚들도 용서해 주시며,","13":"우리를 시험에 들어가게 하지 마시고 악에서 [또는: 악한 자에게서] 구해 주십시오.’","14":"여러분이 사람들의 잘못을 용서하면 하늘의 여러분의 아버지께서도 여러분을 용서하실 것입니다.","15":"그러나 여러분이 사람들을 용서하지 않으면 여러분의 아버지께서도 여러분의 잘못을 용서하지 않으실 것입니다.","16":"여러분이 금식할 때 위선자들처럼 침울한 얼굴을 하지 마십시오. 그들은 금식하는 것을 사람들에게 보이려고 자기 얼굴을 흉하게 합니다. 진실로 내가 여러분에게 말합니다. 그들은 자기들의 보상을 이미 다 받았습니다.","17":"그러나 그대가 금식할 때에는 머리에 기름을 바르고 얼굴을 씻으십시오.","18":"그래서 그대가 금식하는 것을 사람들에게 보이지 말고 은밀한 가운데 계시는 그대의 아버지께 보이십시오. 그러면 은밀한 가운데 보시는 그대의 아버지께서 그대에게 갚아 주실 것입니다.","19":"여러분 자신을 위하여 땅에 보물들을 쌓아 두지 마십시오. 거기서는 좀과 녹이 망가뜨리고 도둑들이 뚫고 들어와 훔칩니다.","20":"오히려 여러분 자신을 위하여 하늘에 보물들을 쌓아 두십시오. 거기서는 좀도 녹도 망가뜨리지 못하고 도둑들이 뚫고 들어와 훔치지도 못합니다.","21":"그대의 보물이 있는 곳에 그대의 마음도 있을 것입니다.","22":"몸의 등불은 눈입니다. 그러므로 그대의 눈이 맑으면 [또는: 단순하고 한결같으면] 그대의 온몸이 밝을 것입니다.","23":"그러나 그대의 눈이 나쁘면 그대의 온몸이 어두울 것입니다. 그러므로 그대 안에 있는 빛이 어둠이라면 그 어둠이 얼마나 크겠습니까!","24":"아무도 두 주인을 섬길 수 없습니다. 한쪽을 미워하고 다른 쪽을 사랑하거나, 한쪽을 붙들고 다른 쪽을 업신여길 것이기 때문입니다. 여러분은 하나님과 재물을 함께 섬길 수 없습니다.","25":"그러므로 내가 여러분에게 말합니다. 여러분의 생명을 위하여 무엇을 먹을까 무엇을 마실까 염려하지 말고, 여러분의 몸을 위하여 무엇을 입을까 염려하지 마십시오. 생명이 음식보다, 몸이 옷보다 더 중요하지 않습니까?","26":"하늘의 새들을 바라보십시오. 그것들은 씨를 뿌리지도 거두지도 창고에 모아들이지도 않지만, 하늘의 여러분의 아버지께서 그것들을 먹이십니다. 여러분은 그것들보다 훨씬 더 귀하지 않습니까?","27":"여러분 가운데 누가 염려함으로 자기 수명에 한 큐빗을 더할 수 있습니까 [또는: 자기 키에 한 큐빗을 더할 수 있습니까]?","28":"또 여러분은 왜 옷에 관하여 염려합니까? 들의 백합들이 어떻게 자라는지 자세히 생각해 보십시오. 그것들은 수고하지도 않고 실을 잣지도 않습니다.","29":"그러나 내가 여러분에게 말합니다. 솔로몬도 그의 모든 영광 가운데서 이 꽃들 가운데 하나처럼 입지 못했습니다.","30":"오늘 있다가 내일 아궁이에 던져지는 들풀도 하나님께서 이렇게 입히시는데, 믿음이 작은 사람들이여, 하물며 여러분은 얼마나 더 잘 입히시겠습니까?","31":"그러므로 ‘무엇을 먹을까?’, ‘무엇을 마실까?’, ‘무엇을 입을까?’ 하며 염려하지 마십시오.","32":"이 모든 것은 이방인들이 애써 찾는 것들입니다. 하늘의 여러분의 아버지께서는 여러분에게 이 모든 것이 필요하다는 것을 알고 계십니다.","33":"그러나 먼저 그분의 왕국과 그분의 의를 추구하십시오. 그러면 이 모든 것이 여러분에게 더해질 것입니다.","34":"그러므로 내일을 염려하지 마십시오. 내일은 그 자체의 일을 염려할 것입니다. 그날의 어려움은 그날로 충분합니다."},"7":{"1":"심판하지 마십시오. 그래야 여러분도 심판받지 않습니다.","2":"여러분이 심판하는 그 심판으로 여러분도 심판받을 것이고, 여러분이 재는 그 척도로 여러분에게도 재어질 것입니다.","3":"왜 그대는 형제의 눈 속에 있는 티는 보면서 자기 눈 속에 있는 들보는 깨닫지 못합니까?","4":"또 어떻게 형제에게 ‘내가 네 눈에서 티를 빼 주겠다’라고 말할 수 있습니까? 보십시오, 그대의 눈 속에는 들보가 있습니다.","5":"위선자여, 먼저 그대의 눈에서 들보를 빼십시오. 그러면 그대가 분명히 보게 되어 형제의 눈에서 티를 빼 줄 수 있을 것입니다.","6":"거룩한 것을 개들에게 주지 말고 여러분의 진주들을 돼지들 앞에 던지지 마십시오. 그것들이 발로 그것들을 짓밟고 돌아서서 여러분을 찢을 수도 있습니다.","7":"구하십시오. 그러면 여러분에게 주실 것입니다. 찾으십시오. 그러면 발견할 것입니다. 두드리십시오. 그러면 여러분에게 열릴 것입니다.","8":"구하는 사람마다 받고, 찾는 사람은 발견하며, 두드리는 사람에게는 열릴 것이기 때문입니다.","9":"여러분 가운데 어떤 사람이 자기 아들이 빵을 달라고 하는데 돌을 주겠습니까?","10":"또 생선을 달라고 하는데 뱀을 주겠습니까?","11":"그러므로 여러분이 악한 사람들인데도 자기 자녀들에게 좋은 선물들을 줄 줄 안다면, 하늘들에 계신 여러분의 아버지께서는 구하는 사람들에게 얼마나 더 좋은 것들을 주시겠습니까!","12":"그러므로 사람들이 여러분에게 해 주기를 바라는 모든 것을 여러분도 그들에게 그대로 해 주십시오. 이것이 율법과 신언자들입니다.","13":"좁은 문으로 들어가십시오. 멸망으로 이끄는 문은 넓고 길은 널찍하여 그리로 들어가는 사람들이 많습니다.","14":"생명으로 이끄는 문은 좁고 길은 비좁아서 그것을 찾는 사람들이 적습니다.","15":"거짓 신언자들을 조심하십시오. 그들은 양의 옷을 입고 여러분에게 오지만 속에는 약탈하는 이리들입니다.","16":"여러분은 그들의 열매들로 그들을 알아볼 것입니다. 사람들이 가시나무에서 포도를, 엉겅퀴에서 무화과를 따겠습니까?","17":"이와 같이 좋은 나무마다 좋은 열매를 맺고 나쁜 나무는 나쁜 열매를 맺습니다.","18":"좋은 나무가 나쁜 열매를 맺을 수 없고 나쁜 나무가 좋은 열매를 맺을 수도 없습니다.","19":"좋은 열매를 맺지 않는 나무마다 찍혀 불 속에 던져집니다.","20":"그러므로 여러분은 그들의 열매들로 그들을 알아볼 것입니다.","21":"나에게 ‘주님, 주님’이라고 말하는 사람마다 하늘들의 왕국에 들어가는 것이 아니라, 하늘들에 계신 내 아버지의 뜻을 행하는 사람이 들어갈 것입니다.","22":"그날에 많은 사람이 나에게 ‘주님, 주님, 우리가 주님의 이름으로 신언하지 않았습니까? 주님의 이름으로 귀신들을 쫓아내고 주님의 이름으로 많은 능력의 일들을 행하지 않았습니까?’라고 말할 것입니다.","23":"그때 내가 그들에게 분명히 선언할 것입니다. ‘나는 여러분을 결코 알지 못했습니다. 불법을 행하는 사람들이여, 나에게서 떠나십시오.’","24":"그러므로 나의 이 말들을 듣고 행하는 사람은 누구나 반석 위에 자기 집을 지은 지혜로운 사람과 같을 것입니다.","25":"비가 내리고 홍수가 나며 바람이 불어 그 집에 들이쳤지만 무너지지 않았습니다. 그 집이 반석 위에 기초를 놓았기 때문입니다.","26":"또 나의 이 말들을 듣고 행하지 않는 사람은 누구나 모래 위에 자기 집을 지은 어리석은 사람과 같을 것입니다.","27":"비가 내리고 홍수가 나며 바람이 불어 그 집에 부딪히자 무너졌고, 그 무너짐이 매우 컸습니다.","28":"예수님께서 이 말씀들을 마치시자 무리들이 그분의 가르침에 놀랐다.","29":"그분께서 그들의 율법학자들처럼이 아니라 권위를 가지신 분처럼 그들을 가르치셨기 때문이다."},
8:{"1": "예수님께서 산에서 내려오시자 많은 무리가 그분을 따랐습니다.", "2": "그런데 보십시오, 한 나병 환자가 다가와 그분께 절하며 말했습니다. “주님, 주님께서 원하시면 저를 깨끗하게 하실 수 있습니다.”", "3": "예수님께서 손을 내밀어 그에게 대시며 말씀하셨습니다. “내가 원한다. 깨끗하게 되어라.” 그러자 즉시 그의 나병이 깨끗해졌습니다.", "4": "예수님께서 그에게 말씀하셨습니다. “아무에게도 말하지 않도록 주의하여라. 다만 가서 네 자신을 제사장에게 보이고, 모세가 명령한 예물을 드려 그들에게 증거가 되게 하여라.”", "5": "예수님께서 가버나움에 들어가셨을 때, 한 백부장이 그분께 다가와 간청하며", "6": "말했습니다. “주님, 제 종이 중풍병으로 집에 누워 몹시 괴로워하고 있습니다.”", "7": "예수님께서 그에게 말씀하셨습니다. “내가 가서 그를 고쳐 주겠다.”", "8": "백부장이 대답했습니다. “주님, 저는 주님을 제 지붕 아래로 모실 자격이 없습니다. 다만 말씀만 해 주십시오. 그러면 제 종이 나을 것입니다.", "9": "저도 권위 아래 있는 사람이고 제 아래에도 군인들이 있습니다. 이 사람에게 ‘가라’ 하면 가고, 다른 사람에게 ‘오라’ 하면 오며, 제 종에게 ‘이것을 하라’ 하면 합니다.”", "10": "예수님께서 이 말을 들으시고 놀라시며 따라오는 사람들에게 말씀하셨습니다. “내가 진실로 여러분에게 말합니다. 이스라엘 가운데서도 이처럼 큰 믿음을 발견하지 못했습니다.", "11": "내가 여러분에게 말합니다. 많은 사람이 동쪽과 서쪽에서 와서 아브라함과 이삭과 야곱과 함께 하늘들의 왕국에서 식탁에 앉을 것입니다.", "12": "그러나 왕국의 아들들은 바깥 어둠 속으로 내던져질 것입니다. 거기서 울며 이를 갈게 될 것입니다.”", "13": "그리고 예수님께서 백부장에게 말씀하셨습니다. “가십시오. 당신이 믿은 대로 당신에게 이루어지게 하십시오.” 바로 그 시각에 그의 종이 나았습니다.", "14": "예수님께서 베드로의 집에 들어가셔서 그의 장모가 열병으로 누워 있는 것을 보셨습니다.", "15": "예수님께서 그녀의 손을 만지시자 열병이 떠나갔고, 그녀는 일어나 그분을 섬겼습니다.", "16": "저녁이 되자 사람들이 귀신 들린 많은 사람을 그분께 데려왔습니다. 예수님께서는 말씀으로 그 영들을 쫓아내시고 병든 모든 사람을 고쳐 주셨습니다.", "17": "이것은 예언자 이사야를 통하여 말씀하신 것이 이루어지게 하려는 것이었습니다. “그분께서 친히 우리의 연약함을 짊어지시고 우리의 질병을 담당하셨다.”", "18": "예수님께서 자기 주위에 무리가 있는 것을 보시고 건너편으로 가라고 명령하셨습니다.", "19": "한 율법학자가 다가와 그분께 말했습니다. “선생님, 선생님께서 어디로 가시든지 제가 따라가겠습니다.”", "20": "예수님께서 그에게 말씀하셨습니다. “여우들도 굴이 있고 하늘의 새들도 보금자리가 있지만, 사람의 아들은 머리를 둘 곳조차 없습니다.”", "21": "제자들 가운데 다른 한 사람이 그분께 말했습니다. “주님, 제가 먼저 가서 제 아버지를 장사하도록 허락해 주십시오.”", "22": "그러나 예수님께서 그에게 말씀하셨습니다. “나를 따르십시오. 죽은 사람들이 자기들의 죽은 사람들을 장사하게 하십시오.”", "23": "예수님께서 배에 오르시자 제자들이 그분을 따랐습니다.", "24": "그런데 보십시오, 바다에 큰 폭풍이 일어나 배가 파도에 덮일 정도가 되었습니다. 그러나 예수님께서는 주무시고 계셨습니다.", "25": "제자들이 다가가 그분을 깨우며 말했습니다. “주님, 구해 주십시오! 우리가 죽게 되었습니다!”", "26": "예수님께서 그들에게 말씀하셨습니다. “믿음이 적은 사람들이여, 왜 두려워합니까?” 그런 다음 일어나셔서 바람과 바다를 꾸짖으시자 아주 고요해졌습니다.", "27": "사람들이 놀라며 말했습니다. “이분은 도대체 어떤 분이시기에 바람과 바다까지도 그분께 순종하는가?”", "28": "예수님께서 건너편 가다라 사람들의 지방에 도착하시자, 귀신 들린 두 사람이 무덤에서 나와 그분을 만났습니다. 그들은 몹시 사나워서 아무도 그 길로 지나갈 수 없었습니다.", "29": "그런데 보십시오, 그들이 소리쳤습니다. “하나님의 아들이시여, 우리가 당신과 무슨 상관이 있습니까? 정해진 때가 되기도 전에 우리를 괴롭히려고 여기 오셨습니까?”", "30": "그들에게서 멀리 떨어진 곳에 많은 돼지 떼가 먹이를 먹고 있었습니다.", "31": "귀신들이 예수님께 간청했습니다. “우리를 쫓아내시려거든 돼지 떼 속으로 보내 주십시오.”", "32": "예수님께서 그들에게 말씀하셨습니다. “가라.” 그러자 그들이 나와 돼지들 속으로 들어갔습니다. 그런데 보십시오, 온 돼지 떼가 비탈을 내리달아 바다로 뛰어들어 물속에서 죽었습니다.", "33": "돼지를 치던 사람들이 달아나 성읍으로 들어가 모든 일과 귀신 들렸던 사람들에게 일어난 일을 알렸습니다.", "34": "그러자 보십시오, 온 성읍 사람들이 예수님을 만나려고 나왔습니다. 그들은 그분을 보고 자기들의 지역에서 떠나 달라고 간청했습니다."},
9:{"1": "예수님께서 배에 오르셔서 건너가 자기 성읍으로 가셨습니다.", "2": "그런데 보십시오, 사람들이 침상에 누운 한 중풍병자를 그분께 데려왔습니다. 예수님께서 그들의 믿음을 보시고 중풍병자에게 말씀하셨습니다. “용기를 내어라, 아들아. 네 죄들이 용서받았다.”", "3": "그런데 율법학자들 가운데 몇 사람이 속으로 말했습니다. “이 사람이 신성모독을 하는구나.”", "4": "예수님께서 그들의 생각을 아시고 말씀하셨습니다. “왜 여러분은 마음속으로 악한 생각을 합니까?", "5": "‘네 죄들이 용서받았다’라고 말하는 것과 ‘일어나 걸어라’라고 말하는 것 가운데 어느 것이 더 쉽습니까?", "6": "그러나 사람의 아들이 땅에서 죄들을 용서하는 권위를 가지고 있다는 것을 여러분이 알게 하겠습니다.” 그때 그분께서 중풍병자에게 말씀하셨습니다. “일어나 네 침상을 들고 네 집으로 가거라.”", "7": "그러자 그가 일어나 자기 집으로 갔습니다.", "8": "무리가 이것을 보고 두려워하며 사람들에게 이와 같은 권위를 주신 하나님께 영광을 돌렸습니다.", "9": "예수님께서 거기서 지나가시다가 세관에 앉아 있는 마태라는 사람을 보시고 그에게 말씀하셨습니다. “나를 따르십시오.” 그러자 그가 일어나 그분을 따랐습니다.", "10": "예수님께서 집에서 식탁에 앉아 계실 때, 보십시오, 많은 세리와 죄인들이 와서 예수님과 그분의 제자들과 함께 식탁에 앉았습니다.", "11": "바리새인들이 이것을 보고 그분의 제자들에게 말했습니다. “왜 여러분의 선생은 세리들과 죄인들과 함께 먹습니까?”", "12": "예수님께서 들으시고 말씀하셨습니다. “건강한 사람들에게는 의사가 필요하지 않지만 병든 사람들에게는 필요합니다.", "13": "여러분은 가서 ‘나는 긍휼을 원하고 희생 제사를 원하지 않는다’라는 말이 무슨 뜻인지 배우십시오. 나는 의인들을 부르러 온 것이 아니라 죄인들을 부르러 왔습니다.”", "14": "그때 요한의 제자들이 예수님께 와서 말했습니다. “우리와 바리새인들은 금식하는데, 왜 선생님의 제자들은 금식하지 않습니까?”", "15": "예수님께서 그들에게 말씀하셨습니다. “신랑이 함께 있는 동안 혼인 잔치의 손님들이 슬퍼할 수 있겠습니까? 그러나 신랑을 빼앗길 날들이 올 것입니다. 그때에는 그들이 금식할 것입니다.", "16": "아무도 새 천 조각을 낡은 옷에 대고 꿰매지 않습니다. 그 조각이 옷을 잡아당겨 더 심하게 찢어지기 때문입니다.", "17": "또 새 포도주를 낡은 가죽부대에 넣지 않습니다. 그렇게 하면 가죽부대가 터지고 포도주는 쏟아지며 가죽부대도 망가집니다. 오히려 새 포도주는 새 가죽부대에 넣어야 둘 다 보존됩니다.”", "18": "예수님께서 그들에게 이런 말씀을 하고 계실 때, 보십시오, 한 지도자가 와서 그분께 절하며 말했습니다. “제 딸이 방금 죽었습니다. 그러나 오셔서 그 아이에게 손을 얹어 주십시오. 그러면 살아날 것입니다.”", "19": "예수님께서 일어나 그를 따라가셨고 제자들도 함께 갔습니다.", "20": "그런데 보십시오, 열두 해 동안 혈루증을 앓던 한 여자가 뒤에서 다가와 그분의 겉옷 술에 손을 댔습니다.", "21": "그 여자는 속으로 “내가 그분의 겉옷에 손만 대어도 구원받을 것이다”라고 말하고 있었습니다.", "22": "예수님께서 돌아서서 그녀를 보시고 말씀하셨습니다. “용기를 내십시오, 딸이여. 당신의 믿음이 당신을 구원했습니다.” 바로 그때부터 그 여자는 나았습니다.", "23": "예수님께서 그 지도자의 집에 들어가 피리 부는 사람들과 소란스러운 무리를 보시고", "24": "말씀하셨습니다. “물러가십시오. 그 소녀는 죽은 것이 아니라 자고 있습니다.” 그러자 그들은 그분을 비웃었습니다.", "25": "무리가 밖으로 내보내진 뒤 예수님께서 들어가 그 소녀의 손을 잡으셨고, 소녀가 일어났습니다.", "26": "이 소식이 그 온 지역에 퍼졌습니다.", "27": "예수님께서 거기서 지나가실 때 두 눈먼 사람이 따라오며 외쳤습니다. “다윗의 아들이시여, 우리를 불쌍히 여겨 주십시오!”", "28": "예수님께서 집에 들어가시자 그 눈먼 사람들이 그분께 나아왔습니다. 예수님께서 그들에게 말씀하셨습니다. “내가 이것을 할 수 있다고 믿습니까?” 그들이 대답했습니다. “그렇습니다, 주님.”", "29": "그때 예수님께서 그들의 눈을 만지시며 말씀하셨습니다. “여러분의 믿음대로 여러분에게 이루어지게 하십시오.”", "30": "그러자 그들의 눈이 열렸습니다. 예수님께서 엄하게 경고하셨습니다. “아무도 알지 못하게 하십시오.”", "31": "그러나 그들은 나가서 그 온 지역에 그분에 관한 소문을 퍼뜨렸습니다.", "32": "그들이 나가고 있을 때, 보십시오, 사람들이 귀신 들려 말을 못 하는 한 사람을 예수님께 데려왔습니다.", "33": "귀신이 쫓겨나자 말을 못 하던 사람이 말하기 시작했습니다. 무리가 놀라며 말했습니다. “이스라엘에서 이런 일은 한 번도 나타난 적이 없습니다.”", "34": "그러나 바리새인들은 말했습니다. “그가 귀신들의 통치자를 힘입어 귀신들을 쫓아낸다.”", "35": "예수님께서 모든 성읍과 마을을 두루 다니시며 그들의 회당에서 가르치시고 왕국의 복음을 선포하시며 모든 질병과 모든 연약함을 고쳐 주셨습니다.", "36": "그분께서 무리를 보시고 그들을 불쌍히 여기셨습니다. 그들이 목자 없는 양들처럼 괴롭힘을 당하고 내버려져 있었기 때문입니다.", "37": "그때 그분께서 제자들에게 말씀하셨습니다. “추수할 것은 많지만 일꾼들은 적습니다.", "38": "그러므로 추수의 주님께 간청하여 그분의 추수에 일꾼들을 보내시도록 하십시오.”"},
10:{"1": "예수님께서 열두 제자를 불러 가까이 오게 하시고 그들에게 더러운 영들을 다스리는 권위를 주셔서 그것들을 쫓아내고 모든 질병과 모든 연약함을 고치게 하셨습니다.", "2": "열두 사도의 이름은 이러합니다. 첫째는 베드로라고 불리는 시몬과 그의 형제 안드레이고, 세베대의 아들 야고보와 그의 형제 요한,", "3": "빌립과 바돌로매, 도마와 세리 마태, 알패오의 아들 야고보와 다대오,", "4": "가나나이오스라고 불리는 시몬과 예수님을 넘겨준 가룟 유다입니다.", "5": "예수님께서 이 열둘을 보내시며 명령하여 말씀하셨습니다. “이방인들의 길로 가지 말고 사마리아 사람들의 성읍에도 들어가지 마십시오.", "6": "오히려 이스라엘 집의 잃어버린 양들에게 가십시오.", "7": "가면서 ‘하늘들의 왕국이 가까이 왔다’라고 선포하십시오.", "8": "병든 사람들을 고치고, 죽은 사람들을 일으키며, 나병 환자들을 깨끗하게 하고, 귀신들을 쫓아내십시오. 여러분은 거저 받았으니 거저 주십시오.", "9": "여러분의 허리띠에 금이나 은이나 동전을 마련하지 말고,", "10": "여행을 위한 자루나 두 벌의 속옷이나 신발이나 지팡이도 마련하지 마십시오. 일꾼이 자기 먹을 것을 받는 것이 마땅하기 때문입니다.", "11": "어떤 성읍이나 마을에 들어가든지 그곳에서 합당한 사람이 누구인지 알아보고 떠날 때까지 그곳에 머무르십시오.", "12": "그 집에 들어갈 때 그 집에 평안을 빌어 주십시오.", "13": "그 집이 합당하면 여러분의 평안이 그 위에 임하게 하고, 합당하지 않으면 여러분의 평안이 여러분에게 돌아오게 하십시오.", "14": "누구든지 여러분을 받아들이지 않고 여러분의 말을 듣지도 않으면, 그 집이나 그 성읍에서 나올 때 여러분의 발에서 먼지를 털어 버리십시오.", "15": "내가 진실로 여러분에게 말합니다. 심판의 날에 소돔과 고모라 땅이 그 성읍보다 견디기 쉬울 것입니다.", "16": "보십시오, 내가 여러분을 늑대들 가운데 양들처럼 보냅니다. 그러므로 뱀들처럼 지혜롭고 비둘기들처럼 순전하십시오.", "17": "사람들을 조심하십시오. 그들이 여러분을 공회에 넘겨주고 자기들의 회당에서 채찍질할 것입니다.", "18": "또 나 때문에 여러분이 총독들과 왕들 앞에 끌려가 그들과 이방인들에게 증거하게 될 것입니다.", "19": "그들이 여러분을 넘겨줄 때 어떻게 또는 무엇을 말할지 염려하지 마십시오. 여러분이 무엇을 말해야 할지가 그때 여러분에게 주어질 것입니다.", "20": "말하는 이는 여러분이 아니라 여러분 안에서 말씀하시는 여러분의 아버지의 영이시기 때문입니다.", "21": "형제가 형제를 죽음에 넘겨주고 아버지가 자식을 넘겨주며, 자식들이 부모를 대적하여 일어나 그들을 죽게 할 것입니다.", "22": "또 여러분은 내 이름 때문에 모든 사람에게 미움을 받을 것입니다. 그러나 끝까지 견딘 사람은 구원받을 것입니다.", "23": "그들이 이 성읍에서 여러분을 박해하면 다른 성읍으로 피하십시오. 내가 진실로 여러분에게 말합니다. 사람의 아들이 올 때까지 여러분이 이스라엘의 성읍들을 다 돌지 못할 것입니다.", "24": "제자가 선생보다 높지 않고 종이 주인보다 높지 않습니다.", "25": "제자가 자기 선생처럼 되고 종이 자기 주인처럼 되는 것으로 충분합니다. 사람들이 집주인을 베엘세불이라고 불렀다면 그의 집안사람들은 얼마나 더 그렇게 부르겠습니까?", "26": "그러므로 그들을 두려워하지 마십시오. 덮여 있는 것 가운데 드러나지 않을 것이 없고, 감추어진 것 가운데 알려지지 않을 것이 없습니다.", "27": "내가 어둠 속에서 여러분에게 말하는 것을 빛 가운데서 말하고, 여러분이 귀로 듣는 것을 지붕 위에서 선포하십시오.", "28": "몸은 죽여도 혼은 죽일 수 없는 사람들을 두려워하지 마십시오. 오히려 혼과 몸을 모두 게헨나에서 멸하실 수 있는 분을 두려워하십시오.", "29": "참새 두 마리가 한 앗사리온에 팔리지 않습니까? 그러나 여러분의 아버지의 허락 없이는 그 가운데 하나도 땅에 떨어지지 않습니다.", "30": "여러분에게는 머리털까지도 모두 세어져 있습니다.", "31": "그러므로 두려워하지 마십시오. 여러분은 많은 참새보다 더 귀합니다.", "32": "그러므로 누구든지 사람들 앞에서 나를 인정하면 나도 하늘에 계신 내 아버지 앞에서 그를 인정할 것입니다.", "33": "그러나 누구든지 사람들 앞에서 나를 부인하면 나도 하늘에 계신 내 아버지 앞에서 그를 부인할 것입니다.", "34": "내가 땅에 평화를 주러 왔다고 생각하지 마십시오. 나는 평화를 주러 온 것이 아니라 칼을 주러 왔습니다.", "35": "나는 사람이 자기 아버지와, 딸이 자기 어머니와, 며느리가 자기 시어머니와 맞서게 하려고 왔습니다.", "36": "사람의 원수들이 자기 집안사람들이 될 것입니다.", "37": "아버지나 어머니를 나보다 더 사랑하는 사람은 내게 합당하지 않고, 아들이나 딸을 나보다 더 사랑하는 사람도 내게 합당하지 않습니다.", "38": "또 자기 십자가를 지고 나를 따르지 않는 사람은 내게 합당하지 않습니다.", "39": "자기 생명을 얻은 사람은 그것을 잃을 것이고, 나 때문에 자기 생명을 잃은 사람은 그것을 얻을 것입니다.", "40": "여러분을 받아들이는 사람은 나를 받아들이고, 나를 받아들이는 사람은 나를 보내신 분을 받아들입니다.", "41": "예언자의 이름으로 예언자를 받아들이는 사람은 예언자의 보상을 받을 것이고, 의인의 이름으로 의인을 받아들이는 사람은 의인의 보상을 받을 것입니다.", "42": "또 누구든지 이 작은 이들 가운데 하나에게 제자라는 이름으로 차가운 물 한 잔이라도 마시게 하는 사람은, 내가 진실로 여러분에게 말합니다. 결코 자기 보상을 잃지 않을 것입니다.”"},
11:{"1": "예수님께서 열두 제자에게 지시하시기를 마치신 뒤, 그들의 성읍들에서 가르치고 선포하시려고 거기서 떠나셨습니다.", "2": "요한은 감옥에서 그리스도께서 하신 일들을 듣고 자기 제자들을 보내어", "3": "그분께 말했습니다. “오실 분이 당신이십니까, 아니면 우리가 다른 분을 기다려야 합니까?”", "4": "예수님께서 그들에게 대답하셨습니다. “가서 여러분이 듣고 보는 것을 요한에게 알리십시오.", "5": "눈먼 사람들이 보고, 다리 저는 사람들이 걸으며, 나병 환자들이 깨끗해지고, 귀먹은 사람들이 들으며, 죽은 사람들이 일으켜지고, 가난한 사람들에게 복음이 전해집니다.", "6": "그리고 나로 인해 걸려 넘어지지 않는 사람은 복이 있습니다.”", "7": "그들이 떠나자 예수님께서 요한에 관하여 무리에게 말씀하기 시작하셨습니다. “여러분은 무엇을 보려고 광야에 나갔습니까? 바람에 흔들리는 갈대입니까?", "8": "그러면 무엇을 보려고 나갔습니까? 부드러운 옷을 입은 사람입니까? 보십시오, 부드러운 옷을 입은 사람들은 왕궁에 있습니다.", "9": "그러면 무엇을 보려고 나갔습니까? 예언자입니까? 그렇습니다. 내가 여러분에게 말합니다. 예언자보다 더 큰 사람입니다.", "10": "이 사람은 기록되기를 ‘보라, 내가 내 사자를 네 앞에 보내니 그가 네 앞에서 네 길을 준비할 것이다’라고 한 바로 그 사람입니다.", "11": "내가 진실로 여러분에게 말합니다. 여자에게서 태어난 사람들 가운데 세례자 요한보다 더 큰 사람이 일어난 적이 없습니다. 그러나 하늘들의 왕국에서 더 작은 사람도 그보다 큽니다.", "12": "세례자 요한의 날들부터 지금까지 하늘들의 왕국은 힘있게 전진하고 있으며 [또는: 폭력을 당하고 있으며], 힘쓰는 사람들이 그것을 붙잡습니다 [또는: 폭력적인 사람들이 그것을 빼앗습니다].", "13": "모든 예언자들과 율법은 요한까지 예언했습니다.", "14": "그리고 여러분이 받아들이기를 원한다면, 그가 바로 오기로 되어 있는 엘리야입니다.", "15": "들을 귀가 있는 사람은 들으십시오.", "16": "이 세대를 무엇에 비유해야 하겠습니까? 장터에 앉아 다른 아이들을 불러", "17": "‘우리가 너희를 위해 피리를 불어도 너희가 춤추지 않았고, 우리가 애곡해도 너희가 가슴을 치지 않았다’라고 말하는 아이들과 같습니다.", "18": "요한이 와서 먹지도 않고 마시지도 않자 사람들이 ‘그에게 귀신이 들렸다’라고 말합니다.", "19": "사람의 아들이 와서 먹고 마시자 사람들이 말합니다. ‘보라, 먹기를 탐하고 포도주를 즐기는 사람이며 세리들과 죄인들의 친구다.’ 그러나 지혜는 그 행위들로 옳다는 것이 드러납니다.”", "20": "그때 예수님께서 자신의 능력 있는 일들이 가장 많이 행해진 성읍들을 꾸짖기 시작하셨습니다. 그들이 회개하지 않았기 때문입니다.", "21": "“화가 있다, 고라신아! 화가 있다, 벳새다야! 너희 가운데서 행해진 능력 있는 일들이 두로와 시돈에서 행해졌더라면 그들은 오래전에 굵은 베옷을 입고 재 가운데 앉아 회개했을 것이다.", "22": "그러나 내가 너희에게 말한다. 심판의 날에는 두로와 시돈이 너희보다 견디기 쉬울 것이다.", "23": "그리고 가버나움아, 네가 하늘까지 높아지겠느냐? 하데스까지 내려갈 것이다. 네 안에서 행해진 능력 있는 일들이 소돔에서 행해졌더라면 그 성읍은 오늘까지 남아 있었을 것이다.", "24": "그러나 내가 너희에게 말한다. 심판의 날에는 소돔 땅이 너보다 견디기 쉬울 것이다.”", "25": "그때 예수님께서 대답하여 말씀하셨습니다. “아버지, 하늘과 땅의 주님이시여, 내가 아버지를 찬양합니다. 아버지께서 이것들을 지혜롭고 총명한 사람들에게는 감추시고 어린아이들에게는 드러내셨기 때문입니다.", "26": "그렇습니다, 아버지. 이것이 아버지 앞에서 기쁘신 뜻이었습니다.", "27": "모든 것이 내 아버지께서 나에게 넘겨주셨습니다. 아버지 외에는 아무도 아들을 온전히 알지 못하고, 아들과 아들이 드러내 주기를 원하는 사람 외에는 아무도 아버지를 온전히 알지 못합니다.", "28": "수고하며 무거운 짐을 진 모든 사람은 내게로 오십시오. 내가 여러분에게 안식을 주겠습니다.", "29": "나는 마음이 온유하고 겸손하니 내 멍에를 메고 나에게서 배우십시오. 그러면 여러분의 혼에 안식을 얻을 것입니다.", "30": "내 멍에는 편하고 [또는: 친절하고, 잘 맞고] 내 짐은 가볍기 때문입니다.”"},
12:{"1": "그때 예수님께서 안식일에 밀밭 사이로 지나가셨습니다. 제자들이 배가 고파 이삭을 잘라 먹기 시작했습니다.", "2": "바리새인들이 이것을 보고 그분께 말했습니다. “보십시오, 선생님의 제자들이 안식일에 해서는 안 되는 일을 하고 있습니다.”", "3": "예수님께서 그들에게 말씀하셨습니다. “다윗과 그와 함께 있던 사람들이 배고팠을 때 그가 무엇을 했는지 읽어보지 못했습니까?", "4": "그가 하나님의 집에 들어가 제사장들 외에는 자신도 함께 있던 사람들도 먹는 것이 허용되지 않은 진설병을 먹었습니다.", "5": "또 안식일에 성전 안의 제사장들이 안식일을 범하면서도 죄가 없다는 것을 율법에서 읽어보지 못했습니까?", "6": "내가 여러분에게 말합니다. 성전보다 더 큰 것이 여기 있습니다.", "7": "그러나 여러분이 ‘나는 긍휼을 원하고 희생 제사를 원하지 않는다’라는 말이 무슨 뜻인지 알았더라면 죄 없는 사람들을 정죄하지 않았을 것입니다.", "8": "사람의 아들은 안식일의 주인이기 때문입니다.”", "9": "예수님께서 거기서 떠나 그들의 회당에 들어가셨습니다.", "10": "그런데 보십시오, 한쪽 손이 오그라든 사람이 있었습니다. 사람들이 예수님을 고발하려고 “안식일에 병을 고치는 것이 허용됩니까?”라고 물었습니다.", "11": "예수님께서 그들에게 말씀하셨습니다. “여러분 가운데 어떤 사람에게 양 한 마리가 있는데 그것이 안식일에 구덩이에 빠지면, 그가 붙잡아 끌어올리지 않겠습니까?", "12": "사람은 양보다 얼마나 더 귀합니까! 그러므로 안식일에 선을 행하는 것은 허용됩니다.”", "13": "그때 예수님께서 그 사람에게 말씀하셨습니다. “손을 펴십시오.” 그가 펴자 다른 손처럼 온전하게 회복되었습니다.", "14": "그러나 바리새인들은 나가서 어떻게 예수님을 없앨지 그분을 대적하여 모의했습니다.", "15": "예수님께서 이것을 아시고 거기서 물러가셨습니다. 많은 사람이 그분을 따랐고, 그분께서 그들을 모두 고쳐 주시며", "16": "자신을 드러내지 말라고 엄하게 당부하셨습니다.", "17": "이것은 예언자 이사야를 통하여 말씀하신 것이 이루어지게 하려는 것이었습니다.", "18": "“보라, 내가 선택한 나의 종, 내 혼이 기뻐하는 나의 사랑하는 이다. 내가 내 영을 그 위에 둘 것이며, 그는 이방인들에게 정의를 선포할 것이다.", "19": "그는 다투지도 않고 외치지도 않을 것이며, 아무도 거리에서 그의 음성을 듣지 못할 것이다.", "20": "상한 갈대를 꺾지 않고 연기 나는 심지를 끄지 않을 것이며, 마침내 정의를 승리로 이끌 것이다.", "21": "그리고 이방인들이 그의 이름에 소망을 둘 것이다.”", "22": "그때 귀신 들려 눈멀고 말을 못 하는 한 사람이 예수님께 데려와졌습니다. 그분께서 그를 고쳐 주시자 말을 못 하던 사람이 말하고 보게 되었습니다.", "23": "모든 무리가 놀라며 말했습니다. “혹시 이분이 다윗의 아들이 아니겠습니까?”", "24": "그러나 바리새인들은 듣고 말했습니다. “이 사람은 귀신들의 통치자 베엘세불을 힘입지 않고서는 귀신들을 쫓아내지 못한다.”", "25": "예수님께서 그들의 생각을 아시고 말씀하셨습니다. “스스로 분열된 모든 왕국은 황폐해지고, 스스로 분열된 모든 성읍이나 집은 서지 못합니다.", "26": "사탄이 사탄을 쫓아낸다면 스스로 분열된 것입니다. 그렇다면 그의 왕국이 어떻게 서겠습니까?", "27": "내가 베엘세불을 힘입어 귀신들을 쫓아낸다면 여러분의 아들들은 누구를 힘입어 쫓아냅니까? 그러므로 그들이 여러분의 재판관이 될 것입니다.", "28": "그러나 내가 하나님의 영을 힘입어 귀신들을 쫓아낸다면 하나님의 왕국이 이미 여러분에게 이르렀습니다.", "29": "또 어떻게 사람이 먼저 강한 자를 묶지 않고 그의 집에 들어가 그의 재산을 약탈할 수 있겠습니까? 묶은 뒤에야 그의 집을 약탈할 것입니다.", "30": "나와 함께하지 않는 사람은 나를 대적하는 것이며, 나와 함께 모으지 않는 사람은 흩어 버리는 것입니다.", "31": "그러므로 내가 여러분에게 말합니다. 사람들에게 모든 죄와 신성모독은 용서받을 것이지만, 그 영을 모독하는 것은 용서받지 못할 것입니다.", "32": "누구든지 사람의 아들을 거슬러 말하면 용서받을 것입니다. 그러나 누구든지 성령을 거슬러 말하면 이 시대에도 오는 시대에도 용서받지 못할 것입니다.", "33": "나무를 좋게 하고 그 열매도 좋게 하든지, 나무를 나쁘게 하고 그 열매도 나쁘게 하십시오. 나무는 그 열매로 알려지기 때문입니다.", "34": "독사의 자손들이여! 여러분이 악하면서 어떻게 좋은 것을 말할 수 있습니까? 마음에 가득한 것을 입이 말하기 때문입니다.", "35": "선한 사람은 선한 보물에서 선한 것들을 내고, 악한 사람은 악한 보물에서 악한 것들을 냅니다.", "36": "내가 여러분에게 말합니다. 사람들이 말하는 모든 쓸모없는 말에 대하여 심판의 날에 해명해야 할 것입니다.", "37": "여러분의 말들로 여러분이 의롭다고 인정받을 것이며, 여러분의 말들로 여러분이 정죄받을 것입니다.”", "38": "그때 율법학자들과 바리새인들 가운데 몇 사람이 예수님께 대답했습니다. “선생님, 우리는 선생님에게서 표적을 보고 싶습니다.”", "39": "그러나 예수님께서 그들에게 대답하셨습니다. “악하고 간음하는 세대가 표적을 찾지만, 예언자 요나의 표적 외에는 어떤 표적도 주어지지 않을 것입니다.", "40": "요나가 큰 물고기의 배 속에 사흘 낮과 사흘 밤을 있었던 것처럼 사람의 아들도 땅의 심장부에 사흘 낮과 사흘 밤을 있을 것입니다.", "41": "니느웨 사람들이 심판 때에 이 세대와 함께 일어나 이 세대를 정죄할 것입니다. 그들이 요나의 선포를 듣고 회개했기 때문입니다. 그런데 보십시오, 요나보다 더 큰 것이 여기 있습니다.", "42": "남방의 여왕이 심판 때에 이 세대와 함께 일어나 이 세대를 정죄할 것입니다. 그녀가 솔로몬의 지혜를 들으려고 땅끝에서 왔기 때문입니다. 그런데 보십시오, 솔로몬보다 더 큰 것이 여기 있습니다.", "43": "더러운 영이 사람에게서 나가면 물 없는 곳들을 돌아다니며 쉴 곳을 찾지만 찾지 못합니다.", "44": "그때 그것이 말합니다. ‘내가 나온 내 집으로 돌아가겠다.’ 그리고 와서 그 집이 비어 있고 쓸려 있으며 정돈되어 있는 것을 발견합니다.", "45": "그러면 가서 자기보다 더 악한 다른 영 일곱을 데리고 들어가 거기에 거주합니다. 그 사람의 마지막 상태가 처음보다 더 나빠집니다. 이 악한 세대도 그렇게 될 것입니다.”", "46": "예수님께서 아직 무리에게 말씀하고 계실 때, 보십시오, 그분의 어머니와 형제들이 그분께 말하려고 밖에 서 있었습니다.", "47": "[일부 사본에는 다음 절이 있습니다: 어떤 사람이 그분께 말했습니다. “보십시오, 선생님의 어머니와 형제들이 선생님께 말하려고 밖에 서 있습니다.”]", "48": "예수님께서 자신에게 말한 사람에게 대답하셨습니다. “누가 내 어머니이며 누가 내 형제들입니까?”", "49": "그리고 제자들을 향해 손을 내미시며 말씀하셨습니다. “보십시오, 내 어머니와 내 형제들입니다!", "50": "누구든지 하늘에 계신 내 아버지의 뜻을 행하는 사람이 내 형제이고 자매이며 어머니입니다.”"},
13:{"1": "그날 예수님께서 집에서 나가 바닷가에 앉으셨습니다.", "2": "매우 많은 무리가 그분께 모여들자 그분께서는 배에 올라 앉으셨고, 온 무리는 해변에 서 있었습니다.", "3": "그분께서 비유들로 그들에게 많은 것을 말씀하셨습니다. “보십시오, 씨 뿌리는 사람이 씨를 뿌리러 나갔습니다.", "4": "그가 씨를 뿌릴 때 어떤 것들은 길가에 떨어졌고, 새들이 와서 먹어 버렸습니다.", "5": "또 어떤 것들은 흙이 많지 않은 돌밭에 떨어졌고, 흙이 깊지 않아 곧 싹이 났습니다.", "6": "그러나 해가 뜨자 타 버렸고 뿌리가 없어서 말라 버렸습니다.", "7": "또 어떤 것들은 가시덤불 위에 떨어졌고, 가시덤불이 자라 그것들을 숨 막히게 했습니다.", "8": "또 어떤 것들은 좋은 땅에 떨어져 열매를 맺었는데, 어떤 것은 백 배, 어떤 것은 육십 배, 어떤 것은 삼십 배였습니다.", "9": "들을 귀가 있는 사람은 들으십시오.”", "10": "제자들이 다가와 예수님께 말했습니다. “왜 그들에게 비유로 말씀하십니까?”", "11": "예수님께서 대답하셨습니다. “여러분에게는 하늘들의 왕국의 비밀들을 아는 것이 주어졌지만, 그들에게는 주어지지 않았습니다.", "12": "가진 사람에게는 더 주어져 풍성하게 될 것이지만, 가지지 않은 사람에게서는 가진 것마저 빼앗길 것입니다.", "13": "그러므로 내가 그들에게 비유로 말하는 것은 그들이 보아도 보지 못하고 들어도 듣지 못하며 깨닫지도 못하기 때문입니다.", "14": "그들에게 이사야의 예언이 이루어집니다. ‘너희가 듣기는 들어도 결코 깨닫지 못할 것이며, 보기는 보아도 결코 알아보지 못할 것이다.", "15": "이 백성의 마음이 무디어졌고, 귀로는 둔하게 들으며, 눈을 감았기 때문이다. 그렇지 않았다면 그들이 눈으로 보고 귀로 듣고 마음으로 깨달아 돌이킬 것이며 내가 그들을 고쳐 주었을 것이다.’", "16": "그러나 여러분의 눈은 보기 때문에 복이 있고, 여러분의 귀는 듣기 때문에 복이 있습니다.", "17": "내가 진실로 여러분에게 말합니다. 많은 예언자와 의인이 여러분이 보는 것을 보고 싶어 했지만 보지 못했고, 여러분이 듣는 것을 듣고 싶어 했지만 듣지 못했습니다.", "18": "그러므로 여러분은 씨 뿌리는 사람의 비유를 들으십시오.", "19": "누구든지 왕국의 말씀을 듣고 깨닫지 못하면 악한 자가 와서 그의 마음에 뿌려진 것을 빼앗아 갑니다. 이것이 길가에 씨가 뿌려진 사람입니다.", "20": "돌밭에 씨가 뿌려진 사람은 말씀을 듣고 즉시 기쁨으로 받아들이지만,", "21": "자기 안에 뿌리가 없어 잠시뿐이며 말씀 때문에 환난이나 박해가 일어나면 즉시 걸려 넘어집니다.", "22": "가시덤불 사이에 씨가 뿌려진 사람은 말씀을 듣지만 이 시대의 염려와 재물의 속임수가 말씀을 숨 막히게 하여 열매 맺지 못하게 합니다.", "23": "좋은 땅에 씨가 뿌려진 사람은 말씀을 듣고 깨닫는 사람입니다. 그는 참으로 열매를 맺어 어떤 사람은 백 배, 어떤 사람은 육십 배, 어떤 사람은 삼십 배를 냅니다.”", "24": "예수님께서 또 다른 비유를 그들 앞에 제시하셨습니다. “하늘들의 왕국은 자기 밭에 좋은 씨를 뿌린 사람과 같습니다.", "25": "사람들이 자는 동안 그의 원수가 와서 밀 가운데 가라지를 덧뿌리고 갔습니다.", "26": "싹이 나고 열매를 맺었을 때 가라지도 나타났습니다.", "27": "집주인의 종들이 와서 말했습니다. ‘주인님, 밭에 좋은 씨를 뿌리지 않으셨습니까? 그런데 가라지는 어디서 생겼습니까?’", "28": "그가 말했습니다. ‘원수가 이렇게 했다.’ 종들이 말했습니다. ‘그러면 우리가 가서 그것들을 뽑아 모으기를 원하십니까?’", "29": "그러나 그가 말했습니다. ‘아니다. 가라지를 뽑다가 그것들과 함께 밀까지 뽑을까 염려된다.", "30": "추수 때까지 둘 다 함께 자라게 두어라. 추수 때에 내가 추수하는 사람들에게 말하겠다. 먼저 가라지를 모아 불태우도록 단으로 묶고, 밀은 내 곳간에 모아들이라고 하겠다.’”", "31": "예수님께서 또 다른 비유를 그들 앞에 제시하셨습니다. “하늘들의 왕국은 사람이 가져다가 자기 밭에 심은 겨자씨 한 알과 같습니다.", "32": "그것은 모든 씨보다 작지만 자라면 채소들보다 커져 나무가 되고, 하늘의 새들이 와서 그 가지들에 깃들입니다.”", "33": "예수님께서 또 다른 비유를 그들에게 말씀하셨습니다. “하늘들의 왕국은 여자가 가져다가 밀가루 세 사톤 속에 숨겨 넣어 마침내 전부 부풀게 한 누룩과 같습니다.”", "34": "예수님께서는 이 모든 것을 무리에게 비유로 말씀하셨고, 비유 없이는 그들에게 아무것도 말씀하지 않으셨습니다.", "35": "이것은 예언자를 통하여 말씀하신 것이 이루어지게 하려는 것이었습니다. “내가 비유로 내 입을 열고 세상의 기초가 놓인 때부터 감추어진 것들을 말하겠다.”", "36": "그때 예수님께서 무리를 떠나 집으로 들어가셨습니다. 제자들이 그분께 와서 말했습니다. “밭의 가라지 비유를 우리에게 설명해 주십시오.”", "37": "예수님께서 대답하셨습니다. “좋은 씨를 뿌리는 이는 사람의 아들입니다.", "38": "밭은 세상이고, 좋은 씨는 왕국의 아들들이며, 가라지는 악한 자의 아들들입니다.", "39": "가라지를 뿌린 원수는 마귀이고, 추수는 시대의 완성이며, 추수하는 사람들은 천사들입니다.", "40": "그러므로 가라지가 모아져 불에 태워지는 것처럼 시대의 완성에도 그렇게 될 것입니다.", "41": "사람의 아들이 자기 천사들을 보낼 것이며, 그들은 그의 왕국에서 걸려 넘어지게 하는 모든 것과 불법을 행하는 사람들을 모아", "42": "불타는 용광로에 던질 것입니다. 거기서 울며 이를 갈게 될 것입니다.", "43": "그때 의인들은 자기 아버지의 왕국에서 해처럼 빛날 것입니다. 들을 귀가 있는 사람은 들으십시오.", "44": "하늘들의 왕국은 밭에 감추어진 보물과 같습니다. 어떤 사람이 그것을 발견하고 다시 감추어 두며, 기뻐서 가서 자기에게 있는 모든 것을 팔아 그 밭을 삽니다.", "45": "또 하늘들의 왕국은 좋은 진주들을 찾는 상인과 같습니다.", "46": "그가 매우 값진 진주 하나를 발견하고 가서 자기에게 있는 모든 것을 팔아 그것을 샀습니다.", "47": "또 하늘들의 왕국은 바다에 던져져 온갖 종류를 모으는 그물과 같습니다.", "48": "그물이 가득 차자 사람들이 해변으로 끌어올려 앉아서 좋은 것들은 그릇에 모으고 나쁜 것들은 밖에 버렸습니다.", "49": "시대의 완성에도 그렇게 될 것입니다. 천사들이 나가 의인들 가운데서 악한 사람들을 갈라내어", "50": "불타는 용광로에 던질 것입니다. 거기서 울며 이를 갈게 될 것입니다.", "51": "“여러분은 이 모든 것을 깨달았습니까?” 그들이 예수님께 말했습니다. “그렇습니다.”", "52": "예수님께서 그들에게 말씀하셨습니다. “그러므로 하늘들의 왕국을 위해 제자가 된 모든 율법학자는 자기 보물창고에서 새것과 옛것을 꺼내는 집주인과 같습니다.”", "53": "예수님께서 이 비유들을 마치신 뒤 그곳을 떠나셨습니다.", "54": "고향에 가셔서 그들의 회당에서 가르치시자 사람들이 놀라 말했습니다. “이 사람에게 이런 지혜와 능력 있는 일들이 어디서 생겼는가?", "55": "이 사람은 목수의 아들이 아닌가? 그의 어머니는 마리아라고 불리고 그의 형제들은 야고보와 요셉과 시몬과 유다가 아닌가?", "56": "그의 누이들도 모두 우리와 함께 있지 않은가? 그러면 이 사람에게 이 모든 것이 어디서 생겼는가?”", "57": "그들은 그분 때문에 걸려 넘어졌습니다. 그러나 예수님께서 그들에게 말씀하셨습니다. “예언자가 존중받지 못하는 곳은 자기 고향과 자기 집뿐입니다.”", "58": "그리고 그들의 믿음 없음 때문에 거기서는 능력 있는 일을 많이 행하지 않으셨습니다."},
14:{"1": "그때 분봉왕 헤롯이 예수님에 관한 소문을 듣고", "2": "자기 신하들에게 말했습니다. “이 사람은 세례자 요한이다. 그가 죽은 사람들 가운데서 살아났기 때문에 이런 능력들이 그에게서 작용하는 것이다.”", "3": "헤롯은 자기 형제 빌립의 아내 헤로디아 때문에 요한을 붙잡아 묶어 감옥에 가두었습니다.", "4": "요한이 그에게 “그 여자를 차지하는 것은 당신에게 허용되지 않습니다”라고 말했기 때문입니다.", "5": "헤롯은 요한을 죽이고 싶었지만 무리를 두려워했습니다. 사람들이 요한을 예언자로 여겼기 때문입니다.", "6": "그런데 헤롯의 생일이 되었을 때 헤로디아의 딸이 사람들 앞에서 춤을 추어 헤롯을 기쁘게 했습니다.", "7": "그래서 헤롯은 맹세로 그녀가 무엇을 요구하든 주겠다고 약속했습니다.", "8": "그녀는 자기 어머니의 부추김을 받아 말했습니다. “세례자 요한의 머리를 여기 쟁반에 담아 저에게 주십시오.”", "9": "왕은 근심했지만 자기가 한 맹세와 함께 식탁에 앉은 사람들 때문에 그것을 주라고 명령했습니다.", "10": "그리고 사람을 보내 감옥에서 요한의 목을 베게 했습니다.", "11": "그의 머리가 쟁반에 담겨 소녀에게 주어졌고, 그녀는 그것을 자기 어머니에게 가져갔습니다.", "12": "요한의 제자들이 와서 시신을 가져다가 장사하고, 가서 예수님께 알렸습니다.", "13": "예수님께서 이 말을 들으시고 배를 타고 그곳을 떠나 따로 외딴곳으로 가셨습니다. 무리가 이 소식을 듣고 성읍들에서 걸어서 그분을 따라갔습니다.", "14": "예수님께서 나오셔서 큰 무리를 보시고 그들을 불쌍히 여기시며 그들의 병든 사람들을 고쳐 주셨습니다.", "15": "저녁이 되자 제자들이 그분께 와서 말했습니다. “이곳은 외딴곳이고 시간도 이미 늦었습니다. 무리를 보내 마을들로 가서 자기들이 먹을 것을 사게 하십시오.”", "16": "그러나 예수님께서 그들에게 말씀하셨습니다. “그들이 갈 필요가 없습니다. 여러분이 그들에게 먹을 것을 주십시오.”", "17": "그들이 예수님께 말했습니다. “여기 우리에게는 빵 다섯 개와 물고기 두 마리밖에 없습니다.”", "18": "예수님께서 말씀하셨습니다. “그것들을 여기 내게 가져오십시오.”", "19": "그리고 무리에게 풀 위에 앉으라고 명령하신 뒤 빵 다섯 개와 물고기 두 마리를 가지시고 하늘을 우러러보시며 축복하셨습니다. 그리고 빵을 떼어 제자들에게 주셨고 제자들은 무리에게 주었습니다.", "20": "모두가 먹고 배불렀습니다. 그리고 남은 조각들을 모으니 열두 바구니에 가득 찼습니다.", "21": "먹은 사람들은 여자들과 어린아이들을 제외하고 남자만 약 오천 명이었습니다.", "22": "곧 예수님께서 제자들을 재촉하여 배에 타고 자신보다 먼저 건너편으로 가게 하시는 동안 자신은 무리를 돌려보내셨습니다.", "23": "무리를 돌려보내신 뒤 기도하시려고 따로 산에 올라가셨습니다. 저녁이 되었을 때 그분은 거기에 홀로 계셨습니다.", "24": "배는 이미 육지에서 여러 스타디온 떨어져 있었고, 바람이 맞서 불었기 때문에 파도에 시달리고 있었습니다.", "25": "밤의 네 번째 경에 예수님께서 바다 위를 걸어 그들에게 오셨습니다.", "26": "제자들은 그분께서 바다 위를 걸으시는 것을 보고 놀라 “유령이다!”라고 말하며 두려워 소리쳤습니다.", "27": "그러나 예수님께서 즉시 그들에게 말씀하셨습니다. “용기를 내십시오. 나입니다. 두려워하지 마십시오.”", "28": "베드로가 그분께 대답했습니다. “주님, 주님이시라면 저에게 물 위로 주님께 오라고 명령해 주십시오.”", "29": "예수님께서 “오십시오”라고 말씀하셨습니다. 베드로가 배에서 내려 물 위를 걸어 예수님께 갔습니다.", "30": "그러나 강한 바람을 보고 두려워했고, 물에 빠져들기 시작하자 “주님, 저를 구해 주십시오!”라고 외쳤습니다.", "31": "예수님께서 즉시 손을 내밀어 그를 붙잡으시며 말씀하셨습니다. “믿음이 적은 사람이여, 왜 의심했습니까?”", "32": "그들이 배에 오르자 바람이 그쳤습니다.", "33": "배 안에 있던 사람들이 그분께 절하며 말했습니다. “참으로 주님은 하나님의 아들이십니다.”", "34": "그들이 건너가 게네사렛 땅에 도착했습니다.", "35": "그곳 사람들이 예수님을 알아보고 그 온 주변 지역에 사람을 보내 모든 병든 사람을 그분께 데려왔습니다.", "36": "그리고 그분의 겉옷 술에라도 손을 대게 해 달라고 간청했습니다. 손을 댄 사람들은 모두 온전히 나았습니다."},
15:{"1": "그때 예루살렘에서 바리새인들과 율법학자들이 예수님께 와서 말했습니다.", "2": "“왜 선생님의 제자들은 장로들의 전통을 어깁니까? 그들은 빵을 먹을 때 손을 씻지 않습니다.”", "3": "예수님께서 그들에게 대답하셨습니다. “그러면 여러분은 왜 여러분의 전통 때문에 하나님의 계명을 어깁니까?", "4": "하나님께서 말씀하셨습니다. ‘아버지와 어머니를 공경하여라.’ 또 ‘아버지나 어머니를 악하게 말하는 사람은 반드시 죽임을 당해야 한다.’", "5": "그러나 여러분은 말합니다. ‘누구든지 아버지나 어머니에게 “제가 부모님께 드릴 수 있었던 것은 하나님께 드리는 예물입니다”라고 말하면,", "6": "그는 자기 아버지를 공경하지 않아도 된다.’ 이렇게 여러분은 여러분의 전통 때문에 하나님의 말씀을 무효로 만들었습니다.", "7": "위선자들이여! 이사야가 여러분에 관하여 잘 예언했습니다.", "8": "‘이 백성이 입술로는 나를 공경하지만 그들의 마음은 내게서 멀리 떨어져 있다.", "9": "그들은 사람의 명령들을 가르침으로 가르치면서 헛되이 나를 경배한다.’”", "10": "그리고 무리를 불러 말씀하셨습니다. “듣고 깨달으십시오.", "11": "입으로 들어가는 것이 사람을 더럽히는 것이 아니라 입에서 나오는 것이 사람을 더럽힙니다.”", "12": "그때 제자들이 다가와 예수님께 말했습니다. “바리새인들이 이 말씀을 듣고 걸려 넘어진 것을 아십니까?”", "13": "예수님께서 대답하셨습니다. “하늘에 계신 내 아버지께서 심지 않으신 모든 식물은 뿌리째 뽑힐 것입니다.", "14": "그들을 내버려 두십시오. 그들은 눈먼 사람들을 인도하는 눈먼 안내자들입니다. 눈먼 사람이 눈먼 사람을 인도하면 둘 다 구덩이에 빠질 것입니다.”", "15": "베드로가 예수님께 말했습니다. “이 비유를 우리에게 설명해 주십시오.”", "16": "예수님께서 말씀하셨습니다. “여러분도 아직 깨닫지 못합니까?", "17": "입으로 들어가는 것은 무엇이든 배로 들어갔다가 뒤로 배출된다는 것을 알지 못합니까?", "18": "그러나 입에서 나오는 것들은 마음에서 나오며, 그것들이 사람을 더럽힙니다.", "19": "마음에서 악한 생각들, 살인, 간음, 음행, 도둑질, 거짓 증언, 신성모독이 나오기 때문입니다.", "20": "이것들이 사람을 더럽히는 것들입니다. 그러나 씻지 않은 손으로 먹는 것은 사람을 더럽히지 않습니다.”", "21": "예수님께서 거기서 떠나 두로와 시돈 지방으로 물러가셨습니다.", "22": "그런데 보십시오, 그 지역에서 나온 한 가나안 여자가 외쳤습니다. “주님, 다윗의 아들이시여, 저에게 긍휼을 베풀어 주십시오! 제 딸이 귀신에게 심하게 괴롭힘을 받고 있습니다.”", "23": "그러나 예수님께서는 그녀에게 한마디도 대답하지 않으셨습니다. 제자들이 와서 “그 여자를 돌려보내십시오. 우리 뒤에서 계속 외치고 있습니다”라고 간청했습니다.", "24": "예수님께서 대답하셨습니다. “나는 이스라엘 집의 잃어버린 양들에게만 보내어졌습니다.”", "25": "그러나 그 여자가 와서 그분께 절하며 말했습니다. “주님, 저를 도와주십시오.”", "26": "예수님께서 대답하셨습니다. “자녀들의 빵을 가져다가 작은 개들에게 던져 주는 것은 좋지 않습니다.”", "27": "그 여자가 말했습니다. “그렇습니다, 주님. 그러나 작은 개들도 자기 주인의 상에서 떨어지는 부스러기를 먹습니다.”", "28": "그때 예수님께서 그녀에게 대답하셨습니다. “여자여, 당신의 믿음이 큽니다. 당신이 원하는 대로 이루어지기를 바랍니다.” 바로 그때 그녀의 딸이 나았습니다.", "29": "예수님께서 거기서 떠나 갈릴리 바닷가에 이르셨고, 산에 올라가 거기에 앉으셨습니다.", "30": "많은 무리가 다리 저는 사람들, 눈먼 사람들, 불구자들, 말 못 하는 사람들, 그리고 다른 많은 사람을 데리고 그분께 와서 그들을 그분의 발 앞에 내려놓았습니다. 그분께서 그들을 고쳐 주셨습니다.", "31": "그리하여 무리는 말 못 하는 사람들이 말하고, 불구자들이 온전해지고, 다리 저는 사람들이 걷고, 눈먼 사람들이 보는 것을 보고 놀라며 이스라엘의 하나님께 영광을 돌렸습니다.", "32": "예수님께서 제자들을 불러 말씀하셨습니다. “내가 이 무리를 불쌍히 여깁니다. 그들이 벌써 사흘 동안 나와 함께 머물렀고 먹을 것이 없기 때문입니다. 길에서 기진할까 염려되어 굶긴 채 돌려보내고 싶지 않습니다.”", "33": "제자들이 그분께 말했습니다. “이 외딴곳에서 이처럼 많은 무리를 배불리 먹일 만큼 많은 빵을 우리가 어디서 구하겠습니까?”", "34": "예수님께서 그들에게 말씀하셨습니다. “여러분에게 빵이 몇 개 있습니까?” 그들이 말했습니다. “일곱 개와 작은 물고기 몇 마리가 있습니다.”", "35": "예수님께서 무리에게 땅에 앉으라고 명령하시고,", "36": "빵 일곱 개와 물고기들을 가지시고 감사를 드리신 뒤 떼어 제자들에게 주셨고, 제자들은 무리에게 주었습니다.", "37": "모두가 먹고 배불렀습니다. 남은 조각들을 모으니 일곱 광주리에 가득 찼습니다.", "38": "먹은 사람들은 여자들과 어린아이들을 제외하고 남자만 사천 명이었습니다.", "39": "예수님께서 무리를 돌려보내신 뒤 배에 오르셔서 마가단 지방으로 가셨습니다."},
16:{"1": "바리새인들과 사두개인들이 다가와 예수님을 시험하며 하늘에서 오는 표적을 보여 달라고 요청했습니다.", "2": "예수님께서 그들에게 대답하셨습니다. “저녁이 되면 여러분은 ‘하늘이 붉으니 날씨가 맑겠다’라고 말하고,", "3": "아침에는 ‘오늘은 폭풍이 있겠다. 하늘이 붉고 흐리기 때문이다’라고 말합니다. 여러분은 하늘의 모습은 분별할 줄 알면서 시대의 표적들은 분별하지 못합니까?", "4": "악하고 간음하는 세대가 표적을 찾지만 요나의 표적 외에는 어떤 표적도 주어지지 않을 것입니다.” 그리고 그들을 떠나 가셨습니다.", "5": "제자들이 건너편으로 갔는데 빵 가져오는 것을 잊었습니다.", "6": "예수님께서 그들에게 말씀하셨습니다. “주의하십시오. 바리새인들과 사두개인들의 누룩을 조심하십시오.”", "7": "그들은 서로 의논하며 “우리가 빵을 가져오지 않았기 때문이다”라고 말했습니다.", "8": "예수님께서 아시고 말씀하셨습니다. “믿음이 적은 사람들이여, 왜 빵이 없다는 것을 서로 의논합니까?", "9": "아직도 깨닫지 못합니까? 빵 다섯 개로 오천 명을 먹이고 몇 바구니를 거두었는지 기억하지 못합니까?", "10": "또 빵 일곱 개로 사천 명을 먹이고 몇 광주리를 거두었는지 기억하지 못합니까?", "11": "내가 빵에 관하여 말한 것이 아니라는 것을 왜 깨닫지 못합니까? 바리새인들과 사두개인들의 누룩을 조심하십시오.”", "12": "그제야 제자들은 예수님께서 빵의 누룩을 조심하라고 하신 것이 아니라 바리새인들과 사두개인들의 가르침을 조심하라고 하신 것임을 깨달았습니다.", "13": "예수님께서 가이사랴 빌립보 지역에 이르러 제자들에게 물으셨습니다. “사람들이 사람의 아들을 누구라고 합니까?”", "14": "그들이 말했습니다. “어떤 사람들은 세례자 요한이라고 하고, 다른 사람들은 엘리야라고 하며, 또 다른 사람들은 예레미야나 예언자들 가운데 한 사람이라고 합니다.”", "15": "예수님께서 그들에게 말씀하셨습니다. “그러면 여러분은 나를 누구라고 합니까?”", "16": "시몬 베드로가 대답했습니다. “주님은 그리스도이시며 살아 계신 하나님의 아들이십니다.”", "17": "예수님께서 그에게 대답하셨습니다. “시몬 바요나여, 당신은 복이 있습니다. 이것을 당신에게 드러낸 것은 살과 피가 아니라 하늘에 계신 내 아버지이기 때문입니다.", "18": "또 내가 당신에게 말합니다. 당신은 베드로입니다. 내가 이 반석 위에 나의 교회를 세울 것이며, 하데스의 문들이 그것을 이기지 못할 것입니다.", "19": "내가 당신에게 하늘들의 왕국의 열쇠들을 주겠습니다. 당신이 땅에서 무엇이든 묶으면 하늘들에서 묶인 것이 될 것이고, 땅에서 무엇이든 풀면 하늘들에서 풀린 것이 될 것입니다.”", "20": "그때 예수님께서는 자신이 그리스도라는 것을 아무에게도 말하지 말라고 제자들에게 엄히 명하셨습니다.", "21": "그때부터 예수님께서는 자신이 반드시 예루살렘에 가서 장로들과 대제사장들과 율법학자들에게 많은 고난을 받고 죽임을 당하며 셋째 날에 일으켜져야 한다는 것을 제자들에게 보여 주기 시작하셨습니다.", "22": "베드로가 그분을 따로 붙잡고 꾸짖기 시작하며 말했습니다. “주님, 결코 그런 일이 주님께 일어나서는 안 됩니다!”", "23": "그러나 예수님께서 돌아서서 베드로에게 말씀하셨습니다. “사탄아, 내 뒤로 물러가라! 너는 나에게 걸려 넘어지게 하는 것이다. 네가 하나님의 일들을 생각하지 않고 사람의 일들을 생각하기 때문이다.”", "24": "그때 예수님께서 제자들에게 말씀하셨습니다. “누구든지 나를 따라오려면 자기를 부인하고 자기 십자가를 지고 나를 따라야 합니다.", "25": "누구든지 자기 생명을 구하고자 하면 그것을 잃을 것이지만, 누구든지 나 때문에 자기 생명을 잃으면 그것을 얻을 것입니다.", "26": "사람이 온 세상을 얻고도 자기 생명을 잃으면 무슨 유익이 있겠습니까? 또는 사람이 자기 생명을 대신하여 무엇을 내놓겠습니까?", "27": "사람의 아들이 자기 아버지의 영광 가운데 자기 천사들과 함께 올 것이며, 그때 각 사람에게 그의 행위에 따라 갚아 줄 것입니다.", "28": "내가 진실로 여러분에게 말합니다. 여기 서 있는 사람들 가운데 몇 사람은 사람의 아들이 자기 왕국 안에서 오는 것을 볼 때까지 결코 죽음을 맛보지 않을 것입니다."},"17":{"1":"엿새 뒤에 예수님께서 베드로와 야고보와 그의 형제 요한을 데리고 따로 높은 산으로 올라가셨습니다.","2":"그리고 그들 앞에서 모습이 변하셨습니다. 그분의 얼굴은 해처럼 빛났고 그분의 옷은 빛처럼 희어졌습니다.","3":"그런데 보십시오, 모세와 엘리야가 그들에게 나타나 예수님과 이야기하고 있었습니다.","4":"베드로가 예수님께 말했습니다. “주님, 우리가 여기 있는 것이 좋습니다. 주님께서 원하시면 제가 여기에 초막 셋을 짓겠습니다. 하나는 주님을 위해, 하나는 모세를 위해, 하나는 엘리야를 위해 짓겠습니다.”","5":"그가 아직 말하고 있을 때, 보십시오, 빛나는 구름이 그들을 덮었습니다. 그리고 구름에서 음성이 들렸습니다. “이는 내가 사랑하는 아들, 내가 기뻐하는 이다. 그의 말을 들어라.”","6":"제자들은 이 말을 듣고 얼굴을 땅에 대고 엎드려 몹시 두려워했습니다.","7":"예수님께서 다가와 그들에게 손을 대시며 말씀하셨습니다. “일어나십시오. 두려워하지 마십시오.”","8":"그들이 눈을 들어 보니 예수님 외에는 아무도 보이지 않았습니다.","9":"그들이 산에서 내려올 때 예수님께서 명령하셨습니다. “사람의 아들이 죽은 사람들 가운데서 일으켜질 때까지 이 환상을 아무에게도 말하지 마십시오.”","10":"제자들이 그분께 물었습니다. “그러면 왜 율법학자들은 엘리야가 먼저 와야 한다고 말합니까?”","11":"예수님께서 대답하셨습니다. “엘리야가 와서 모든 것을 회복할 것입니다.","12":"그러나 내가 여러분에게 말합니다. 엘리야가 이미 왔지만 사람들이 그를 알아보지 못하고 자기들이 원하는 대로 그에게 행했습니다. 이와 같이 사람의 아들도 그들에게 고난을 받을 것입니다.”","13":"그때 제자들은 예수님께서 세례자 요한에 관하여 말씀하신 것을 깨달았습니다.","14":"그들이 무리에게 왔을 때 한 사람이 예수님께 다가와 그분 앞에 무릎을 꿇고 말했습니다.","15":"“주님, 제 아들을 불쌍히 여겨 주십시오. 그가 발작으로 심하게 고통받고 있습니다. 자주 불 속에도 넘어지고 물속에도 넘어집니다.","16":"제가 그를 주님의 제자들에게 데려왔지만 그들은 고치지 못했습니다.”","17":"예수님께서 대답하셨습니다. “믿음이 없고 비뚤어진 세대여! 내가 언제까지 여러분과 함께 있어야 합니까? 언제까지 여러분을 참아야 합니까? 그를 여기 내게 데려오십시오.”","18":"예수님께서 귀신을 꾸짖으시자 귀신이 그에게서 나갔고, 그 아이는 바로 그때 나았습니다.","19":"그때 제자들이 따로 예수님께 와서 말했습니다. “왜 우리는 그것을 쫓아내지 못했습니까?”","20":"예수님께서 말씀하셨습니다. “여러분의 믿음이 적기 때문입니다. 내가 진실로 여러분에게 말합니다. 여러분에게 겨자씨 한 알만 한 믿음이 있어도 이 산에게 ‘여기서 저기로 옮겨 가라’고 말하면 옮겨 갈 것이며, 여러분에게 불가능한 일이 없을 것입니다.”","21":"[일부 후대 사본에는 다음 절이 있습니다: “그러나 이런 종류는 기도와 금식이 아니면 나가지 않는다.”]","22":"그들이 갈릴리에 함께 모여 있을 때 예수님께서 말씀하셨습니다. “사람의 아들이 사람들의 손에 넘겨질 것이며,","23":"그들이 그를 죽일 것입니다. 그러나 셋째 날에 그는 일으켜질 것입니다.” 제자들은 몹시 슬퍼했습니다.","24":"그들이 가버나움에 이르렀을 때 두 드라크마 성전세를 거두는 사람들이 베드로에게 와서 말했습니다. “여러분의 선생님은 두 드라크마 세금을 내지 않습니까?”","25":"베드로가 말했습니다. “냅니다.” 그가 집에 들어가자 예수님께서 먼저 말씀하셨습니다. “시몬, 당신은 어떻게 생각합니까? 세상의 왕들은 누구에게서 관세나 인두세를 받습니까? 자기 아들들에게서입니까, 아니면 다른 사람들에게서입니까?”","26":"베드로가 “다른 사람들에게서입니다”라고 하자 예수님께서 말씀하셨습니다. “그렇다면 아들들은 면제됩니다.","27":"그러나 우리가 그들을 걸려 넘어지게 하지 않도록 바다에 가서 낚시를 던지십시오. 처음 올라오는 물고기를 잡아 그 입을 열면 한 스타테르를 발견할 것입니다. 그것을 가져다가 나와 당신을 위해 그들에게 주십시오.”"},"18":{"1":"그때 제자들이 예수님께 와서 말했습니다. “그러면 하늘들의 왕국에서는 누가 가장 큽니까?”","2":"예수님께서 한 어린아이를 불러 그들 가운데 세우시고","3":"말씀하셨습니다. “내가 진실로 여러분에게 말합니다. 여러분이 돌이켜 어린아이들과 같이 되지 않으면 결코 하늘들의 왕국에 들어가지 못할 것입니다.","4":"그러므로 누구든지 이 어린아이처럼 자신을 낮추는 사람이 하늘들의 왕국에서 가장 큰 사람입니다.","5":"또 누구든지 내 이름으로 이런 어린아이 하나를 받아들이는 사람은 나를 받아들이는 것입니다.","6":"그러나 나를 믿는 이 작은 사람들 가운데 하나를 걸려 넘어지게 하는 사람은 큰 맷돌이 그의 목에 달려 깊은 바다에 빠지는 것이 그에게 더 낫습니다.","7":"걸려 넘어지게 하는 것들 때문에 세상에 화가 있습니다! 걸려 넘어지게 하는 것들이 오는 것은 피할 수 없지만, 그것을 통하여 걸려 넘어지게 하는 일이 오는 그 사람에게는 화가 있습니다!","8":"만일 당신의 손이나 발이 당신을 걸려 넘어지게 한다면 그것을 잘라 내어 던져 버리십시오. 두 손이나 두 발을 가지고 영원한 불에 던져지는 것보다 불구자나 다리 저는 사람으로 생명에 들어가는 것이 더 낫습니다.","9":"또 만일 당신의 눈이 당신을 걸려 넘어지게 한다면 그것을 빼내어 던져 버리십시오. 두 눈을 가지고 불의 게헨나에 던져지는 것보다 한 눈으로 생명에 들어가는 것이 더 낫습니다.","10":"이 작은 사람들 가운데 하나라도 업신여기지 않도록 주의하십시오. 하늘에서 그들의 천사들이 하늘에 계신 내 아버지의 얼굴을 항상 보고 있기 때문입니다.","11":"[일부 후대 사본에는 다음 절이 있습니다: “사람의 아들은 잃어버린 것을 구원하러 왔다.”]","12":"여러분은 어떻게 생각합니까? 어떤 사람에게 양 백 마리가 있는데 그 가운데 한 마리가 길을 잃으면, 아흔아홉 마리를 산에 두고 가서 길 잃은 한 마리를 찾지 않겠습니까?","13":"그리고 그 양을 찾게 되면, 내가 진실로 여러분에게 말합니다. 길을 잃지 않은 아흔아홉 마리보다 그 한 마리 때문에 더 기뻐합니다.","14":"이와 같이 이 작은 사람들 가운데 하나라도 멸망하는 것은 하늘에 계신 여러분의 아버지의 뜻이 아닙니다.","15":"당신의 형제가 당신에게 죄를 지으면 가서 당신과 그 사람만 있을 때 그의 잘못을 지적하십시오. 그가 당신의 말을 들으면 당신은 당신의 형제를 얻은 것입니다.","16":"그러나 그가 듣지 않으면 한두 사람을 더 데리고 가십시오. 두세 증인의 입으로 모든 말이 확정되게 하려는 것입니다.","17":"그가 그들의 말도 듣지 않으면 교회에 말하십시오. 교회의 말도 듣지 않으면 그를 이방인과 세리처럼 여기십시오.","18":"내가 진실로 여러분에게 말합니다. 여러분이 땅에서 무엇이든 묶으면 하늘에서 묶인 것이 될 것이고, 땅에서 무엇이든 풀면 하늘에서 풀린 것이 될 것입니다.","19":"다시 내가 여러분에게 말합니다. 여러분 가운데 두 사람이 땅에서 어떤 일이든 마음을 같이하여 구하면 하늘에 계신 내 아버지께서 그들을 위해 이루어 주실 것입니다.","20":"두세 사람이 내 이름 안으로 모여 있는 곳에는 나도 그들 가운데 있기 때문입니다.”","21":"그때 베드로가 다가와 예수님께 말했습니다. “주님, 제 형제가 저에게 죄를 지으면 몇 번이나 용서해 주어야 합니까? 일곱 번까지입니까?”","22":"예수님께서 말씀하셨습니다. “내가 당신에게 일곱 번까지라고 말하지 않고 일흔일곱 번까지 [또는: 일흔 번씩 일곱 번까지]라고 말합니다.","23":"그러므로 하늘들의 왕국은 자기 종들과 결산하려는 한 왕과 같습니다.","24":"그가 결산하기 시작하자 만 달란트를 빚진 한 사람이 그에게 끌려왔습니다.","25":"그가 갚을 수 없으므로 주인은 그와 그의 아내와 자녀들과 그가 가진 모든 것을 팔아 갚으라고 명령했습니다.","26":"그러자 그 종이 엎드려 그에게 절하며 말했습니다. ‘저에게 참아 주십시오. 제가 모두 갚겠습니다.’","27":"그 종의 주인은 불쌍히 여겨 그를 놓아주고 그 빚을 탕감해 주었습니다.","28":"그러나 그 종이 나가다가 자기에게 백 데나리온을 빚진 동료 종 하나를 만나 붙잡고 목을 조르며 말했습니다. ‘네가 빚진 것을 갚아라.’","29":"그러자 그의 동료 종이 엎드려 그에게 간청했습니다. ‘나에게 참아 주게. 내가 갚겠네.’","30":"그러나 그는 원하지 않고 가서 빚을 갚을 때까지 그를 감옥에 가두었습니다.","31":"그의 동료 종들은 일어난 일을 보고 몹시 슬퍼하여 주인에게 가서 일어난 일을 모두 알렸습니다.","32":"그때 주인이 그를 불러 말했습니다. ‘악한 종아! 네가 나에게 간청했기 때문에 내가 네 빚을 모두 탕감해 주었다.","33":"내가 너를 불쌍히 여긴 것처럼 너도 네 동료 종을 불쌍히 여겼어야 하지 않겠느냐?’","34":"주인은 화가 나서 그가 빚진 것을 모두 갚을 때까지 그를 형벌 집행자들에게 넘겼습니다.","35":"여러분이 각각 마음으로부터 자기 형제를 용서하지 않으면 하늘에 계신 내 아버지께서도 여러분에게 이와 같이 하실 것입니다.”"},"19":{"1":"예수님께서 이 말씀들을 마치신 뒤 갈릴리에서 떠나 요단강 건너편 유대 지방으로 가셨습니다.","2":"많은 무리가 그분을 따랐고, 그분께서는 거기서 그들을 고쳐 주셨습니다.","3":"바리새인들이 예수님께 다가와 시험하며 말했습니다. “사람이 어떤 이유로든 자기 아내와 이혼하는 것이 허용됩니까?”","4":"예수님께서 대답하셨습니다. “창조하신 분께서 처음부터 그들을 남자와 여자로 만드셨다는 것을 읽어보지 못했습니까?","5":"그리고 말씀하셨습니다. ‘그러므로 남자는 아버지와 어머니를 떠나 자기 아내와 결합할 것이며, 둘이 한 육체가 될 것이다.’","6":"그러므로 이제 그들은 둘이 아니라 한 육체입니다. 따라서 하나님께서 함께 짝지어 주신 것을 사람이 갈라놓지 마십시오.”","7":"그들이 예수님께 말했습니다. “그러면 왜 모세는 이혼 증서를 주고 아내를 버리라고 명령했습니까?”","8":"예수님께서 그들에게 말씀하셨습니다. “모세는 여러분의 마음이 완고하기 때문에 아내와 이혼하는 것을 허용했지만 처음부터 그랬던 것은 아닙니다.","9":"내가 여러분에게 말합니다. 음행 [또는: 성적 부정] 때문이 아닌데도 자기 아내와 이혼하고 다른 여자와 결혼하는 사람은 간음하는 것입니다.”","10":"제자들이 예수님께 말했습니다. “아내에 대한 남자의 처지가 이렇다면 결혼하지 않는 것이 더 낫겠습니다.”","11":"예수님께서 그들에게 말씀하셨습니다. “모든 사람이 이 말을 받아들일 수 있는 것은 아니고, 그것이 주어진 사람들만 받아들일 수 있습니다.","12":"태어날 때부터 그렇게 된 고자도 있고, 사람들에 의해 고자가 된 사람도 있으며, 하늘들의 왕국 때문에 스스로 고자처럼 산 사람도 있습니다. 이것을 받아들일 수 있는 사람은 받아들이십시오.”","13":"그때 사람들이 어린아이들을 예수님께 데려와 그들에게 손을 얹고 기도해 주시기를 바랐습니다. 그러나 제자들이 그들을 꾸짖었습니다.","14":"예수님께서 말씀하셨습니다. “어린아이들이 내게 오는 것을 허락하고 막지 마십시오. 하늘들의 왕국은 이런 사람들의 것입니다.”","15":"그리고 그들에게 손을 얹으신 뒤 거기서 떠나셨습니다.","16":"그런데 보십시오, 한 사람이 예수님께 다가와 말했습니다. “선생님, 제가 영원한 생명을 얻으려면 어떤 선한 일을 해야 합니까?”","17":"예수님께서 그에게 말씀하셨습니다. “왜 나에게 선한 것에 관하여 묻습니까? 선한 분은 한 분뿐입니다. 그러나 생명에 들어가고 싶다면 계명들을 지키십시오.”","18":"그가 예수님께 말했습니다. “어떤 계명들입니까?” 예수님께서 말씀하셨습니다. “‘살인하지 마라. 간음하지 마라. 도둑질하지 마라. 거짓 증언하지 마라.","19":"아버지와 어머니를 공경하여라.’ 그리고 ‘네 이웃을 네 자신처럼 사랑하여라.’”","20":"그 젊은이가 예수님께 말했습니다. “이 모든 것을 제가 지켰습니다. 아직 무엇이 부족합니까?”","21":"예수님께서 그에게 말씀하셨습니다. “당신이 온전해지기를 원한다면 가서 당신의 소유를 팔아 가난한 사람들에게 주십시오. 그러면 하늘에서 보물을 갖게 될 것입니다. 그리고 와서 나를 따르십시오.”","22":"그러나 그 젊은이는 이 말씀을 듣고 근심하며 떠나갔습니다. 그에게 많은 재산이 있었기 때문입니다.","23":"예수님께서 제자들에게 말씀하셨습니다. “내가 진실로 여러분에게 말합니다. 부자가 하늘들의 왕국에 들어가기는 어렵습니다.","24":"다시 여러분에게 말합니다. 낙타가 바늘귀를 통과하는 것이 부자가 하나님의 왕국에 들어가는 것보다 쉽습니다.”","25":"제자들은 이 말씀을 듣고 몹시 놀라 말했습니다. “그러면 누가 구원받을 수 있습니까?”","26":"예수님께서 그들을 바라보시며 말씀하셨습니다. “사람에게는 이것이 불가능하지만 하나님께는 모든 것이 가능합니다.”","27":"그때 베드로가 예수님께 대답했습니다. “보십시오, 우리는 모든 것을 버리고 주님을 따랐습니다. 그러면 우리에게 무엇이 있겠습니까?”","28":"예수님께서 그들에게 말씀하셨습니다. “내가 진실로 여러분에게 말합니다. 새롭게 됨의 때에 사람의 아들이 자기 영광의 보좌에 앉을 때, 나를 따른 여러분도 열두 보좌에 앉아 이스라엘의 열두 지파를 심판할 것입니다.","29":"그리고 내 이름 때문에 집이나 형제나 자매나 아버지나 어머니나 자녀나 밭을 버린 사람은 누구든지 백 배를 받을 것이며 영원한 생명을 상속받을 것입니다.","30":"그러나 첫째인 많은 사람이 마지막이 되고, 마지막인 사람이 첫째가 될 것입니다."},"20":{"1":"하늘들의 왕국은 자기 포도원에서 일할 일꾼들을 고용하려고 이른 아침에 나간 집주인과 같기 때문입니다.","2":"그는 일꾼들과 하루 한 데나리온으로 합의하고 그들을 자기 포도원으로 보냈습니다.","3":"또 제삼시쯤 나가 장터에 일 없이 서 있는 다른 사람들을 보고","4":"그들에게 말했습니다. ‘여러분도 포도원으로 가십시오. 내가 정당한 것을 주겠습니다.’ 그래서 그들이 갔습니다.","5":"그는 제육시와 제구시쯤에도 다시 나가 같은 일을 했습니다.","6":"제십일시쯤에도 나가 다른 사람들이 서 있는 것을 보고 말했습니다. ‘왜 여러분은 하루 종일 여기서 일 없이 서 있습니까?’","7":"그들이 말했습니다. ‘아무도 우리를 고용하지 않았기 때문입니다.’ 그가 말했습니다. ‘여러분도 포도원으로 가십시오.’","8":"저녁이 되자 포도원 주인이 자기 관리인에게 말했습니다. ‘일꾼들을 불러 마지막에 온 사람들부터 처음에 온 사람들까지 품삯을 주십시오.’","9":"제십일시쯤 온 사람들이 와서 각각 한 데나리온을 받았습니다.","10":"처음 온 사람들은 자기들이 더 받을 것이라고 생각했지만 그들도 각각 한 데나리온을 받았습니다.","11":"그들은 그것을 받고 집주인에게 불평하며","12":"말했습니다. ‘마지막에 온 이 사람들은 한 시간만 일했는데도, 하루의 짐과 뜨거운 열기를 견딘 우리와 똑같이 대우하셨습니다.’","13":"그러나 그는 그들 가운데 한 사람에게 대답했습니다. ‘친구여, 내가 당신에게 부당하게 하는 것이 아닙니다. 당신은 나와 한 데나리온으로 합의하지 않았습니까?","14":"당신의 것을 받아 가십시오. 나는 마지막에 온 이 사람에게도 당신에게 준 것과 똑같이 주고 싶습니다.","15":"내 것을 가지고 내가 원하는 대로 하는 것이 허용되지 않습니까? 내가 후하기 때문에 당신의 눈이 악합니까?’","16":"이와 같이 마지막인 사람들이 첫째가 되고 첫째인 사람들이 마지막이 될 것입니다.","17":"예수님께서 예루살렘으로 올라가실 때 열두 제자를 따로 데리고 길에서 그들에게 말씀하셨습니다.","18":"“보십시오, 우리가 예루살렘으로 올라가고 있습니다. 사람의 아들이 대제사장들과 율법학자들에게 넘겨질 것이며, 그들이 그에게 사형을 선고할 것입니다.","19":"그리고 그를 이방인들에게 넘겨 조롱하고 채찍질하고 십자가에 못 박게 할 것입니다. 그리고 셋째 날에 그는 일으켜질 것입니다.”","20":"그때 세베대의 아들들의 어머니가 자기 아들들과 함께 예수님께 와서 절하며 그분께 무엇인가를 요청했습니다.","21":"예수님께서 그녀에게 말씀하셨습니다. “무엇을 원합니까?” 그녀가 말했습니다. “제 두 아들이 주님의 왕국에서 하나는 주님의 오른편에, 하나는 왼편에 앉게 해 주십시오.”","22":"예수님께서 대답하셨습니다. “여러분은 무엇을 구하는지 알지 못합니다. 내가 마시려는 잔을 여러분이 마실 수 있습니까?” 그들이 말했습니다. “할 수 있습니다.”","23":"예수님께서 그들에게 말씀하셨습니다. “여러분은 내 잔을 마실 것입니다. 그러나 내 오른편과 왼편에 앉는 것은 내가 주는 것이 아니라, 내 아버지께서 준비하신 사람들에게 주어지는 것입니다.”","24":"열 제자가 이 말을 듣고 두 형제에게 분개했습니다.","25":"그러나 예수님께서 그들을 불러 말씀하셨습니다. “여러분이 알듯이 이방인들의 통치자들은 그들을 지배하고, 높은 사람들은 그들에게 권력을 행사합니다.","26":"여러분 가운데서는 그래서는 안 됩니다. 오히려 여러분 가운데 누구든지 크게 되기를 원하는 사람은 여러분의 섬기는 사람이 되어야 하고,","27":"여러분 가운데 누구든지 첫째가 되기를 원하는 사람은 여러분의 종이 되어야 합니다.","28":"이와 같이 사람의 아들도 섬김을 받으러 온 것이 아니라 섬기러 왔으며, 많은 사람을 대신하여 자기 생명을 대속물로 주려고 왔습니다.”","29":"그들이 여리고에서 나갈 때 많은 무리가 예수님을 따랐습니다.","30":"그런데 보십시오, 길가에 앉아 있던 눈먼 사람 둘이 예수님께서 지나가신다는 말을 듣고 외쳤습니다. “주님, 다윗의 아들이시여, 우리에게 긍휼을 베풀어 주십시오!”","31":"무리는 그들에게 조용히 하라고 꾸짖었지만 그들은 더욱 크게 외쳤습니다. “주님, 다윗의 아들이시여, 우리에게 긍휼을 베풀어 주십시오!”","32":"예수님께서 멈추어 서서 그들을 부르시며 말씀하셨습니다. “내가 여러분에게 무엇을 해 주기를 원합니까?”","33":"그들이 예수님께 말했습니다. “주님, 우리의 눈이 열리기를 원합니다.”","34":"예수님께서 불쌍히 여기셔서 그들의 눈에 손을 대셨습니다. 그들은 즉시 보게 되었고 그분을 따랐습니다."},"21":{"1":"그들이 예루살렘에 가까이 와서 올리브산의 벳바게에 이르렀을 때, 예수님께서 두 제자를 보내시며","2":"말씀하셨습니다. “맞은편 마을로 가십시오. 그러면 곧 매여 있는 나귀 한 마리와 그 곁에 있는 새끼를 발견할 것입니다. 그것들을 풀어 내게로 데려오십시오.","3":"누가 여러분에게 무슨 말을 하거든 ‘주님께서 그것들이 필요하십니다’라고 말하십시오. 그러면 그가 곧 보내 줄 것입니다.”","4":"이 일은 예언자를 통하여 말씀하신 것이 이루어지게 하려는 것이었습니다.","5":"“시온의 딸에게 말하여라. ‘보라, 네 왕이 네게 오신다. 그는 온유하시며 나귀, 곧 짐승의 새끼인 어린 나귀를 타셨다.’”","6":"제자들은 가서 예수님께서 명령하신 대로 했습니다.","7":"그들은 나귀와 새끼를 데려와 그 위에 자기들의 겉옷을 얹었고, 예수님께서 그 위에 앉으셨습니다.","8":"무리의 매우 많은 사람들은 자기들의 겉옷을 길에 펼쳤고, 다른 사람들은 나무에서 가지들을 잘라 길에 펼쳤습니다.","9":"앞서 가던 무리와 뒤따르던 무리가 외쳤습니다. “다윗의 아들에게 호산나! 주님의 이름으로 오시는 분은 복이 있습니다! 가장 높은 곳에서 호산나!”","10":"예수님께서 예루살렘에 들어가시자 온 성이 술렁이며 “이분이 누구인가?” 하고 물었습니다.","11":"무리가 말했습니다. “이분은 갈릴리 나사렛에서 오신 예언자 예수님입니다.”","12":"예수님께서 성전에 들어가 성전 안에서 사고파는 모든 사람을 내쫓으시고, 돈 바꾸는 사람들의 상과 비둘기 파는 사람들의 의자를 뒤엎으셨습니다.","13":"그리고 그들에게 말씀하셨습니다. “기록되어 있습니다. ‘내 집은 기도의 집이라 불릴 것이다.’ 그런데 여러분은 그것을 강도들의 소굴로 만들고 있습니다.”","14":"성전 안에서 눈먼 사람들과 다리 저는 사람들이 그분께 왔고, 그분께서 그들을 고쳐 주셨습니다.","15":"그러나 대제사장들과 율법학자들은 그분께서 행하신 놀라운 일들과 성전에서 “다윗의 아들에게 호산나!”라고 외치는 아이들을 보고 분개했습니다.","16":"그들이 예수님께 말했습니다. “이 사람들이 하는 말을 듣고 있습니까?” 예수님께서 그들에게 말씀하셨습니다. “그렇습니다. 여러분은 ‘어린아이들과 젖먹이들의 입에서 찬양을 온전하게 하셨습니다’라는 말씀을 읽어본 적이 없습니까?”","17":"예수님께서 그들을 떠나 성 밖 베다니로 가셔서 거기서 밤을 보내셨습니다.","18":"이른 아침 성으로 돌아오실 때 예수님께서 시장하셨습니다.","19":"길가에 있는 한 무화과나무를 보시고 그리로 가셨지만 잎사귀 외에는 아무것도 발견하지 못하셨습니다. 그분께서 나무에게 말씀하셨습니다. “다시는 네게서 열매가 나지 않을 것이다.” 그러자 무화과나무가 곧 말라 버렸습니다.","20":"제자들이 이것을 보고 놀라 말했습니다. “무화과나무가 어떻게 이렇게 곧 말라 버렸습니까?”","21":"예수님께서 그들에게 대답하셨습니다. “내가 진실로 여러분에게 말합니다. 여러분에게 믿음이 있고 의심하지 않는다면 이 무화과나무에 일어난 일만 할 뿐 아니라, 이 산에게 ‘들려서 바다에 던져져라’라고 말해도 그렇게 될 것입니다.","22":"그리고 여러분이 기도하며 믿음으로 구하는 것은 무엇이든 받을 것입니다.”","23":"예수님께서 성전에 들어가 가르치고 계실 때 대제사장들과 백성의 장로들이 그분께 와서 말했습니다. “당신은 무슨 권위로 이런 일을 합니까? 누가 당신에게 이 권위를 주었습니까?”","24":"예수님께서 그들에게 대답하셨습니다. “나도 여러분에게 한 가지를 묻겠습니다. 여러분이 그것에 대답하면 나도 무슨 권위로 이런 일을 하는지 말하겠습니다.","25":"요한의 침례는 어디에서 왔습니까? 하늘에서입니까, 사람들에게서입니까?” 그들은 서로 의논하며 말했습니다. “우리가 ‘하늘에서’라고 하면 그가 ‘그러면 왜 그를 믿지 않았느냐?’라고 할 것이고,","26":"‘사람들에게서’라고 하면 무리가 두렵다. 모두가 요한을 예언자로 여기기 때문이다.”","27":"그래서 그들이 예수님께 “우리는 모르겠습니다”라고 대답했습니다. 예수님께서도 그들에게 말씀하셨습니다. “나도 무슨 권위로 이런 일을 하는지 여러분에게 말하지 않겠습니다.","28":"“여러분은 어떻게 생각합니까? 어떤 사람에게 두 아들이 있었습니다. 그가 첫째에게 가서 ‘얘야, 오늘 포도원에 가서 일하여라’라고 말했습니다.","29":"그 아들이 ‘싫습니다’라고 대답했지만 나중에 마음을 바꾸어 갔습니다.","30":"아버지가 둘째에게 가서 같은 말을 하자 그는 ‘예, 가겠습니다’라고 대답했지만 가지 않았습니다.","31":"둘 가운데 누가 아버지의 뜻을 행했습니까?” 그들이 “첫째입니다”라고 말했습니다. 예수님께서 그들에게 말씀하셨습니다. “내가 진실로 여러분에게 말합니다. 세리들과 창녀들이 여러분보다 먼저 하나님의 왕국에 들어가고 있습니다.","32":"요한이 의의 길로 여러분에게 왔지만 여러분은 그를 믿지 않았습니다. 그러나 세리들과 창녀들은 그를 믿었습니다. 여러분은 이것을 보고도 나중에 마음을 바꾸어 그를 믿지 않았습니다.","33":"또 다른 비유를 들으십시오. 어떤 집주인이 포도원을 만들고 그 둘레에 울타리를 치고 그 안에 포도즙 틀을 파고 망대를 세웠습니다. 그리고 농부들에게 세를 주고 먼 곳으로 떠났습니다.","34":"열매 거둘 때가 가까워지자 그는 자기 열매를 받으려고 종들을 농부들에게 보냈습니다.","35":"그러나 농부들은 그의 종들을 붙잡아 하나는 때리고, 하나는 죽이고, 하나는 돌로 쳤습니다.","36":"그가 다시 처음보다 더 많은 종들을 보냈지만 그들에게도 똑같이 했습니다.","37":"마지막으로 그는 자기 아들을 보내며 ‘그들이 내 아들은 존중할 것이다’라고 말했습니다.","38":"그러나 농부들은 그 아들을 보고 서로 말했습니다. ‘이 사람은 상속자다. 자, 그를 죽이고 그의 유산을 차지하자.’","39":"그들은 그를 붙잡아 포도원 밖으로 내던지고 죽였습니다.","40":"그러므로 포도원 주인이 오면 그 농부들을 어떻게 하겠습니까?”","41":"그들이 예수님께 말했습니다. “그 악한 자들을 비참하게 멸하고, 제때에 열매를 바칠 다른 농부들에게 포도원을 세놓을 것입니다.”","42":"예수님께서 그들에게 말씀하셨습니다. “여러분은 성경에서 읽어본 적이 없습니까? ‘건축자들이 버린 돌이 모퉁이의 머리가 되었다. 이것은 주님께서 이루신 것이며 우리 눈에 놀랍다.’","43":"그러므로 내가 여러분에게 말합니다. 하나님의 왕국이 여러분에게서 빼앗겨 그 열매를 맺는 백성에게 주어질 것입니다.","44":"이 돌 위에 떨어지는 사람은 깨질 것이며, 이 돌이 누구 위에 떨어지면 그를 산산이 부술 것입니다.”","45":"대제사장들과 바리새인들은 예수님의 비유들을 듣고 그것이 자기들을 두고 하신 말씀인 줄 알았습니다.","46":"그들은 예수님을 붙잡으려고 했지만 무리를 두려워했습니다. 무리가 그분을 예언자로 여겼기 때문입니다."},"22":{"1":"예수님께서 다시 비유로 그들에게 말씀하셨습니다.","2":"“하늘들의 왕국은 자기 아들을 위해 혼인 잔치를 베푼 어떤 왕과 같습니다.","3":"왕은 종들을 보내어 혼인 잔치에 초대받은 사람들을 부르게 했지만, 그들은 오려고 하지 않았습니다.","4":"왕은 다시 다른 종들을 보내며 말했습니다. ‘초대받은 사람들에게 이렇게 말하여라. 보라, 내가 잔치를 준비했다. 내 소들과 살진 짐승들을 잡았고 모든 것이 준비되었다. 혼인 잔치에 오너라.’","5":"그러나 그들은 대수롭지 않게 여기고 하나는 자기 밭으로, 하나는 자기 사업으로 갔습니다.","6":"나머지 사람들은 왕의 종들을 붙잡아 모욕하고 죽였습니다.","7":"왕은 분노하여 군대를 보내 그 살인자들을 멸하고 그들의 성읍을 불태웠습니다.","8":"그때 왕이 종들에게 말했습니다. ‘혼인 잔치는 준비되었으나 초대받은 사람들은 합당하지 않았다.","9":"그러므로 큰길 어귀로 가서 만나는 사람마다 혼인 잔치에 초대하여라.’","10":"그 종들은 길에 나가 악한 사람이나 선한 사람이나 만나는 대로 모두 모았습니다. 그리하여 혼인 잔치 자리가 손님들로 가득 찼습니다.","11":"왕이 손님들을 보러 들어왔을 때 혼인 예복을 입지 않은 한 사람을 보고","12":"그에게 말했습니다. ‘친구여, 혼인 예복도 없이 어떻게 여기 들어왔는가?’ 그는 아무 말도 하지 못했습니다.","13":"그러자 왕이 종들에게 말했습니다. ‘그의 손과 발을 묶어 바깥 어둠에 내던져라. 거기서 울며 이를 갈 것이다.’","14":"초대받은 사람은 많지만 선택된 사람은 적기 때문입니다.”","15":"그때 바리새인들이 가서 어떻게 하면 예수님을 말로 올무에 걸리게 할지 의논했습니다.","16":"그들은 자기 제자들을 헤롯 당원들과 함께 예수님께 보내어 말했습니다. “선생님, 우리는 선생님이 진실하시고 하나님의 길을 진리 안에서 가르치시며 아무도 두려워하지 않으시는 줄 압니다. 사람의 외모를 보지 않으시기 때문입니다.","17":"그러니 우리에게 말씀해 주십시오. 선생님은 어떻게 생각하십니까? 카이사르에게 인두세를 내는 것이 옳습니까, 옳지 않습니까?”","18":"예수님께서 그들의 악의를 아시고 말씀하셨습니다. “위선자들이여, 왜 나를 시험합니까?","19":"세금으로 내는 동전을 내게 보여 주십시오.” 그들이 한 데나리온을 가져왔습니다.","20":"예수님께서 그들에게 말씀하셨습니다. “이 형상과 글은 누구의 것입니까?”","21":"그들이 “카이사르의 것입니다”라고 말했습니다. 그때 예수님께서 말씀하셨습니다. “그러므로 카이사르의 것은 카이사르에게, 하나님의 것은 하나님께 돌려드리십시오.”","22":"그들은 이 말씀을 듣고 놀랐고, 그분을 떠나갔습니다.","23":"그날 부활이 없다고 말하는 사두개인들이 예수님께 와서 물었습니다.","24":"“선생님, 모세가 말하기를 ‘어떤 사람이 자녀 없이 죽으면 그의 형제가 그 아내와 결혼하여 자기 형제를 위해 후손을 일으켜 세워야 한다’고 했습니다.","25":"그런데 우리 가운데 일곱 형제가 있었습니다. 첫째가 결혼했지만 죽었고, 후손이 없어서 자기 아내를 동생에게 남겼습니다.","26":"둘째도, 셋째도 그렇게 하여 일곱째까지 모두 그랬습니다.","27":"마지막으로 그 여자도 죽었습니다.","28":"그러면 부활 때에 그 여자는 일곱 사람 가운데 누구의 아내가 되겠습니까? 그들 모두가 그 여자를 아내로 삼았기 때문입니다.”","29":"예수님께서 그들에게 대답하셨습니다. “여러분은 성경도 하나님의 능력도 알지 못하기 때문에 잘못 생각하고 있습니다.","30":"부활 때에는 사람들이 장가가지도 시집가지도 않고 하늘에 있는 천사들과 같습니다.","31":"죽은 사람들의 부활에 관해서는 하나님께서 여러분에게 하신 말씀을 읽어보지 못했습니까?","32":"‘나는 아브라함의 하나님, 이삭의 하나님, 야곱의 하나님이다.’ 하나님은 죽은 사람들의 하나님이 아니라 살아 있는 사람들의 하나님이십니다.”","33":"무리가 이 말씀을 듣고 그분의 가르침에 놀랐습니다.","34":"바리새인들은 예수님께서 사두개인들을 잠잠하게 하셨다는 말을 듣고 함께 모였습니다.","35":"그들 가운데 한 율법교사가 예수님을 시험하며 물었습니다.","36":"“선생님, 율법에서 어느 계명이 가장 큽니까?”","37":"예수님께서 그에게 말씀하셨습니다. “‘너는 마음을 다하고 혼을 다하고 생각을 다하여 주 너의 하나님을 사랑하여라.’","38":"이것이 크고 첫째 되는 계명입니다.","39":"둘째도 이와 같습니다. ‘네 이웃을 네 자신처럼 사랑하여라.’","40":"율법 전체와 예언자들이 이 두 계명에 달려 있습니다.”","41":"바리새인들이 모여 있을 때 예수님께서 그들에게 물으셨습니다.","42":"“여러분은 그리스도에 관하여 어떻게 생각합니까? 그는 누구의 아들입니까?” 그들이 “다윗의 아들입니다”라고 말했습니다.","43":"예수님께서 그들에게 말씀하셨습니다. “그러면 다윗은 성령 안에서 어떻게 그를 주님이라 부르며 말했습니까?","44":"‘주님께서 내 주님께 말씀하셨다. 내가 네 원수들을 네 발 아래 둘 때까지 내 오른편에 앉아 있어라.’","45":"다윗이 그를 주님이라 부른다면, 어떻게 그가 다윗의 아들이겠습니까?”","46":"아무도 그분께 한마디도 대답할 수 없었고, 그날부터 감히 더 이상 그분께 묻는 사람도 없었습니다."},"23":{"1":"그때 예수님께서 무리와 제자들에게 말씀하셨습니다.","2":"“율법학자들과 바리새인들이 모세의 자리에 앉아 있습니다.","3":"그러므로 그들이 여러분에게 말하는 것은 모두 행하고 지키십시오. 그러나 그들의 행위는 본받지 마십시오. 그들은 말하기만 하고 행하지 않기 때문입니다.","4":"그들은 무겁고 감당하기 어려운 짐을 묶어 사람들의 어깨에 지우지만, 자신들은 손가락 하나로도 그것을 움직이려 하지 않습니다.","5":"그들이 하는 모든 일은 사람들에게 보이려고 하는 것입니다. 그들은 경문 띠를 넓게 하고 옷술을 길게 합니다.","6":"잔치의 윗자리와 회당의 높은 자리와","7":"장터에서 인사받는 것과 사람들에게 ‘랍비’라고 불리는 것을 좋아합니다.","8":"그러나 여러분은 ‘랍비’라고 불리지 마십시오. 여러분의 선생은 한 분이고 여러분은 모두 형제입니다.","9":"또 땅에서 누구를 여러분의 아버지라 부르지 마십시오. 여러분의 아버지는 한 분, 곧 하늘에 계신 분입니다.","10":"또 여러분은 지도자라고 불리지 마십시오. 여러분의 지도자는 한 분, 곧 그리스도입니다.","11":"여러분 가운데 가장 큰 사람은 여러분의 섬기는 사람이 되어야 합니다.","12":"누구든지 자기를 높이는 사람은 낮아지고, 자기를 낮추는 사람은 높아질 것입니다.","13":"그러나 위선자인 율법학자들과 바리새인들이여, 여러분에게 화가 있습니다! 여러분은 사람들 앞에서 하늘들의 왕국을 닫아 버립니다. 여러분 자신도 들어가지 않고, 들어가려는 사람들도 들어가게 하지 않습니다.","14":"[일부 후대 사본에는 다음 절이 있습니다: “위선자인 율법학자들과 바리새인들이여, 여러분에게 화가 있습니다! 여러분은 과부들의 집을 삼키고 겉으로 길게 기도합니다. 그러므로 더 큰 심판을 받을 것입니다.”]","15":"위선자인 율법학자들과 바리새인들이여, 여러분에게 화가 있습니다! 여러분은 한 사람을 개종시키려고 바다와 육지를 두루 다니다가 그가 개종하면 여러분보다 두 배나 더 게헨나의 자식이 되게 합니다.","16":"눈먼 인도자들이여, 여러분에게 화가 있습니다! 여러분은 말합니다. ‘누구든지 성전을 두고 맹세하면 아무것도 아니지만 성전의 금을 두고 맹세하면 의무가 있다.’","17":"어리석고 눈먼 사람들이여! 어느 것이 더 큽니까? 금입니까, 아니면 그 금을 거룩하게 하는 성전입니까?","18":"또 여러분은 말합니다. ‘누구든지 제단을 두고 맹세하면 아무것도 아니지만 제단 위의 예물을 두고 맹세하면 의무가 있다.’","19":"눈먼 사람들이여! 어느 것이 더 큽니까? 예물입니까, 아니면 그 예물을 거룩하게 하는 제단입니까?","20":"그러므로 제단을 두고 맹세하는 사람은 제단과 그 위에 있는 모든 것을 두고 맹세하는 것입니다.","21":"성전을 두고 맹세하는 사람은 성전과 그 안에 거하시는 분을 두고 맹세하는 것입니다.","22":"하늘을 두고 맹세하는 사람은 하나님의 보좌와 그 위에 앉으신 분을 두고 맹세하는 것입니다.","23":"위선자인 율법학자들과 바리새인들이여, 여러분에게 화가 있습니다! 여러분은 박하와 회향과 근채의 십일조는 바치면서 율법의 더 무거운 것들, 곧 정의와 긍휼과 신실함은 버렸습니다. 이것들은 행했어야 하고 저것들도 버리지 말았어야 합니다.","24":"눈먼 인도자들이여! 여러분은 하루살이는 걸러내면서 낙타는 삼킵니다.","25":"위선자인 율법학자들과 바리새인들이여, 여러분에게 화가 있습니다! 여러분은 잔과 접시의 겉은 깨끗하게 하지만 그 안은 탐욕과 방종으로 가득 차 있습니다.","26":"눈먼 바리새인이여! 먼저 잔의 안을 깨끗하게 하십시오. 그러면 겉도 깨끗해질 것입니다.","27":"위선자인 율법학자들과 바리새인들이여, 여러분에게 화가 있습니다! 여러분은 겉으로는 아름답게 보이지만 안에는 죽은 사람들의 뼈와 온갖 더러운 것으로 가득한 회칠한 무덤과 같습니다.","28":"이와 같이 여러분도 겉으로는 사람들에게 의롭게 보이지만 안에는 위선과 불법이 가득합니다.","29":"위선자인 율법학자들과 바리새인들이여, 여러분에게 화가 있습니다! 여러분은 예언자들의 무덤을 세우고 의인들의 무덤을 꾸미며","30":"말합니다. ‘우리가 조상들의 시대에 살았더라면 예언자들의 피를 흘리는 데 그들과 함께하지 않았을 것이다.’","31":"그러므로 여러분은 자신이 예언자들을 죽인 사람들의 자손임을 스스로 증언합니다.","32":"여러분도 여러분 조상들의 분량을 채우십시오!","33":"뱀들이여, 독사의 자식들이여! 여러분이 어떻게 게헨나의 심판을 피하겠습니까?","34":"그러므로 보십시오, 내가 여러분에게 예언자들과 지혜로운 사람들과 율법학자들을 보냅니다. 여러분은 그들 가운데 몇 사람을 죽이고 십자가에 못 박을 것이며, 몇 사람은 여러분의 회당에서 채찍질하고 이 성읍에서 저 성읍으로 박해할 것입니다.","35":"그리하여 의로운 아벨의 피로부터 성전과 제단 사이에서 여러분이 죽인 바라갸의 아들 스가랴의 피까지, 땅에서 흘린 모든 의로운 피가 여러분에게 돌아갈 것입니다.","36":"내가 진실로 여러분에게 말합니다. 이 모든 일이 이 세대에게 닥칠 것입니다.","37":"예루살렘아, 예루살렘아, 예언자들을 죽이고 네게 보내진 사람들을 돌로 치는 자여! 암탉이 자기 새끼들을 날개 아래 모으듯 내가 얼마나 여러 번 네 자녀들을 모으려 했던가! 그러나 너희는 원하지 않았다.","38":"보라, 너희 집이 버려져 너희에게 남겨질 것이다.","39":"내가 너희에게 말한다. 너희가 ‘주님의 이름으로 오시는 분은 복이 있다’라고 말할 때까지 이제부터 결코 나를 보지 못할 것이다.”"},"24":{"1":"예수님께서 성전에서 나와 가실 때 제자들이 성전 건물들을 보여 드리려고 그분께 다가왔습니다.","2":"그러나 예수님께서 그들에게 말씀하셨습니다. “이 모든 것을 보고 있습니까? 내가 진실로 여러분에게 말합니다. 여기 돌 하나도 돌 위에 남겨지지 않고 모두 무너질 것입니다.”","3":"예수님께서 올리브산에 앉아 계실 때 제자들이 따로 와서 말했습니다. “우리에게 말씀해 주십시오. 언제 이런 일들이 일어나겠습니까? 또 주님의 오심과 시대의 완성의 표징은 무엇입니까?”","4":"예수님께서 대답하셨습니다. “아무도 여러분을 미혹하지 못하도록 주의하십시오.","5":"많은 사람이 내 이름으로 와서 ‘내가 그리스도다’라고 말하며 많은 사람을 미혹할 것입니다.","6":"여러분은 전쟁과 전쟁의 소문을 듣게 될 것입니다. 놀라지 않도록 주의하십시오. 이런 일들은 반드시 일어나야 하지만 아직 끝은 아닙니다.","7":"민족이 민족을 대적하고 왕국이 왕국을 대적하여 일어날 것이며, 곳곳에 기근과 지진이 있을 것입니다.","8":"이 모든 것은 해산의 고통의 시작입니다.","9":"그때 사람들이 여러분을 환난에 넘기고 죽일 것이며, 여러분은 내 이름 때문에 모든 민족에게 미움을 받을 것입니다.","10":"그때 많은 사람이 걸려 넘어지고 서로 넘겨주며 서로 미워할 것입니다.","11":"많은 거짓 예언자들이 일어나 많은 사람을 미혹할 것입니다.","12":"불법이 증가하므로 많은 사람의 사랑이 식어질 것입니다.","13":"그러나 끝까지 견딘 사람은 구원받을 것입니다.","14":"이 왕국의 복음이 모든 민족에게 증언되도록 온 세상에 선포될 것이며, 그때 끝이 올 것입니다.","15":"그러므로 예언자 다니엘을 통하여 말씀하신 ‘황폐하게 하는 가증한 것’이 거룩한 곳에 서 있는 것을 보거든—읽는 사람은 깨달으십시오—","16":"그때 유대에 있는 사람들은 산으로 피하십시오.","17":"지붕 위에 있는 사람은 집 안의 물건을 가지러 내려가지 마십시오.","18":"밭에 있는 사람은 겉옷을 가지러 뒤로 돌아가지 마십시오.","19":"그날에는 임신한 여자들과 젖먹이는 여자들에게 화가 있습니다!","20":"여러분이 도망하는 일이 겨울이나 안식일에 일어나지 않도록 기도하십시오.","21":"그때 큰 환난이 있을 것입니다. 세상의 시작부터 지금까지 그런 환난이 없었고 앞으로도 없을 것입니다.","22":"그날들이 단축되지 않았다면 어떤 육체도 구원받지 못했을 것입니다. 그러나 선택된 사람들을 위하여 그날들이 단축될 것입니다.","23":"그때 누가 여러분에게 ‘보십시오, 그리스도가 여기 있다’ 또는 ‘저기 있다’라고 말해도 믿지 마십시오.","24":"거짓 그리스도들과 거짓 예언자들이 일어나 큰 표징들과 기이한 일들을 보여, 할 수만 있다면 선택된 사람들까지 미혹할 것입니다.","25":"보십시오, 내가 미리 여러분에게 말해 두었습니다.","26":"그러므로 사람들이 여러분에게 ‘보십시오, 그가 광야에 있다’라고 말해도 나가지 말고, ‘보십시오, 그가 골방에 있다’라고 말해도 믿지 마십시오.","27":"번개가 동쪽에서 나와 서쪽까지 비추듯 사람의 아들의 오심도 그러할 것입니다.","28":"시체가 있는 곳에는 독수리들이 모일 것입니다.","29":"그날들의 환난 직후에 해가 어두워지고 달이 빛을 내지 않으며 별들이 하늘에서 떨어지고 하늘들의 세력들이 흔들릴 것입니다.","30":"그때 사람의 아들의 표징이 하늘에 나타날 것이며, 땅의 모든 지파가 애통할 것입니다. 그들은 사람의 아들이 능력과 큰 영광으로 하늘의 구름들을 타고 오는 것을 볼 것입니다.","31":"그분께서 큰 나팔 소리와 함께 자기 천사들을 보내실 것이며, 그들은 하늘 이 끝에서 저 끝까지 사방에서 그분의 선택된 사람들을 모을 것입니다.","32":"무화과나무에서 비유를 배우십시오. 그 가지가 부드러워지고 잎이 나면 여름이 가까운 줄 압니다.","33":"이와 같이 여러분도 이 모든 것을 볼 때 그가 가까이, 문 앞에 있는 줄 아십시오.","34":"내가 진실로 여러분에게 말합니다. 이 모든 일이 일어날 때까지 이 세대가 결코 지나가지 않을 것입니다.","35":"하늘과 땅은 지나갈 것이지만 내 말들은 결코 지나가지 않을 것입니다.","36":"그러나 그날과 그 시간에 관해서는 아무도 모릅니다. 하늘의 천사들도, 아들도 모르고 오직 아버지만 아십니다.","37":"노아의 날들과 같이 사람의 아들의 오심도 그러할 것입니다.","38":"홍수 이전의 날들에 노아가 방주에 들어가던 날까지 사람들이 먹고 마시고 장가가고 시집가며","39":"홍수가 와서 모두 쓸어 갈 때까지 알지 못했습니다. 사람의 아들의 오심도 이와 같을 것입니다.","40":"그때 두 사람이 밭에 있을 것인데 하나는 데려가고 하나는 남겨질 것입니다.","41":"두 여자가 맷돌을 갈고 있을 것인데 하나는 데려가고 하나는 남겨질 것입니다.","42":"그러므로 깨어 있으십시오. 여러분의 주님이 어느 날에 오시는지 알지 못하기 때문입니다.","43":"그러나 이것을 아십시오. 집주인이 도둑이 어느 경점에 올지 알았다면 깨어 있어 자기 집이 뚫리지 않게 했을 것입니다.","44":"그러므로 여러분도 준비하고 있으십시오. 여러분이 생각하지 않는 시간에 사람의 아들이 오기 때문입니다.","45":"그러면 주인이 자기 집안 사람들을 맡겨 제때에 양식을 나누어 주게 한 신실하고 지혜로운 종은 누구입니까?","46":"주인이 돌아와 그 종이 그렇게 하고 있는 것을 보면 그 종은 복이 있습니다.","47":"내가 진실로 여러분에게 말합니다. 주인이 자기 모든 소유를 그에게 맡길 것입니다.","48":"그러나 그 악한 종이 마음속으로 ‘내 주인이 늦어지고 있다’라고 말하며","49":"자기 동료 종들을 때리기 시작하고 술 취한 사람들과 함께 먹고 마신다면,","50":"그 종이 예상하지 못한 날, 알지 못하는 시간에 그의 주인이 와서","51":"그를 엄하게 처벌하고 그의 몫을 위선자들과 함께 두게 할 것입니다. 거기서 울며 이를 갈 것입니다."},"25":{"1":"그때 하늘들의 왕국은 등불을 들고 신랑을 맞으러 나간 열 처녀와 같을 것입니다.","2":"그들 가운데 다섯은 어리석고 다섯은 지혜로웠습니다.","3":"어리석은 처녀들은 등불은 가져갔지만 기름은 가져가지 않았습니다.","4":"그러나 지혜로운 처녀들은 등불과 함께 그릇에 기름을 가져갔습니다.","5":"신랑이 늦어지자 모두 졸다가 잠들었습니다.","6":"한밤중에 외치는 소리가 났습니다. ‘보라, 신랑이다! 맞으러 나가라!’","7":"그때 그 처녀들이 모두 일어나 자기 등불을 손질했습니다.","8":"어리석은 처녀들이 지혜로운 처녀들에게 말했습니다. ‘우리 등불이 꺼져 가니 너희 기름을 좀 나누어 다오.’","9":"그러나 지혜로운 처녀들이 대답했습니다. ‘우리와 너희에게 충분하지 않을 수 있으니 차라리 파는 사람들에게 가서 너희 몫을 사라.’","10":"그들이 사러 간 사이에 신랑이 왔습니다. 준비된 처녀들은 그와 함께 혼인 잔치에 들어갔고 문은 닫혔습니다.","11":"나중에 다른 처녀들도 와서 말했습니다. ‘주님, 주님, 우리에게 열어 주십시오!’","12":"그러나 그가 대답했습니다. ‘내가 진실로 너희에게 말한다. 나는 너희를 알지 못한다.’","13":"그러므로 깨어 있으십시오. 여러분은 그날도 그 시간도 알지 못하기 때문입니다.","14":"또 어떤 사람이 여행을 떠나면서 자기 종들을 불러 자기 소유를 맡긴 것과 같습니다.","15":"그는 각 사람의 능력에 따라 한 사람에게는 다섯 달란트, 한 사람에게는 두 달란트, 한 사람에게는 한 달란트를 주고 떠났습니다.","16":"다섯 달란트를 받은 사람은 곧 가서 그것으로 장사하여 다섯 달란트를 더 벌었습니다.","17":"두 달란트를 받은 사람도 마찬가지로 두 달란트를 더 벌었습니다.","18":"그러나 한 달란트를 받은 사람은 가서 땅을 파고 주인의 돈을 숨겨 두었습니다.","19":"오랜 시간이 지난 뒤 그 종들의 주인이 돌아와 그들과 결산했습니다.","20":"다섯 달란트를 받은 사람이 다섯 달란트를 더 가지고 와서 말했습니다. ‘주인님, 제게 다섯 달란트를 맡기셨는데 보십시오, 다섯 달란트를 더 벌었습니다.’","21":"주인이 그에게 말했습니다. ‘잘했다, 착하고 신실한 종아! 네가 적은 일에 신실했으니 내가 많은 일을 네게 맡기겠다. 네 주인의 기쁨에 참여하여라.’","22":"두 달란트를 받은 사람도 와서 말했습니다. ‘주인님, 제게 두 달란트를 맡기셨는데 보십시오, 두 달란트를 더 벌었습니다.’","23":"주인이 그에게 말했습니다. ‘잘했다, 착하고 신실한 종아! 네가 적은 일에 신실했으니 내가 많은 일을 네게 맡기겠다. 네 주인의 기쁨에 참여하여라.’","24":"한 달란트를 받은 사람도 와서 말했습니다. ‘주인님, 저는 주인님이 심지 않은 데서 거두고 뿌리지 않은 데서 모으는 엄한 분인 줄 알았습니다.","25":"그래서 두려워하여 가서 주인님의 달란트를 땅에 숨겨 두었습니다. 보십시오, 여기 주인님의 것이 있습니다.’","26":"그러나 주인이 그에게 대답했습니다. ‘악하고 게으른 종아! 내가 심지 않은 데서 거두고 뿌리지 않은 데서 모으는 줄 알았느냐?","27":"그렇다면 내 돈을 은행가들에게 맡겼어야 했다. 그러면 내가 돌아왔을 때 이자와 함께 내 것을 돌려받았을 것이다.","28":"그러므로 그에게서 그 한 달란트를 빼앗아 열 달란트를 가진 사람에게 주어라.","29":"가진 사람은 누구든지 더 받아 풍성하게 될 것이지만, 가지지 않은 사람은 가진 것마저 빼앗길 것이다.","30":"이 쓸모없는 종을 바깥 어둠에 내던져라. 거기서 울며 이를 갈 것이다.’","31":"사람의 아들이 자기 영광 가운데 모든 천사와 함께 올 때에 자기 영광의 보좌에 앉을 것입니다.","32":"모든 민족이 그분 앞에 모일 것이며, 목자가 양과 염소를 가르듯 그분께서 그들을 서로 갈라놓으실 것입니다.","33":"그분께서 양은 자기 오른편에, 염소는 왼편에 두실 것입니다.","34":"그때 왕이 자기 오른편에 있는 사람들에게 말할 것입니다. ‘내 아버지께 복 받은 사람들이여, 와서 세상 창건 때부터 여러분을 위해 준비된 왕국을 상속받으십시오.","35":"내가 배고팠을 때 여러분이 먹을 것을 주었고, 목말랐을 때 마시게 했으며, 나그네였을 때 맞아들였고,","36":"헐벗었을 때 입혀 주었으며, 병들었을 때 돌보아 주었고, 감옥에 있었을 때 찾아왔습니다.’","37":"그때 의인들이 그분께 대답할 것입니다. ‘주님, 언제 우리가 주님께서 배고프신 것을 보고 먹을 것을 드렸으며, 목마르신 것을 보고 마시게 해 드렸습니까?","38":"언제 우리가 주님께서 나그네 되신 것을 보고 맞아들였고, 헐벗으신 것을 보고 입혀 드렸습니까?","39":"언제 우리가 주님께서 병드시거나 감옥에 계신 것을 보고 찾아갔습니까?’","40":"왕이 그들에게 대답할 것입니다. ‘내가 진실로 여러분에게 말합니다. 여러분이 내 형제들 가운데 가장 작은 사람 하나에게 한 것이 곧 나에게 한 것입니다.’","41":"그때 왕은 왼편에 있는 사람들에게도 말할 것입니다. ‘저주받은 사람들이여, 나를 떠나 마귀와 그의 천사들을 위해 준비된 영원한 불로 가십시오.","42":"내가 배고팠을 때 여러분은 먹을 것을 주지 않았고, 목말랐을 때 마시게 하지 않았으며,","43":"나그네였을 때 맞아들이지 않았고, 헐벗었을 때 입혀 주지 않았으며, 병들거나 감옥에 있을 때 돌보지 않았습니다.’","44":"그때 그들도 대

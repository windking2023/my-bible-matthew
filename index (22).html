cept by prayer and fasting.”]","22":"As they were gathering in Galilee, Jesus said to them, “The Son of Man is about to be handed over into the hands of people,","23":"and they will kill Him, and on the third day He will be raised.” And they were deeply grieved.","24":"When they came to Capernaum, those who collected the two-drachma temple tax came to Peter and said, “Does your teacher not pay the two drachmas?”","25":"He said, “Yes.” When he entered the house, Jesus spoke first: “What do you think, Simon? From whom do the kings of the earth collect toll or tax—from their sons or from others?”","26":"When he said, “From others,” Jesus said to him, “Then the sons are free.","27":"But so that we may not cause them to stumble, go to the sea, cast a hook, and take the first fish that comes up. Open its mouth and you will find a stater. Take that and give it to them for Me and for yourself.”"},"18":{"1":"At that time the disciples came to Jesus, saying, “Who then is greatest in the kingdom of the heavens?”","2":"And calling a little child, He placed the child in their midst","3":"and said, “Truly I say to you, unless you turn and become like little children, you will certainly not enter the kingdom of the heavens.","4":"Therefore whoever humbles himself like this little child is the greatest in the kingdom of the heavens.","5":"And whoever receives one such little child in My name receives Me.","6":"But whoever causes one of these little ones who believe in Me to stumble, it would be better for him that a large millstone be hung around his neck and that he be drowned in the depth of the sea.","7":"Woe to the world because of causes of stumbling! For it is necessary that causes of stumbling come, but woe to the person through whom the cause of stumbling comes!","8":"If your hand or your foot causes you to stumble, cut it off and throw it away. It is better for you to enter life crippled or lame than to have two hands or two feet and be thrown into the eternal fire.","9":"And if your eye causes you to stumble, tear it out and throw it away. It is better for you to enter life with one eye than to have two eyes and be thrown into the Gehenna of fire.","10":"See that you do not despise one of these little ones, for I tell you that in heaven their angels always see the face of My Father who is in heaven.","11":"[Some later manuscripts include: “For the Son of Man came to save what was lost.”]","12":"What do you think? If a man has a hundred sheep and one of them goes astray, will he not leave the ninety-nine on the mountains and go seek the one that went astray?","13":"And if he finds it, truly I say to you, he rejoices over it more than over the ninety-nine that did not go astray.","14":"So it is not the will of your Father who is in heaven that one of these little ones should perish.","15":"If your brother sins against you, go and show him his fault between you and him alone. If he listens to you, you have gained your brother.","16":"But if he does not listen, take one or two more with you, so that every matter may be established by the mouth of two or three witnesses.","17":"If he refuses to listen to them, tell it to the assembly [also: church]. And if he refuses to listen even to the assembly, let him be to you as a Gentile and a tax collector.","18":"Truly I say to you, whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.","19":"Again I say to you that if two of you agree on earth about anything they ask, it will be done for them by My Father who is in heaven.","20":"For where two or three are gathered into My name, there I am in their midst.”","21":"Then Peter came and said to Him, “Lord, how often will my brother sin against me and I forgive him? Up to seven times?”","22":"Jesus said to him, “I do not say to you up to seven times, but up to seventy-seven times [or: seventy times seven].","23":"Therefore the kingdom of the heavens may be compared to a king who wished to settle accounts with his servants.","24":"When he began to settle them, one who owed ten thousand talents was brought to him.","25":"Since he could not pay, the master ordered him to be sold, with his wife and children and all that he had, and payment to be made.","26":"So the servant fell down and bowed before him, saying, ‘Be patient with me, and I will repay you everything.’","27":"Moved with compassion, the master of that servant released him and forgave the debt.","28":"But that servant went out and found one of his fellow servants who owed him a hundred denarii. He seized him and began choking him, saying, ‘Pay what you owe!’","29":"So his fellow servant fell down and pleaded with him, saying, ‘Be patient with me, and I will repay you.’","30":"But he was unwilling; instead, he went and threw him into prison until he should pay what was owed.","31":"When his fellow servants saw what had happened, they were deeply grieved and went and reported to their master everything that had happened.","32":"Then his master summoned him and said, ‘Evil servant! I forgave you all that debt because you pleaded with me.","33":"Should you not also have shown mercy to your fellow servant, just as I showed mercy to you?’","34":"And in anger his master handed him over to the tormentors until he should pay everything he owed.","35":"So also My heavenly Father will do to you if each of you does not forgive his brother from your heart.”"},"19":{"1":"When Jesus had finished these sayings, He departed from Galilee and went into the region of Judea beyond the Jordan.","2":"Large crowds followed Him, and He healed them there.","3":"Pharisees came to Him, testing Him and saying, “Is it lawful for a man to divorce his wife for any reason?”","4":"He answered, “Have you not read that the Creator from the beginning made them male and female","5":"and said, ‘For this reason a man shall leave his father and mother and be joined to his wife, and the two shall become one flesh’?","6":"So they are no longer two, but one flesh. Therefore what God has joined together, let no one separate.”","7":"They said to Him, “Why then did Moses command us to give a certificate of divorce and send her away?”","8":"He said to them, “Because of your hardness of heart Moses allowed you to divorce your wives, but from the beginning it was not so.","9":"And I tell you that whoever divorces his wife, except for sexual immorality, and marries another commits adultery.”","10":"The disciples said to Him, “If such is the situation of a man with his wife, it is better not to marry.”","11":"But He said to them, “Not everyone can receive this saying, but only those to whom it has been given.","12":"For there are eunuchs who were born that way, and there are eunuchs who were made eunuchs by people, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of the heavens. Let the one who can receive this receive it.”","13":"Then little children were brought to Him so that He might lay His hands on them and pray, but the disciples rebuked them.","14":"Jesus said, “Allow the little children, and do not hinder them from coming to Me, for the kingdom of the heavens belongs to such as these.”","15":"And after laying His hands on them, He departed from there.","16":"And behold, a man came to Him and said, “Teacher, what good thing must I do that I may have eternal life?”","17":"He said to him, “Why do you ask Me about what is good? There is One who is good. But if you want to enter life, keep the commandments.”","18":"He said to Him, “Which ones?” Jesus said, “‘You shall not murder. You shall not commit adultery. You shall not steal. You shall not bear false witness.","19":"Honor your father and mother,’ and, ‘You shall love your neighbor as yourself.’”","20":"The young man said to Him, “I have kept all these. What do I still lack?”","21":"Jesus said to him, “If you want to be complete [also: mature, whole], go, sell your possessions and give to the poor, and you will have treasure in heaven; and come, follow Me.”","22":"But when the young man heard this word, he went away sorrowful, for he had many possessions.","23":"Jesus said to His disciples, “Truly I say to you, it is difficult for a rich person to enter the kingdom of the heavens.","24":"Again I tell you, it is easier for a camel to pass through the eye of a needle than for a rich person to enter the kingdom of God.”","25":"When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”","26":"Looking at them, Jesus said, “With people this is impossible, but with God all things are possible.”","27":"Then Peter answered Him, “Behold, we have left everything and followed You. What then will there be for us?”","28":"Jesus said to them, “Truly I say to you, in the renewal, when the Son of Man sits on the throne of His glory, you who have followed Me will also sit on twelve thrones, judging the twelve tribes of Israel.","29":"And everyone who has left houses or brothers or sisters or father or mother or children or fields because of My name will receive a hundredfold and will inherit eternal life.","30":"But many who are first will be last, and the last first."},"20":{"1":"For the kingdom of the heavens is like a master of a house who went out early in the morning to hire workers for his vineyard.","2":"After agreeing with the workers for a denarius for the day, he sent them into his vineyard.","3":"And going out about the third hour, he saw others standing idle in the marketplace.","4":"He said to them, ‘You also go into the vineyard, and whatever is right I will give you.’ So they went.","5":"Again he went out about the sixth and the ninth hour and did the same.","6":"And about the eleventh hour he went out and found others standing there, and he said to them, ‘Why have you been standing here idle all day?’","7":"They said to him, ‘Because no one hired us.’ He said to them, ‘You also go into the vineyard.’","8":"When evening came, the owner of the vineyard said to his manager, ‘Call the workers and pay them their wages, beginning with the last and going to the first.’","9":"Those hired about the eleventh hour came and each received a denarius.","10":"When the first came, they thought they would receive more, but they too each received a denarius.","11":"When they received it, they began grumbling against the master of the house,","12":"saying, ‘These last worked only one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’","13":"But he answered one of them, ‘Friend, I am doing you no wrong. Did you not agree with me for a denarius?","14":"Take what is yours and go. I want to give to this last one the same as I give to you.","15":"Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am generous?’","16":"So the last will be first, and the first last.","17":"As Jesus was going up to Jerusalem, He took the twelve disciples aside by themselves, and on the way He said to them,","18":"“Behold, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn Him to death.","19":"They will hand Him over to the Gentiles to mock and flog and crucify Him, and on the third day He will be raised.”","20":"Then the mother of the sons of Zebedee came to Him with her sons, bowing before Him and asking something from Him.","21":"He said to her, “What do you want?” She said to Him, “Say that these two sons of mine may sit, one at Your right and one at Your left, in Your kingdom.”","22":"Jesus answered, “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to Him, “We are able.”","23":"He said to them, “You will indeed drink My cup, but to sit at My right and at My left is not Mine to give, except to those for whom it has been prepared by My Father.”","24":"When the ten heard this, they were indignant with the two brothers.","25":"But Jesus called them to Himself and said, “You know that the rulers of the Gentiles lord it over them, and their great ones exercise authority over them.","26":"It shall not be so among you. Rather, whoever wants to become great among you shall be your servant,","27":"and whoever wants to be first among you shall be your slave,","28":"just as the Son of Man came not to be served but to serve, and to give His life as a ransom in place of many.”","29":"As they went out from Jericho, a large crowd followed Him.","30":"And behold, two blind men sitting beside the road, when they heard that Jesus was passing by, cried out, “Lord, Son of David, have mercy on us!”","31":"The crowd rebuked them so that they would be silent, but they cried out all the more, “Lord, Son of David, have mercy on us!”","32":"Jesus stopped, called them, and said, “What do you want Me to do for you?”","33":"They said to Him, “Lord, let our eyes be opened.”","34":"Moved with compassion, Jesus touched their eyes, and immediately they received their sight and followed Him."},"21":{"1":"When they drew near to Jerusalem and came to Bethphage on the Mount of Olives, Jesus sent two disciples,","2":"saying to them, “Go into the village opposite you, and immediately you will find a donkey tied and a colt with her. Untie them and bring them to Me.","3":"If anyone says anything to you, you shall say, ‘The Lord needs them,’ and he will send them at once.”","4":"This took place so that what was spoken through the prophet might be fulfilled:","5":"“Say to the daughter of Zion, ‘Behold, your King is coming to you, gentle and mounted on a donkey, and on a colt, the foal of a beast of burden.’”","6":"The disciples went and did just as Jesus had directed them.","7":"They brought the donkey and the colt, laid their garments on them, and He sat on them.","8":"A very large crowd spread their garments on the road, while others cut branches from the trees and spread them on the road.","9":"The crowds going before Him and those following were crying out, “Hosanna to the Son of David! Blessed is the One who comes in the name of the Lord! Hosanna in the highest!”","10":"When He entered Jerusalem, the whole city was stirred, saying, “Who is this?”","11":"The crowds were saying, “This is the prophet Jesus, from Nazareth of Galilee.”","12":"Jesus entered the temple and drove out all who were buying and selling in the temple. He overturned the tables of the money changers and the seats of those selling doves.","13":"And He said to them, “It is written, ‘My house shall be called a house of prayer,’ but you are making it a den of robbers.”","14":"The blind and the lame came to Him in the temple, and He healed them.","15":"But when the chief priests and the scribes saw the marvelous things He did and the children crying out in the temple, “Hosanna to the Son of David!” they were indignant.","16":"They said to Him, “Do You hear what these are saying?” Jesus said to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies You have prepared praise’?”","17":"And leaving them, He went out of the city to Bethany and spent the night there.","18":"Early in the morning, as He returned to the city, He became hungry.","19":"Seeing a fig tree by the road, He went to it and found nothing on it except leaves. He said to it, “May no fruit ever come from you again.” And the fig tree withered at once.","20":"When the disciples saw it, they marveled, saying, “How did the fig tree wither at once?”","21":"Jesus answered them, “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be lifted up and thrown into the sea,’ it will happen.","22":"And whatever you ask in prayer, believing, you will receive.”","23":"When He entered the temple, the chief priests and the elders of the people came to Him as He was teaching and said, “By what authority are You doing these things, and who gave You this authority?”","24":"Jesus answered them, “I also will ask you one question. If you tell Me, I too will tell you by what authority I do these things.","25":"The baptism of John—where was it from? From heaven or from people?” They reasoned among themselves, saying, “If we say, ‘From heaven,’ He will say to us, ‘Why then did you not believe him?’","26":"But if we say, ‘From people,’ we fear the crowd, for they all regard John as a prophet.”","27":"So they answered Jesus, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.","28":"“But what do you think? A man had two sons. He went to the first and said, ‘Son, go work in the vineyard today.’","29":"He answered, ‘I will not,’ but afterward he changed his mind and went.","30":"The man went to the second and said the same. He answered, ‘I will, sir,’ but did not go.","31":"Which of the two did the will of his father?” They said, “The first.” Jesus said to them, “Truly I say to you, tax collectors and prostitutes are entering the kingdom of God ahead of you.","32":"For John came to you in the way of righteousness, and you did not believe him, but the tax collectors and prostitutes believed him. Yet even after seeing this, you did not afterward change your minds and believe him.","33":"“Hear another parable. There was a master of a house who planted a vineyard, put a fence around it, dug a winepress in it, and built a tower. He leased it to tenant farmers and went away.","34":"When the season for the fruit drew near, he sent his servants to the farmers to receive his fruit.","35":"But the farmers took his servants; one they beat, another they killed, and another they stoned.","36":"Again he sent other servants, more than the first, and they did the same to them.","37":"Finally he sent his son to them, saying, ‘They will respect my son.’","38":"But when the farmers saw the son, they said among themselves, ‘This is the heir. Come, let us kill him and take his inheritance.’","39":"So they took him, threw him out of the vineyard, and killed him.","40":"When therefore the owner of the vineyard comes, what will he do to those farmers?”","41":"They said to Him, “He will miserably destroy those evil men and lease the vineyard to other farmers who will give him the fruits in their seasons.”","42":"Jesus said to them, “Have you never read in the Scriptures, ‘The stone the builders rejected has become the head of the corner. This came from the Lord, and it is marvelous in our eyes’?","43":"Therefore I tell you that the kingdom of God will be taken away from you and given to a people producing its fruits.","44":"The one who falls on this stone will be broken to pieces, and on whomever it falls, it will crush him.”","45":"When the chief priests and the Pharisees heard His parables, they knew that He was speaking about them.","46":"They sought to seize Him, but they feared the crowds, because the people regarded Him as a prophet."},"22":{"1":"Jesus spoke to them again in parables, saying,","2":"“The kingdom of the heavens may be compared to a king who prepared a wedding feast for his son.","3":"He sent his servants to call those who had been invited to the wedding feast, but they were unwilling to come.","4":"Again he sent other servants, saying, ‘Tell those who are invited: Behold, I have prepared my banquet; my oxen and fattened animals have been slaughtered, and everything is ready. Come to the wedding feast.’","5":"But they paid no attention and went away, one to his own field and another to his business.","6":"The rest seized his servants, mistreated them, and killed them.","7":"The king was enraged. He sent his armies, destroyed those murderers, and burned their city.","8":"Then he said to his servants, ‘The wedding feast is ready, but those invited were not worthy.","9":"Therefore go to the outlets of the roads and invite to the wedding feast as many as you find.’","10":"Those servants went out into the roads and gathered everyone they found, both evil and good, and the wedding hall was filled with guests.","11":"When the king came in to see the guests, he saw there a man who was not wearing a wedding garment.","12":"He said to him, ‘Friend, how did you come in here without a wedding garment?’ And he was speechless.","13":"Then the king said to the servants, ‘Bind his hands and feet and throw him into the outer darkness. There will be weeping and grinding of teeth.’","14":"For many are called, but few are chosen.”","15":"Then the Pharisees went and plotted how they might trap Him in His words.","16":"They sent their disciples to Him with the Herodians, saying, “Teacher, we know that You are truthful and teach the way of God in truth, and You are not concerned about anyone, for You do not look at the face of people.","17":"Tell us then, what do You think? Is it lawful to pay the poll tax to Caesar, or not?”","18":"But Jesus, knowing their evil intent, said, “Why do you test Me, hypocrites?","19":"Show Me the coin used for the tax.” And they brought Him a denarius.","20":"He said to them, “Whose image and inscription is this?”","21":"They said, “Caesar’s.” Then He said to them, “Therefore give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”","22":"When they heard this, they marveled, and leaving Him, they went away.","23":"That same day Sadducees, who say there is no resurrection, came to Him and questioned Him,","24":"saying, “Teacher, Moses said, ‘If a man dies having no children, his brother shall marry his wife and raise up offspring for his brother.’","25":"Now there were seven brothers among us. The first married and died, and having no offspring, he left his wife to his brother.","26":"So also the second and the third, down to the seventh.","27":"Last of all, the woman died.","28":"In the resurrection, therefore, whose wife of the seven will she be? For they all had her.”","29":"Jesus answered them, “You are mistaken because you know neither the Scriptures nor the power of God.","30":"For in the resurrection they neither marry nor are given in marriage, but are like angels in heaven.","31":"But concerning the resurrection of the dead, have you not read what was spoken to you by God:","32":"‘I am the God of Abraham and the God of Isaac and the God of Jacob’? He is not the God of the dead, but of the living.”","33":"When the crowds heard this, they were astonished at His teaching.","34":"But when the Pharisees heard that He had silenced the Sadducees, they gathered together.","35":"And one of them, a lawyer, asked Him a question, testing Him:","36":"“Teacher, which commandment is great in the Law?”","37":"He said to him, “‘You shall love the Lord your God with all your heart and with all your soul and with all your mind.’","38":"This is the great and first commandment.","39":"And the second is like it: ‘You shall love your neighbor as yourself.’","40":"On these two commandments hang the whole Law and the Prophets.”","41":"Now while the Pharisees were gathered together, Jesus asked them,","42":"“What do you think about the Christ? Whose son is He?” They said to Him, “David’s.”","43":"He said to them, “How then does David in the Spirit call Him Lord, saying,","44":"‘The Lord said to my Lord, “Sit at My right hand until I put Your enemies under Your feet”’?","45":"If David calls Him Lord, how is He his son?”","46":"No one was able to answer Him a word, nor did anyone dare from that day to question Him any further."},"23":{"1":"Then Jesus spoke to the crowds and to His disciples,","2":"saying, “The scribes and the Pharisees sit in Moses’ seat.","3":"Therefore do and keep whatever they tell you, but do not do according to their works, for they say and do not do.","4":"They tie up heavy burdens, hard to bear, and lay them on people’s shoulders, but they themselves are unwilling to move them with their finger.","5":"They do all their works to be seen by people. They broaden their phylacteries and lengthen the fringes of their garments.","6":"They love the place of honor at banquets and the best seats in the synagogues,","7":"greetings in the marketplaces, and being called ‘Rabbi’ by people.","8":"But you are not to be called ‘Rabbi,’ for One is your Teacher, and you are all brothers.","9":"And do not call anyone on earth your father, for One is your Father, the One in heaven.","10":"Nor are you to be called leaders, for One is your Leader, the Christ.","11":"The greatest among you shall be your servant.","12":"Whoever exalts himself will be humbled, and whoever humbles himself will be exalted.","13":"But woe to you, scribes and Pharisees, hypocrites! You shut the kingdom of the heavens in people’s faces. You yourselves do not enter, nor do you allow those entering to go in.","14":"[Some later manuscripts include: “Woe to you, scribes and Pharisees, hypocrites! You devour widows’ houses and for appearance make long prayers. Therefore you will receive greater judgment.”]","15":"Woe to you, scribes and Pharisees, hypocrites! You travel over sea and land to make one convert, and when he becomes one, you make him twice as much a son of Gehenna as yourselves.","16":"Woe to you, blind guides, who say, ‘Whoever swears by the temple, it is nothing; but whoever swears by the gold of the temple is bound by his oath.’","17":"Fools and blind men! Which is greater, the gold or the temple that makes the gold holy?","18":"And you say, ‘Whoever swears by the altar, it is nothing; but whoever swears by the gift on it is bound by his oath.’","19":"Blind men! Which is greater, the gift or the altar that makes the gift holy?","20":"Therefore whoever swears by the altar swears by it and by everything on it.","21":"And whoever swears by the temple swears by it and by the One who dwells in it.","22":"And whoever swears by heaven swears by the throne of God and by the One who sits on it.","23":"Woe to you, scribes and Pharisees, hypocrites! You give a tenth of mint and dill and cumin, but you have neglected the weightier matters of the Law—justice, mercy, and faithfulness. These you ought to have done without neglecting the others.","24":"Blind guides! You strain out a gnat but swallow a camel.","25":"Woe to you, scribes and Pharisees, hypocrites! You clean the outside of the cup and dish, but inside they are full of greed and self-indulgence.","26":"Blind Pharisee! First clean the inside of the cup, so that its outside may also become clean.","27":"Woe to you, scribes and Pharisees, hypocrites! You are like whitewashed tombs, which outwardly appear beautiful but inwardly are full of dead people’s bones and all uncleanness.","28":"So also you outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.","29":"Woe to you, scribes and Pharisees, hypocrites! You build the tombs of the prophets and decorate the graves of the righteous,","30":"and you say, ‘If we had lived in the days of our fathers, we would not have shared with them in shedding the blood of the prophets.’","31":"Thus you testify against yourselves that you are sons of those who murdered the prophets.","32":"You too, then, fill up the measure of your fathers!","33":"Serpents, offspring of vipers! How will you escape the judgment of Gehenna?","34":"Therefore behold, I send you prophets and wise men and scribes. Some of them you will kill and crucify, and some you will flog in your synagogues and persecute from city to city,","35":"so that upon you may come all the righteous blood shed on the earth, from the blood of righteous Abel to the blood of Zechariah son of Barachiah, whom you murdered between the temple and the altar.","36":"Truly I say to you, all these things will come upon this generation.","37":"Jerusalem, Jerusalem, who kills the prophets and stones those sent to her! How often I wanted to gather your children together, as a hen gathers her chicks under her wings, and you were unwilling!","38":"Behold, your house is left to you desolate.","39":"For I tell you, from now on you will certainly not see Me until you say, ‘Blessed is the One who comes in the name of the Lord.’”"},"24":{"1":"Jesus went out from the temple and was going away when His disciples came to point out the temple buildings to Him.","2":"But He answered them, “Do you see all these things? Truly I say to you, not one stone here will be left upon another; all will be thrown down.”","3":"As He was sitting on the Mount of Olives, the disciples came to Him privately, saying, “Tell us, when will these things happen, and what will be the sign of Your coming and of the completion of the age?”","4":"Jesus answered them, “See that no one leads you astray.","5":"For many will come in My name, saying, ‘I am the Christ,’ and they will lead many astray.","6":"You will hear of wars and rumors of wars. See that you are not alarmed, for these things must happen, but the end is not yet.","7":"For nation will rise against nation, and kingdom against kingdom, and there will be famines and earthquakes in various places.","8":"All these things are the beginning of birth pains.","9":"Then they will hand you over to tribulation and kill you, and you will be hated by all nations because of My name.","10":"Then many will stumble, and they will betray one another and hate one another.","11":"Many false prophets will arise and lead many astray.","12":"Because lawlessness will increase, the love of many will grow cold.","13":"But the one who endures to the end will be saved.","14":"And this gospel of the kingdom will be proclaimed in the whole inhabited world as a testimony to all nations, and then the end will come.","15":"Therefore when you see the abomination of desolation spoken of through Daniel the prophet standing in the holy place—let the reader understand—","16":"then let those in Judea flee to the mountains.","17":"Let the one on the housetop not go down to take anything out of his house.","18":"And let the one in the field not turn back to take his cloak.","19":"But woe to those who are pregnant and to those nursing infants in those days!","20":"Pray that your flight may not happen in winter or on a Sabbath.","21":"For then there will be great tribulation, such as has not occurred from the beginning of the world until now, nor ever will.","22":"And if those days had not been shortened, no flesh would be saved; but for the sake of the chosen, those days will be shortened.","23":"Then if anyone says to you, ‘Behold, here is the Christ,’ or ‘There He is,’ do not believe it.","24":"For false christs and false prophets will arise and give great signs and wonders, so as to lead astray, if possible, even the chosen.","25":"Behold, I have told you beforehand.","26":"So if they say to you, ‘Behold, He is in the wilderness,’ do not go out; or, ‘Behold, He is in the inner rooms,’ do not believe it.","27":"For just as lightning comes from the east and shines as far as the west, so will be the coming of the Son of Man.","28":"Wherever the corpse is, there the vultures will gather.","29":"Immediately after the tribulation of those days, the sun will be darkened, the moon will not give its light, the stars will fall from heaven, and the powers of the heavens will be shaken.","30":"Then the sign of the Son of Man will appear in heaven, and all the tribes of the earth will mourn. They will see the Son of Man coming on the clouds of heaven with power and great glory.","31":"And He will send out His angels with a great trumpet sound, and they will gather His chosen from the four winds, from one end of the heavens to the other.","32":"Learn the parable from the fig tree: when its branch has already become tender and puts out its leaves, you know that summer is near.","33":"So also you, when you see all these things, know that He is near, at the doors.","34":"Truly I say to you, this generation will certainly not pass away until all these things happen.","35":"Heaven and earth will pass away, but My words will certainly not pass away.","36":"But concerning that day and hour no one knows—not even the angels of the heavens, nor the Son, but the Father alone.","37":"For just as the days of Noah were, so will be the coming of the Son of Man.","38":"For in those days before the flood, they were eating and drinking, marrying and giving in marriage, until the day Noah entered the ark,","39":"and they did not know until the flood came and swept them all away. So also will be the coming of the Son of Man.","40":"Then two will be in the field; one is taken and one is left.","41":"Two women will be grinding at the mill; one is taken and one is left.","42":"Therefore stay awake, because you do not know on what day your Lord is coming.","43":"But know this: if the master of the house had known in which watch of the night the thief was coming, he would have stayed awake and not allowed his house to be broken into.","44":"Therefore you also must be ready, because the Son of Man is coming at an hour you do not expect.","45":"Who then is the faithful and wise servant whom his master put over his household to give them food at the proper time?","46":"Blessed is that servant whom his master finds doing so when he comes.","47":"Truly I say to you, he will put him over all his possessions.","48":"But if that evil servant says in his heart, ‘My master is delaying,’","49":"and begins to beat his fellow servants and eats and drinks with drunkards,","50":"the master of that servant will come on a day he does not expect and at an hour he does not know,","51":"and will cut him in two and assign him a place with the hypocrites. There will be weeping and grinding of teeth."},"25":{"1":"Then the kingdom of the heavens will be like ten virgins who took their lamps and went out to meet the bridegroom.","2":"Five of them were foolish and five were wise.","3":"For when the foolish took their lamps, they took no oil with them.","4":"But the wise took oil in containers along with their lamps.","5":"As the bridegroom was delayed, they all became drowsy and fell asleep.","6":"But at midnight there was a shout: ‘Behold, the bridegroom! Come out to meet him!’","7":"Then all those virgins rose and trimmed their lamps.","8":"The foolish said to the wise, ‘Give us some of your oil, because our lamps are going out.’","9":"But the wise answered, ‘There may not be enough for us and for you. Go instead to those who sell and buy some for yourselves.’","10":"While they were going away to buy it, the bridegroom came. Those who were ready went in with him to the wedding feast, and the door was shut.","11":"Later the other virgins also came, saying, ‘Lord, lord, open to us!’","12":"But he answered, ‘Truly I say to you, I do not know you.’","13":"Therefore stay awake, because you know neither the day nor the hour.","14":"For it is also like a man going on a journey who called his own servants and entrusted his possessions to them.","15":"To one he gave five talents, to another two, and to another one, each according to his own ability; then he went away.","16":"The one who received five talents went at once and traded with them and gained five more.","17":"In the same way, the one with two gained two more.","18":"But the one who received one went away, dug in the ground, and hid his master’s money.","19":"After a long time the master of those servants came and settled accounts with them.","20":"The one who had received five talents came and brought five more, saying, ‘Master, you entrusted five talents to me. Behold, I gained five talents more.’","21":"His master said to him, ‘Well done, good and faithful servant! You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’","22":"The one who had received two talents also came and said, ‘Master, you entrusted two talents to me. Behold, I gained two talents more.’","23":"His master said to him, ‘Well done, good and faithful servant! You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’","24":"Then the one who had received one talent also came and said, ‘Master, I knew you to be a hard man, reaping where you did not sow and gathering where you scattered no seed.","25":"So I was afraid, and I went and hid your talent in the ground. Behold, you have what is yours.’","26":"But his master answered him, ‘Evil and lazy servant! You knew that I reap where I did not sow and gather where I scattered no seed?","27":"Then you ought to have deposited my money with the bankers, and at my coming I would have received what was mine with interest.","28":"Therefore take the talent from him and give it to the one who has the ten talents.","29":"For to everyone who has, more will be given, and he will have abundance; but from the one who does not have, even what he has will be taken away.","30":"And throw the useless servant into the outer darkness. There will be weeping and grinding of teeth.’","31":"When the Son of Man comes in His glory, and all the angels with Him, then He will sit on the throne of His glory.","32":"All the nations will be gathered before Him, and He will separate them from one another as a shepherd separates the sheep from the goats.","33":"He will place the sheep at His right hand, but the goats at the left.","34":"Then the King will say to those at His right, ‘Come, you who are blessed by My Father; inherit the kingdom prepared for you from the foundation of the world.","35":"For I was hungry and you gave Me something to eat; I was thirsty and you gave Me something to drink; I was a stranger and you welcomed Me;","36":"I was naked and you clothed Me; I was sick and you cared for Me; I was in prison and you came to Me.’","37":"Then the righteous will answer Him, saying, ‘Lord, when did we see You hungry and feed You, or thirsty and give You something to drink?","38":"When did we see You a stranger and welcome You, or naked and clothe You?","39":"When did we see You sick or in prison and come to You?’","40":"And the King will answer them, ‘Truly I say to you, as much as you did it to one of the least of these My brothers, you did it to Me.’","41":"Then He will also say to those at His left, ‘Depart from Me, you who are cursed, into the eternal fire prepared for the devil and his angels.","42":"For I was hungry and you gave Me nothing to eat; I was thirsty and you gave Me nothing to drink;","43":"I was a stranger and you did not welcome Me; naked and you did not clothe Me; sick and in prison and you did not care for Me.’","44":"Then they too will answer, saying, ‘Lord, when did we see You hungry or thirsty or a stranger or naked or sick or in prison and did not serve You?’","45":"Then He will answer them, ‘Truly I say to you, as much as you did not do it to one of the least of these, you did not do it to Me.’","46":"And these will go away into eternal punishment, but the righteous into eternal life.”"},"26":{"1":"When Jesus had finished all these sayings, He said to His disciples,","2":"“You know that after two days the Passover comes, and the Son of Man will be handed over to be crucified.”","3":"Then the chief priests and the elders of the people gathered in the courtyard of the high priest, whose name was Caiaphas,","4":"and they plotted together to seize Jesus by deceit and kill Him.","5":"But they said, “Not during the feast, so that there may not be an uproar among the people.”","6":"Now when Jesus was in Bethany in the house of Simon the leper,","7":"a woman came to Him with an alabaster jar of very costly perfume, and she poured it on His head as He reclined at table.","8":"When the disciples saw it, they were indignant and said, “Why this waste?","9":"For this could have been sold for a high price and given to the poor.”","10":"But Jesus, knowing this, said to them, “Why do you trouble the woman? She has done a beautiful work to Me.","11":"For you always have the poor with you, but you do not always have Me.","12":"For when she poured this perfume on My body, she did it to prepare Me for burial.","13":"Truly I say to you, wherever this gospel is proclaimed in the whole world, what she has done will also be spoken of in memory of her.”","14":"Then one of the Twelve, the one called Judas Iscariot, went to the chief priests","15":"and said, “What are you willing to give me if I hand Him over to you?” And they weighed out thirty pieces of silver for him.","16":"From then on he sought an opportunity to hand Him over.","17":"On the first day of Unleavened Bread, the disciples came to Jesus and said, “Where do You want us to prepare for You to eat the Passover?”","18":"He said, “Go into the city to a certain man and say to him, ‘The Teacher says: My time is near; I will keep the Passover at your house with My disciples.’”","19":"The disciples did as Jesus directed them and prepared the Passover.","20":"When evening came, He reclined at table with the twelve disciples.","21":"And as they were eating, He said, “Truly I say to you, one of you will hand Me over.”","22":"Deeply grieved, each of them began to say to Him, “Surely not I, Lord?”","23":"He answered, “The one who dipped his hand with Me in the bowl will hand Me over.","24":"The Son of Man goes just as it is written about Him, but woe to that man through whom the Son of Man is handed over! It would have been better for that man if he had not been born.”","25":"Judas, who was handing Him over, answered, “Surely not I, Rabbi?” He said to him, “You have said it.”","26":"As they were eating, Jesus took bread, and after blessing it He broke it and gave it to the disciples, saying, “Take, eat; this is My body.”","27":"And taking a cup and giving thanks, He gave it to them, saying, “Drink from it, all of you,","28":"for this is My blood of the covenant, which is poured out for many for forgiveness of sins.","29":"But I tell you, from now on I will certainly not drink of this fruit of the vine until that day when I drink it new with you in My Father’s kingdom.”","30":"After singing a hymn, they went out to the Mount of Olives.","31":"Then Jesus said to them, “All of you will stumble because of Me this night, for it is written, ‘I will strike the shepherd, and the sheep of the flock will be scattered.’","32":"But after I am raised, I will go ahead of you into Galilee.”","33":"Peter answered Him, “Even if everyone stumbles because of You, I will never stumble.”","34":"Jesus said to him, “Truly I say to you, this very night, before a rooster crows, you will deny Me three times.”","35":"Peter said to Him, “Even if I must die with You, I will certainly not deny You.” All the disciples said the same.","36":"Then Jesus came with them to a place called Gethsemane, and He said to the disciples, “Sit here while I go over there and pray.”","37":"Taking Peter and the two sons of Zebedee with Him, He began to be grieved and deeply distressed.","38":"Then He said to them, “My soul is deeply grieved, to the point of death. Remain here and stay awake with Me.”","39":"Going a little farther, He fell on His face and prayed, saying, “My Father, if it is possible, let this cup pass from Me; nevertheless, not as I want, but as You want.”","40":"He came to the disciples and found them sleeping, and He said to Peter, “So, were you not able to stay awake with Me for one hour?","41":"Stay awake and pray so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.”","42":"Again, for a second time, He went away and prayed, saying, “My Father, if this cannot pass unless I drink it, let Your will be done.”","43":"He came again and found them sleeping, for their eyes were heavy.","44":"Leaving them, He went away again and prayed for a third time, saying the same words again.","45":"Then He came to the disciples and said to them, “Are you still sleeping and resting? Behold, the hour has drawn near, and the Son of Man is being handed over into the hands of sinners.","46":"Rise, let us go. Behold, the one who hands Me over has drawn near.”","47":"While He was still speaking, behold, Judas, one of the Twelve, came, and with him a large crowd with swords and clubs from the chief priests and elders of the people.","48":"Now the one handing Him over had given them a sign, saying, “The one I kiss is He; seize Him.”","49":"Immediately he came to Jesus and said, “Greetings, Rabbi!” and kissed Him.","50":"Jesus said to him, “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized Him.","51":"And behold, one of those with Jesus stretched out his hand, drew his sword, struck the servant of the high priest, and cut off his ear.","52":"Then Jesus said to him, “Put your sword back in its place, for all who take the sword will perish by the sword.","53":"Or do you think that I cannot appeal to My Father, and He will at once provide Me with more than twelve legions of angels?","54":"How then would the Scriptures be fulfilled, that it must happen this way?”","55":"At that time Jesus said to the crowds, “Have you come out with swords and clubs as against a robber to arrest Me? Day after day I sat in the temple teaching, and you did not seize Me.","56":"But all this has happened so that the Scriptures of the prophets might be fulfilled.” Then all the disciples left Him and fled.","57":"Those who had seized Jesus led Him away to Caiaphas the high priest, where the scribes and elders had gathered.","58":"Peter was following Him at a distance, as far as the courtyard of the high priest. He entered and sat with the guards to see the outcome.","59":"Now the chief priests and the whole council were seeking false testimony against Jesus so that they might put Him to death,","60":"but they found none, though many false witnesses came forward. Finally two came forward","61":"and said, “This man said, ‘I am able to destroy the temple of God and rebuild it in three days.’”","62":"The high priest stood and said to Him, “Do You answer nothing? What are these men testifying against You?”","63":"But Jesus remained silent. And the high priest said to Him, “I put You under oath by the living God: tell us whether You are the Christ, the Son of God.”","64":"Jesus said to him, “You have said it. But I tell you, from now on you will see the Son of Man sitting at the right hand of Power and coming on the clouds of heaven.”","65":"Then the high priest tore his garments, saying, “He has blasphemed! What further need do we have of witnesses? Behold, now you have heard the blasphemy.","66":"What do you think?” They answered, “He deserves death.”","67":"Then they spat in His face and struck Him with their fists, and others slapped Him,","68":"saying, “Prophesy to us, Christ! Who is the one who struck You?”","69":"Now Peter was sitting outside in the courtyard, and a servant girl came to him and said, “You also were with Jesus the Galilean.”","70":"But he denied it before everyone, saying, “I do not know what you are talking about.”","71":"When he went out to the gateway, another servant girl saw him and said to those there, “This man was with Jesus the Nazarene.”","72":"Again he denied it with an oath: “I do not know the man.”","73":"After a little while, those standing there came and said to Peter, “Surely you too are one of them, for your speech makes you evident.”","74":"Then he began to curse and swear, “I do not know the man!” And immediately a rooster crowed.","75":"And Peter remembered the word Jesus had spoken: “Before a rooster crows, you will deny Me three times.” And he went outside and wept bitterly."},"27":{"1":"When morning came, all the chief priests and the elders of the people took counsel against Jesus so that they might put Him to death.","2":"They bound Him, led Him away, and handed Him over to Pilate the governor.","3":"Then Judas, the one who had handed Him over, when he saw that Jesus had been condemned, regretted what he had done and returned the thirty pieces of silver to the chief priests and elders,","4":"saying, “I have sinned by handing over innocent blood.” But they said, “What is that to us? See to it yourself.”","5":"And throwing the pieces of silver into the temple, he departed and went away and hanged himself.","6":"The chief priests took the pieces of silver and said, “It is not lawful to put them into the temple treasury, since they are the price of blood.”","7":"After taking counsel, they bought with them the potter’s field as a burial place for strangers.","8":"Therefore that field has been called the Field of Blood to this day.","9":"Then what was spoken through Jeremiah the prophet was fulfilled: “They took the thirty pieces of silver, the price of the One whose price had been set, whom some of the sons of Israel had priced,","10":"and they gave them for the potter’s field, as the Lord directed me.”","11":"Now Jesus stood before the governor, and the governor questioned Him, saying, “Are You the King of the Jews?” Jesus said, “You have said it.”","12":"And while He was being accused by the chief priests and elders, He answered nothing.","13":"Then Pilate said to Him, “Do You not hear how many things they testify against You?”","14":"But He did not answer him, not even one word, so that the governor was greatly amazed.","15":"Now at the feast the governor was accustomed to release to the crowd one prisoner whom they wanted.","16":"At that time they had a notorious prisoner called Barabbas.","17":"So when they had gathered, Pilate said to them, “Whom do you want me to release for you: Barabbas, or Jesus who is called Christ?”","18":"For he knew that they had handed Him over because of envy.","19":"While he was sitting on the judgment seat, his wife sent word to him: “Have nothing to do with that righteous man, for I suffered much today in a dream because of Him.”","20":"But the chief priests and elders persuaded the crowds to ask for Barabbas and to destroy Jesus.","21":"The governor answered them, “Which of the two do you want me to release for you?” They said, “Barabbas.”","22":"Pilate said to them, “What then shall I do with Jesus who is called Christ?” They all said, “Let Him be crucified!”","23":"He said, “Why? What evil has He done?” But they cried out all the more, “Let Him be crucified!”","24":"When Pilate saw that he was accomplishing nothing but that a riot was beginning, he took water and washed his hands before the crowd, saying, “I am innocent of this man’s blood. See to it yourselves.”","25":"And all the people answered, “His blood be on us and on our children!”","26":"Then he released Barabbas for them, but after having Jesus flogged, he handed Him over to be crucified.","27":"Then the governor’s soldiers took Jesus into the governor’s headquarters and gathered the whole cohort around Him.","28":"They stripped Him and put a scarlet cloak on Him.","29":"And twisting together a crown of thorns, they put it on His head and a reed in His right hand. Kneeling before Him, they mocked Him, saying, “Hail, King of the Jews!”","30":"They spat on Him, took the reed, and struck Him on the head.","31":"After they had mocked Him, they stripped off the cloak, put His own garments on Him, and led Him away to crucify Him.","32":"As they went out, they found a man of Cyrene named Simon. They compelled him to carry His cross.","33":"When they came to a place called Golgotha, which means Place of a Skull,","34":"they gave Him wine mixed with gall to drink, but after tasting it He was unwilling to drink.","35":"After crucifying Him, they divided His garments by casting lots.","36":"And sitting down, they kept watch over Him there.","37":"Above His head they put the charge against Him, which read: “THIS IS JESUS, THE KING OF THE JEWS.”","38":"Then two robbers were crucified with Him, one on His right and one on His left.","39":"Those passing by blasphemed Him, shaking their heads","40":"and saying, “You who would destroy the temple and build it in three days, save Yourself! If You are the Son of God, come down from the cross!”","41":"In the same way the chief priests, with the scribes and elders, mocked Him, saying,","42":"“He saved others; He cannot save Himself. He is the King of Israel! Let Him come down now from the cross, and we will believe in Him.","43":"He trusted in God; let God rescue Him now, if He wants Him, for He said, ‘I am God’s Son.’”","44":"The robbers who were crucified with Him also insulted Him in the same way.","45":"From the sixth hour darkness came over all the land until the ninth hour.","46":"About the ninth hour Jesus cried out with a loud voice, saying, “Eli, Eli, lema sabachthani?” that is, “My God, My God, why have You forsaken Me?”","47":"When some of those standing there heard it, they said, “This man is calling Elijah.”","48":"Immediately one of them ran, took a sponge, filled it with sour wine, put it on a reed, and gave it to Him to drink.","49":"But the others said, “Leave Him alone. Let us see whether Elijah comes to save Him.”","50":"And Jesus cried out again with a loud voice and gave up His spirit.","51":"And behold, the curtain of the temple was torn in two from top to bottom, and the earth shook and the rocks were split.","52":"The tombs were opened, and many bodies of the saints who had fallen asleep were raised.","53":"Coming out of the tombs after His resurrection, they entered the holy city and appeared to many.","54":"When the centurion and those with him who were guarding Jesus saw the earthquake and what had happened, they were greatly afraid and said, “Truly this was God’s Son.”","55":"There were also many women there looking on from a distance, who had followed Jesus from Galilee, serving Him.","56":"Among them were Mary Magdalene, Mary the mother of James and Joseph, and the mother of the sons of Zebedee.","57":"When evening came, a rich man from Arimathea named Joseph came, who had also become a disciple of Jesus.","58":"He went to Pilate and asked for the body of Jesus. Then Pilate ordered it to be given to him.","59":"Joseph took the body and wrapped it in a clean linen cloth","60":"and laid it in his own new tomb, which he had cut in the rock. He rolled a large stone against the entrance of the tomb and went away.","61":"Mary Magdalene and the other Mary were there, sitting opposite the tomb.","62":"On the next day, which is after the day of preparation, the chief priests and Pharisees gathered before Pilate,","63":"saying, “Sir, we remember that while that deceiver was still alive he said, ‘After three days I will be raised.’","64":"Therefore command the tomb to be made secure until the third day, lest His disciples come and steal Him and tell the people, ‘He has been raised from the dead.’ Then the last deception will be worse than the first.”","65":"Pilate said to them, “You have a guard. Go, make it as secure as you know how.”","66":"So they went and made the tomb secure by sealing the stone and setting the guard."},"28":{"1":"After the Sabbath, as the first day of the week was dawning, Mary Magdalene and the other Mary came to see the tomb.","2":"And behold, there was a great earthquake, for an angel of the Lord descended from heaven, came, rolled away the stone, and sat on it.","3":"His appearance was like lightning, and his clothing white as snow.","4":"For fear of him, the guards trembled and became like dead men.","5":"But the angel answered the women, “Do not be afraid, for I know that you are looking for Jesus who was crucified.","6":"He is not here, for He has been raised, just as He said. Come, see the place where He was lying.","7":"And go quickly and tell His disciples, ‘He has been raised from the dead, and behold, He is going ahead of you into Galilee. There you will see Him.’ Behold, I have told you.”","8":"They left the tomb quickly with fear and great joy and ran to tell His disciples.","9":"And behold, Jesus met them and said, “Greetings!” They came to Him, took hold of His feet, and worshiped Him.","10":"Then Jesus said to them, “Do not be afraid. Go tell My brothers to go to Galilee, and there they will see Me.”","11":"While they were going, behold, some of the guard went into the city and reported to the chief priests everything that had happened.","12":"After gathering with the elders and taking counsel, they gave a large sum of money to the soldiers,","13":"saying, “Say, ‘His disciples came by night and stole Him while we were sleeping.’","14":"And if this comes to the governor’s ears, we will persuade him and keep you free from concern.”","15":"They took the money and did as they had been instructed, and this account has been widely spread among the Jews to this day.","16":"The eleven disciples went to Galilee, to the mountain where Jesus had directed them.","17":"When they saw Him, they worshiped Him, but some doubted.","18":"Jesus came and spoke to them, saying, “All authority in heaven and on earth has been given to Me.","19":"Therefore go and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit,","20":"teaching them to keep everything I commanded you. And behold, I am with you all the days until the completion of the age.”"}};

      out=out.slice(0,at)+rep+out.slice(at+safe.length);
    }
  }
  return out;
}
function refreshCoreAnnotation(ch,v,words){
  const k=KO[String(ch)]||{}, e=EN[String(ch)]||{};
  const ko=document.getElementById(`ko-${ch}-${v}`);
  const en=document.getElementById(`en-${ch}-${v}`);
  if(ko)ko.innerHTML=annotateCore(k[String(v)]||'',ch,v,'ko',words);
  if(en)en.innerHTML=annotateCore(e[String(v)]||'',ch,v,'en',words);
}


const KRV_URL='https://raw.githubusercontent.com/yuhwan/Bible-krv/master/%EB%A7%88%ED%83%9C%EB%B3%B5%EC%9D%8C.json';
const DARBY_BASE='https://dailybible.ca/api/';
let krvCache=null, krvLoading=null, darbyCache={};
let speechPaused=false;

function cleanBibleText(x){
  return String(x??'').replace(/\s+/g,' ').trim();
}
function putVerse(map,ch,v,text){
  ch=Number(ch); v=Number(v); text=cleanBibleText(text);
  if(!ch||!v||!text)return;
  if(!map[ch])map[ch]={};
  map[ch][v]=text;
}
function normalizeKrv(data){
  const out={};
  // Common flat/nested object forms.
  function walk(x,ctxCh=null){
    if(!x)return;
    if(Array.isArray(x)){
      x.forEach((it,i)=>{
        if(typeof it==='string' && ctxCh) putVerse(out,ctxCh,i+1,it);
        else walk(it,ctxCh);
      });
      return;
    }
    if(typeof x!=='object')return;
    const ch=x.chapter??x.ch??x.chapter_number??ctxCh;
    const v=x.verse??x.v??x.verse_number;
    const t=x.text??x.content??x.verse_text??x.body;
    if(ch!=null && v!=null && typeof t==='string')putVerse(out,ch,v,t);
    if(x.verses)walk(x.verses,ch);
    if(x.chapters)walk(x.chapters,null);
    for(const [k,val] of Object.entries(x)){
      if(['chapter','ch','chapter_number','verse','v','verse_number','text','content','verse_text','body','verses','chapters'].includes(k))continue;
      if(/^\d+$/.test(k)){
        const n=Number(k);
        if(ctxCh && typeof val==='string')putVerse(out,ctxCh,n,val);
        else if(!ctxCh && (Array.isArray(val)||typeof val==='object'))walk(val,n);
        else walk(val,ctxCh);
      } else if(typeof val==='object') walk(val,ctxCh);
    }
  }
  walk(data,null);
  return out;
}
async function getKrv(){
  if(krvCache)return krvCache;
  if(krvLoading)return krvLoading;
  krvLoading=withTimeout(KRV_URL,9000)
    .then(r=>{if(!r.ok)throw new Error('KRV HTTP '+r.status);return r.json();})
    .then(j=>krvCache=normalizeKrv(j))
    .finally(()=>{krvLoading=null});
  return krvLoading;
}
async function getDarbyChapter(ch){
  if(darbyCache[ch])return darbyCache[ch];
  const u=DARBY_BASE+'Matthew+'+ch+'?translation=darby';
  const j=await withTimeout(u,9000).then(r=>{if(!r.ok)throw new Error('Darby HTTP '+r.status);return r.json();});
  const out={};
  (j.verses||[]).forEach(x=>{if(x.verse!=null)out[Number(x.verse)]=cleanBibleText(x.text)});
  darbyCache[ch]=out;
  return out;
}
async function loadComparisons(ch){
  const tasks=[
    getKrv().then(k=>{
      if(currentChapter!==ch)return;
      document.querySelectorAll(`[id^="krv-${ch}-"]`).forEach(el=>{
        const v=Number(el.id.split('-')[2]);
        el.textContent=k[ch]?.[v]||'개역한글 본문을 찾지 못했습니다.';
        el.classList.remove('loadingtext');
      });
    }).catch(()=>{
      if(currentChapter!==ch)return;
      document.querySelectorAll(`[id^="krv-${ch}-"]`).forEach(el=>{
        el.textContent='개역한글 연결을 불러오지 못했습니다. 새로고침하면 다시 시도합니다.';
      });
    }),
    getDarbyChapter(ch).then(d=>{
      if(currentChapter!==ch)return;
      document.querySelectorAll(`[id^="darby-${ch}-"]`).forEach(el=>{
        const v=Number(el.id.split('-')[2]);
        el.textContent=d[v]||'Darby text not found for this verse.';
        el.classList.remove('loadingtext');
      });
    }).catch(()=>{
      if(currentChapter!==ch)return;
      document.querySelectorAll(`[id^="darby-${ch}-"]`).forEach(el=>{
        el.textContent='Darby connection could not be loaded. Refresh to try again.';
      });
    })
  ];
  await Promise.allSettled(tasks);
}

function speechTextFrom(el){
  if(!el)return '';
  const c=el.cloneNode(true);
  c.querySelectorAll('.core-gr').forEach(x=>x.remove());
  return cleanBibleText(c.textContent);
}
function chooseVoice(lang){
  const voices=speechSynthesis.getVoices();
  const prefix=lang.toLowerCase().split('-')[0];
  const same=voices.filter(v=>(v.lang||'').toLowerCase().startsWith(prefix));
  return same.find(v=>/female|samantha|zira|aria|jenny|susan|google.*female/i.test(v.name)) || same[0] || null;
}
let speechQueue=[], speechIndex=0, activeSpeechToken=0;

function resetSpeechUi(){
  speechPaused=false;
  const p=document.getElementById('pauseSpeech');
  if(p)p.textContent='⏸ Pause';
}

function speakQueueNext(token,lang){
  if(token!==activeSpeechToken || speechIndex>=speechQueue.length){
    resetSpeechUi();
    return;
  }
  const text=speechQueue[speechIndex++];
  if(!text){speakQueueNext(token,lang);return;}
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang; u.rate=1.0; u.pitch=1.0;
  const voice=chooseVoice(lang); if(voice)u.voice=voice;
  u.onend=()=>speakQueueNext(token,lang);
  u.onerror=(e)=>{
    // Some Android/Chrome builds reject very long utterances.
    // Continue to the next short verse segment instead of stopping the chapter.
    if(token===activeSpeechToken)speakQueueNext(token,lang);
  };
  speechSynthesis.speak(u);
}

function speakSegments(segments,lang='en-US'){
  if(!('speechSynthesis' in window))return;
  const list=(segments||[]).map(cleanBibleText).filter(Boolean);
  if(!list.length)return;
  speechSynthesis.cancel();
  activeSpeechToken++;
  speechQueue=list;
  speechIndex=0;
  resetSpeechUi();

  // Android Chrome sometimes reports voices asynchronously.
  const start=()=>{
    if(speechIndex===0 && speechQueue.length && activeSpeechToken>0){
      speakQueueNext(activeSpeechToken,lang);
    }
  };
  const voices=speechSynthesis.getVoices();
  if(voices.length) start();
  else {
    let started=false;
    const once=()=>{if(started)return;started=true;speechSynthesis.removeEventListener?.('voiceschanged',once);start();};
    speechSynthesis.addEventListener?.('voiceschanged',once);
    setTimeout(once,350);
  }
}

function speakText(text,lang='en-US'){
  speakSegments([text],lang);
}
function readVerse(ch,v,lang){
  const id=lang==='ko'?`ko-${ch}-${v}`:`en-${ch}-${v}`;
  speakText(speechTextFrom(document.getElementById(id)),lang==='ko'?'ko-KR':'en-US');
}
function readChapter(lang){
  const ch=currentChapter;
  const selector=lang==='ko'?`[id^="ko-${ch}-"]`:`[id^="en-${ch}-"]`;
  const segments=[...document.querySelectorAll(selector)].map(speechTextFrom).filter(Boolean);
  speakSegments(segments,lang==='ko'?'ko-KR':'en-US');
}
function togglePause(){
  if(!('speechSynthesis' in window)||!speechSynthesis.speaking)return;
  if(speechPaused){speechSynthesis.resume();speechPaused=false;this.textContent='⏸ Pause';}
  else{speechSynthesis.pause();speechPaused=true;this.textContent='▶ Resume';}
}
function stopSpeech(){
  activeSpeechToken++;
  speechQueue=[]; speechIndex=0;
  if('speechSynthesis' in window)speechSynthesis.cancel();
  resetSpeechUi();
}

function buildNav(){
  const nav=document.getElementById('nav');
  for(let ch=1;ch<=28;ch++){
    const b=document.createElement('button');
    b.type='button'; b.textContent='Matthew '+ch; b.dataset.ch=String(ch);
    b.addEventListener('click',()=>show(ch));
    nav.appendChild(b);
  }
}

function show(ch){
  stopSpeech();
  currentChapter=ch;
  document.getElementById('title').textContent='Matthew '+ch;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',Number(b.dataset.ch)===ch));
  const k=KO[String(ch)]||{}, e=EN[String(ch)]||{};
  const nums=[...new Set([...Object.keys(k),...Object.keys(e)])].map(Number).sort((a,b)=>a-b);
  let h='';
  for(const v of nums){
    h+=`<section class="verse"><div class="ref">Matthew ${ch}:${v}</div>
    <div class="label">Greek · SBLGNT</div><div class="greek" id="g-${ch}-${v}">헬라어 확인 중…</div>
    <div class="pron" id="p-${ch}-${v}"></div>
    <div class="label">나의 성경 — 한국어 원문 직역</div><div class="ko" id="ko-${ch}-${v}">${esc(k[String(v)]||'')}</div>
    <div class="label">개역한글</div><div class="compare krv loadingtext" id="krv-${ch}-${v}">불러오는 중…</div>
    <div class="label">My Bible — Greek-based Translation <button class="audio-btn" type="button" onclick="readVerse(${ch},${v},'en')">🔊</button></div><div class="en" id="en-${ch}-${v}">${esc(e[String(v)]||'')}</div>
    <div class="label">Darby Translation</div><div class="compare darby loadingtext" id="darby-${ch}-${v}">Loading…</div></section>`;
  }
  document.getElementById('reader').innerHTML=h;
  document.getElementById('status').textContent=`Matthew ${ch} · ${nums.length}절 · 내장 본문 표시 완료`;
  try{history.replaceState(null,'','#matthew'+ch)}catch(_e){}
  window.scrollTo(0,0);
  setTimeout(()=>loadGreek(ch),0);
  setTimeout(()=>loadComparisons(ch),0);
}

document.getElementById('readKoChapter').addEventListener('click',()=>readChapter('ko'));
document.getElementById('readEnChapter').addEventListener('click',()=>readChapter('en'));
document.getElementById('pauseSpeech').addEventListener('click',togglePause);
document.getElementById('stopSpeech').addEventListener('click',stopSpeech);
window.addEventListener('beforeunload',stopSpeech);
document.getElementById('dictClose').addEventListener('click',closeDict);
document.getElementById('dictBackdrop').addEventListener('click',e=>{if(e.target.id==='dictBackdrop')closeDict();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDict();});
buildNav();
const m=location.hash.match(/matthew(2[0-8]|1[0-9]|[1-9])/);
show(m?Number(m[1]):1);
</script>

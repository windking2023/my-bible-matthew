 the accuser hand you over to the judge, and the judge to the guard, and you be thrown into prison.","26":"Truly I tell you, you will certainly not come out from there until you have paid the last penny.","27":"You heard that it was said, ‘You shall not commit adultery.’","28":"But I tell you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart.","29":"And if your right eye causes you to stumble, tear it out and throw it from you; for it is better for you that one of your members perish than that your whole body be thrown into Gehenna.","30":"And if your right hand causes you to stumble, cut it off and throw it from you; for it is better for you that one of your members perish than that your whole body go into Gehenna.","31":"It was also said, ‘Whoever divorces his wife, let him give her a certificate of divorce.’","32":"But I tell you that everyone who divorces his wife, except on account of sexual immorality, makes her commit adultery; and whoever marries a divorced woman commits adultery.","33":"Again, you heard that it was said to the ancients, ‘You shall not swear falsely, but shall fulfill your oaths to the Lord.’","34":"But I tell you not to swear at all: neither by heaven, because it is the throne of God;","35":"nor by the earth, because it is the footstool of His feet; nor by Jerusalem, because it is the city of the great King.","36":"Nor shall you swear by your head, because you cannot make one hair white or black.","37":"But let your word be ‘Yes, yes,’ ‘No, no.’ Anything beyond these is from evil [or: from the evil one].","38":"You heard that it was said, ‘An eye for an eye and a tooth for a tooth.’","39":"But I tell you not to retaliate against an evil person. Rather, whoever strikes you on your right cheek, turn the other to him also.","40":"And to the one who wants to sue you and take your tunic, let him have your cloak also.","41":"And whoever compels you to go one mile, go with him two.","42":"Give to the one who asks you, and do not turn away from the one who wants to borrow from you.","43":"You heard that it was said, ‘You shall love your neighbor and hate your enemy.’","44":"But I tell you: love your enemies and pray for those who persecute you,","45":"so that you may become sons of your Father who is in the heavens; for He makes His sun rise on evil and good people and sends rain on righteous and unrighteous people.","46":"For if you love those who love you, what reward do you have? Do not even the tax collectors do the same?","47":"And if you greet only your brothers, what extraordinary thing are you doing? Do not even the Gentiles do the same?","48":"Therefore you shall be perfect [also: complete, mature, whole], as your heavenly Father is perfect."},"6":{"1":"Be careful not to practice your righteousness before people in order to be seen by them; otherwise you have no reward with your Father who is in the heavens.","2":"Therefore when you give to the needy, do not sound a trumpet before you as the hypocrites do in the synagogues and streets so that they may be glorified by people. Truly I tell you, they have received their reward in full.","3":"But when you give to the needy, do not let your left hand know what your right hand is doing,","4":"so that your giving may be in secret; and your Father who sees in secret will repay you.","5":"And when you pray, you shall not be like the hypocrites, for they love to stand and pray in the synagogues and at the street corners so that they may be seen by people. Truly I tell you, they have received their reward in full.","6":"But when you pray, enter your inner room, shut your door, and pray to your Father who is in secret; and your Father who sees in secret will repay you.","7":"And when you pray, do not babble repetitively like the Gentiles, for they think that in their many words they will be heard.","8":"Therefore do not be like them, for your Father knows what you need before you ask Him.","9":"Therefore pray in this way: ‘Our Father who is in the heavens, let Your name be sanctified.","10":"Let Your kingdom come. Let Your will be done, as in heaven, so also on earth.","11":"Give us today our necessary bread [also: bread for today; bread for the coming day],","12":"and forgive us our debts, as we also have forgiven our debtors,","13":"and do not bring us into temptation [also: testing], but deliver us from evil [or: the evil one].’","14":"For if you forgive people their trespasses, your heavenly Father will also forgive you.","15":"But if you do not forgive people, neither will your Father forgive your trespasses.","16":"And when you fast, do not become gloomy like the hypocrites, for they disfigure their faces so that their fasting may be seen by people. Truly I tell you, they have received their reward in full.","17":"But when you fast, anoint your head and wash your face,","18":"so that your fasting may not be seen by people but by your Father who is in secret; and your Father who sees in secret will repay you.","19":"Do not store up for yourselves treasures on earth, where moth and corrosion destroy and where thieves break in and steal.","20":"But store up for yourselves treasures in heaven, where neither moth nor corrosion destroys and where thieves do not break in or steal.","21":"For where your treasure is, there your heart will be also.","22":"The lamp of the body is the eye. Therefore if your eye is clear [also: single, sincere, generous], your whole body will be full of light.","23":"But if your eye is bad, your whole body will be dark. Therefore if the light in you is darkness, how great is the darkness!","24":"No one can serve two masters, for either he will hate the one and love the other, or he will be devoted to one and despise the other. You cannot serve God and mammon.","25":"Therefore I tell you, do not be anxious about your life, what you will eat or what you will drink, nor about your body, what you will wear. Is not life more than food and the body more than clothing?","26":"Look at the birds of heaven: they neither sow nor reap nor gather into barns, and your heavenly Father feeds them. Are you not worth much more than they?","27":"And which of you by being anxious can add one cubit to his lifespan [or: stature]?","28":"And why are you anxious about clothing? Consider carefully how the lilies of the field grow: they neither labor nor spin.","29":"Yet I tell you that not even Solomon in all his glory was clothed like one of these.","30":"But if God so clothes the grass of the field, which is here today and tomorrow is thrown into an oven, will He not much more clothe you, you of little faith?","31":"Therefore do not be anxious, saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’","32":"For the Gentiles eagerly seek all these things, and your heavenly Father knows that you need them all.","33":"But seek first His kingdom and His righteousness, and all these things will be added to you.","34":"Therefore do not be anxious about tomorrow, for tomorrow will be anxious for itself. Sufficient for the day is its own trouble."},"7":{"1":"Do not judge, so that you may not be judged.","2":"For with the judgment you judge, you will be judged; and with the measure you measure, it will be measured to you.","3":"And why do you see the speck in your brother’s eye but do not notice the beam in your own eye?","4":"Or how will you say to your brother, ‘Let me remove the speck from your eye,’ and look, the beam is in your eye?","5":"Hypocrite! First remove the beam from your own eye, and then you will see clearly to remove the speck from your brother’s eye.","6":"Do not give what is holy to dogs, nor throw your pearls before pigs, lest they trample them with their feet and turn and tear you apart.","7":"Ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.","8":"For everyone who asks receives, and the one who seeks finds, and to the one who knocks it will be opened.","9":"Or what person among you, if his son asks him for bread, will give him a stone?","10":"Or if he asks for a fish, will give him a snake?","11":"Therefore if you, being evil, know how to give good gifts to your children, how much more will your Father who is in the heavens give good things to those who ask Him!","12":"Therefore, whatever you want people to do to you, do the same also to them; for this is the Law and the Prophets.","13":"Enter through the narrow gate, for wide is the gate and broad is the way that leads to destruction, and many are those who enter through it.","14":"For narrow is the gate and constricted is the way that leads to life, and few are those who find it.","15":"Beware of false prophets, who come to you in sheep’s clothing but inwardly are ravenous wolves.","16":"You will know them by their fruits. Do people gather grapes from thorns or figs from thistles?","17":"In the same way, every good tree produces good fruit, but the bad tree produces bad fruit.","18":"A good tree cannot produce bad fruit, nor can a bad tree produce good fruit.","19":"Every tree not producing good fruit is cut down and thrown into the fire.","20":"Therefore you will know them by their fruits.","21":"Not everyone who says to Me, ‘Lord, Lord,’ will enter the kingdom of the heavens, but the one who does the will of My Father who is in the heavens.","22":"Many will say to Me in that day, ‘Lord, Lord, did we not prophesy in Your name, and in Your name cast out demons, and in Your name do many works of power?’","23":"And then I will declare to them, ‘I never knew you. Depart from Me, you workers of lawlessness.’","24":"Therefore everyone who hears these words of Mine and does them will be like a wise man who built his house on the rock.","25":"And the rain came down, the floods came, and the winds blew and beat against that house, and it did not fall, for it had been founded on the rock.","26":"And everyone who hears these words of Mine and does not do them will be like a foolish man who built his house on the sand.","27":"And the rain came down, the floods came, and the winds blew and struck that house, and it fell, and great was its fall.","28":"And when Jesus finished these words, the crowds were astonished at His teaching,","29":"for He was teaching them as one having authority, and not as their scribes."},
8:{"1": "When He came down from the mountain, large crowds followed Him.", "2": "And behold, a leper came to Him and bowed before Him, saying, “Lord, if You are willing, You are able to cleanse me.”", "3": "And stretching out His hand, He touched him, saying, “I am willing. Be cleansed.” And immediately his leprosy was cleansed.", "4": "And Jesus said to him, “See that you tell no one. But go, show yourself to the priest, and offer the gift that Moses commanded, as a testimony to them.”", "5": "When He entered Capernaum, a centurion came to Him, pleading with Him", "6": "and saying, “Lord, my servant is lying paralyzed in the house, suffering terribly.”", "7": "And He said to him, “I will come and heal him.”", "8": "But the centurion answered, “Lord, I am not worthy for You to come under my roof. But only speak a word, and my servant will be healed.", "9": "For I too am a man under authority, having soldiers under me. I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.”", "10": "When Jesus heard this, He marveled and said to those following Him, “Truly I say to you, with no one in Israel have I found such great faith.", "11": "And I say to you that many will come from east and west and recline at table with Abraham and Isaac and Jacob in the kingdom of the heavens,", "12": "but the sons of the kingdom will be cast into the outer darkness. There will be weeping and gnashing of teeth.”", "13": "Then Jesus said to the centurion, “Go; let it be done for you as you have believed.” And his servant was healed in that hour.", "14": "When Jesus came into Peter’s house, He saw his mother-in-law lying sick with a fever.", "15": "He touched her hand, and the fever left her; and she arose and served Him.", "16": "When evening came, they brought to Him many who were demon-possessed. He cast out the spirits with a word and healed all who were sick,", "17": "so that what was spoken through Isaiah the prophet might be fulfilled: “He Himself took our weaknesses and bore our diseases.”", "18": "When Jesus saw a crowd around Him, He gave orders to go to the other side.", "19": "And a scribe came and said to Him, “Teacher, I will follow You wherever You go.”", "20": "Jesus said to him, “The foxes have dens and the birds of heaven have nests, but the Son of Man has nowhere to lay His head.”", "21": "Another of the disciples said to Him, “Lord, permit me first to go and bury my father.”", "22": "But Jesus said to him, “Follow Me, and let the dead bury their own dead.”", "23": "And when He got into the boat, His disciples followed Him.", "24": "And behold, a great storm arose on the sea, so that the boat was being covered by the waves; but He was sleeping.", "25": "They came and awakened Him, saying, “Lord, save us! We are perishing!”", "26": "And He said to them, “Why are you afraid, you of little faith?” Then He arose and rebuked the winds and the sea, and there was a great calm.", "27": "And the men marveled, saying, “What kind of man is this, that even the winds and the sea obey Him?”", "28": "When He came to the other side, into the region of the Gadarenes, two demon-possessed men coming out of the tombs met Him. They were extremely violent, so that no one was able to pass by that way.", "29": "And behold, they cried out, saying, “What do we have to do with You, Son of God? Have You come here to torment us before the appointed time?”", "30": "Now a large herd of pigs was feeding at some distance from them.", "31": "And the demons pleaded with Him, saying, “If You cast us out, send us into the herd of pigs.”", "32": "And He said to them, “Go.” So they came out and went into the pigs. And behold, the whole herd rushed down the steep slope into the sea and died in the waters.", "33": "Those tending them fled, went into the city, and reported everything, including what had happened to the demon-possessed men.", "34": "And behold, the whole city came out to meet Jesus. When they saw Him, they pleaded with Him to depart from their region."},
9:{"1": "And getting into a boat, He crossed over and came to His own city.", "2": "And behold, they brought to Him a paralyzed man lying on a bed. Seeing their faith, Jesus said to the paralyzed man, “Take courage, child; your sins are forgiven.”", "3": "And behold, some of the scribes said among themselves, “This man blasphemes.”", "4": "Knowing their thoughts, Jesus said, “Why do you think evil things in your hearts?", "5": "For which is easier, to say, ‘Your sins are forgiven,’ or to say, ‘Rise and walk’?", "6": "But so that you may know that the Son of Man has authority on earth to forgive sins”—then He said to the paralyzed man—“Rise, take up your bed, and go to your house.”", "7": "And he rose and went to his house.", "8": "When the crowds saw this, they were afraid and glorified God, who had given such authority to human beings.", "9": "As Jesus passed on from there, He saw a man called Matthew sitting at the tax booth, and He said to him, “Follow Me.” And he rose and followed Him.", "10": "And as Jesus reclined at table in the house, behold, many tax collectors and sinners came and reclined with Jesus and His disciples.", "11": "When the Pharisees saw this, they said to His disciples, “Why does your Teacher eat with tax collectors and sinners?”", "12": "But when He heard it, He said, “Those who are healthy have no need of a physician, but those who are sick do.", "13": "Go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous, but sinners.”", "14": "Then the disciples of John came to Him, saying, “Why do we and the Pharisees fast, but Your disciples do not fast?”", "15": "And Jesus said to them, “Can the wedding guests mourn while the bridegroom is with them? But days will come when the bridegroom is taken away from them, and then they will fast.", "16": "No one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment and a worse tear results.", "17": "Nor do they put new wine into old wineskins. Otherwise the wineskins burst, the wine is poured out, and the wineskins are ruined. But they put new wine into fresh wineskins, and both are preserved.”", "18": "While He was saying these things to them, behold, a ruler came and bowed before Him, saying, “My daughter has just died. But come and lay Your hand on her, and she will live.”", "19": "And Jesus rose and followed him, and so did His disciples.", "20": "And behold, a woman suffering from a flow of blood for twelve years came up behind Him and touched the fringe of His garment.", "21": "For she was saying to herself, “If only I touch His garment, I will be saved.”", "22": "But Jesus turned, saw her, and said, “Take courage, daughter; your faith has saved you.” And the woman was healed from that hour.", "23": "When Jesus came into the ruler’s house and saw the flute players and the crowd making a commotion,", "24": "He said, “Go away, for the girl has not died but is sleeping.” And they laughed at Him.", "25": "But when the crowd had been put outside, He went in and took her by the hand, and the girl arose.", "26": "And the report of this went out into that whole region.", "27": "As Jesus passed on from there, two blind men followed Him, crying out, “Have mercy on us, Son of David!”", "28": "When He entered the house, the blind men came to Him. And Jesus said to them, “Do you believe that I am able to do this?” They said to Him, “Yes, Lord.”", "29": "Then He touched their eyes, saying, “Let it be done to you according to your faith.”", "30": "And their eyes were opened. Jesus sternly warned them, saying, “See that no one knows it.”", "31": "But they went out and spread the report about Him throughout that whole region.", "32": "As they were going out, behold, they brought to Him a demon-possessed man who could not speak.", "33": "And when the demon had been cast out, the mute man spoke. The crowds marveled, saying, “Never has anything like this appeared in Israel.”", "34": "But the Pharisees said, “By the ruler of the demons He casts out the demons.”", "35": "And Jesus went throughout all the cities and villages, teaching in their synagogues, proclaiming the gospel of the kingdom, and healing every disease and every sickness.", "36": "Seeing the crowds, He was moved with compassion for them, because they were harassed and cast down, like sheep without a shepherd.", "37": "Then He said to His disciples, “The harvest is plentiful, but the workers are few.", "38": "Therefore ask the Lord of the harvest to send out workers into His harvest.”"},
10:{"1": "Calling His twelve disciples to Him, He gave them authority over unclean spirits, to cast them out and to heal every disease and every sickness.", "2": "Now the names of the twelve apostles are these: first Simon, who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother;", "3": "Philip and Bartholomew; Thomas and Matthew the tax collector; James the son of Alphaeus, and Thaddaeus;", "4": "Simon the Cananaean, and Judas Iscariot, who also handed Him over.", "5": "These twelve Jesus sent out, instructing them, saying, “Do not go into a way of the Gentiles, and do not enter a city of the Samaritans.", "6": "But go rather to the lost sheep of the house of Israel.", "7": "And as you go, proclaim, saying, ‘The kingdom of the heavens has drawn near.’", "8": "Heal the sick, raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.", "9": "Do not acquire gold or silver or copper for your belts,", "10": "no bag for the journey, nor two tunics, nor sandals, nor a staff; for the worker is worthy of his food.", "11": "Whatever city or village you enter, find out who in it is worthy, and stay there until you leave.", "12": "As you enter the house, greet it.", "13": "And if the house is worthy, let your peace come upon it; but if it is not worthy, let your peace return to you.", "14": "And whoever does not receive you or listen to your words, as you go out of that house or city, shake the dust off your feet.", "15": "Truly I say to you, it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that city.", "16": "Behold, I send you out as sheep in the midst of wolves. Therefore be wise as serpents and innocent as doves.", "17": "But beware of people, for they will hand you over to councils and flog you in their synagogues.", "18": "And you will be brought before governors and kings because of Me, as a testimony to them and to the Gentiles.", "19": "But when they hand you over, do not be anxious about how or what you should speak, for what you should speak will be given to you in that hour.", "20": "For it is not you who speak, but the Spirit of your Father speaking in you.", "21": "Brother will hand over brother to death, and a father his child; and children will rise up against parents and put them to death.", "22": "And you will be hated by all because of My name. But the one who endures to the end will be saved.", "23": "When they persecute you in this city, flee to another. For truly I say to you, you will certainly not finish going through the cities of Israel until the Son of Man comes.", "24": "A disciple is not above the teacher, nor a servant above his master.", "25": "It is enough for the disciple to become like his teacher and the servant like his master. If they have called the master of the house Beelzebul, how much more those of his household!", "26": "Therefore do not fear them, for nothing is covered that will not be revealed, and nothing hidden that will not be made known.", "27": "What I say to you in the darkness, speak in the light; and what you hear in the ear, proclaim on the housetops.", "28": "And do not fear those who kill the body but are unable to kill the soul. Rather fear the One who is able to destroy both soul and body in Gehenna.", "29": "Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father.", "30": "But even the hairs of your head are all numbered.", "31": "Therefore do not fear; you are worth more than many sparrows.", "32": "Therefore everyone who acknowledges Me before people, I also will acknowledge before My Father who is in the heavens.", "33": "But whoever denies Me before people, I also will deny before My Father who is in the heavens.", "34": "Do not think that I came to bring peace upon the earth. I did not come to bring peace, but a sword.", "35": "For I came to set a man against his father, a daughter against her mother, and a daughter-in-law against her mother-in-law;", "36": "and a person’s enemies will be those of his own household.", "37": "The one who loves father or mother more than Me is not worthy of Me, and the one who loves son or daughter more than Me is not worthy of Me.", "38": "And the one who does not take his cross and follow after Me is not worthy of Me.", "39": "The one who finds his life will lose it, and the one who loses his life because of Me will find it.", "40": "The one who receives you receives Me, and the one who receives Me receives the One who sent Me.", "41": "The one who receives a prophet in the name of a prophet will receive a prophet’s reward, and the one who receives a righteous person in the name of a righteous person will receive a righteous person’s reward.", "42": "And whoever gives one of these little ones even a cup of cold water to drink in the name of a disciple, truly I say to you, he will certainly not lose his reward.”"},
11:{"1": "When Jesus had finished instructing His twelve disciples, He departed from there to teach and proclaim in their cities.", "2": "Now when John heard in prison about the works of the Christ, he sent word through his disciples", "3": "and said to Him, “Are You the One who is coming, or should we wait for another?”", "4": "Jesus answered them, “Go and report to John what you hear and see:", "5": "the blind see, the lame walk, lepers are cleansed, the deaf hear, the dead are raised, and the poor have good news proclaimed to them.", "6": "And blessed is anyone who does not stumble because of Me.”", "7": "As they were leaving, Jesus began to speak to the crowds concerning John: “What did you go out into the wilderness to see? A reed shaken by the wind?", "8": "But what did you go out to see? A man dressed in soft clothing? Behold, those who wear soft clothing are in kings’ houses.", "9": "But what did you go out to see? A prophet? Yes, I tell you, and more than a prophet.", "10": "This is the one about whom it is written, ‘Behold, I send My messenger before Your face, who will prepare Your way before You.’", "11": "Truly I say to you, among those born of women no one greater than John the Baptist has arisen; yet the one who is smaller in the kingdom of the heavens is greater than he.", "12": "From the days of John the Baptist until now, the kingdom of the heavens advances forcefully [or: suffers violence], and forceful people seize it [or: violent people take it by force].", "13": "For all the prophets and the Law prophesied until John.", "14": "And if you are willing to receive it, he is Elijah who is to come.", "15": "The one who has ears, let him hear.", "16": "But to what shall I compare this generation? It is like children sitting in the marketplaces who call to the others", "17": "and say, ‘We played the flute for you, and you did not dance; we mourned, and you did not beat your breasts.’", "18": "For John came neither eating nor drinking, and they say, ‘He has a demon.’", "19": "The Son of Man came eating and drinking, and they say, ‘Behold, a glutton and a wine drinker, a friend of tax collectors and sinners!’ Yet wisdom is shown to be right by her works.”", "20": "Then He began to reproach the cities in which most of His mighty works had been done, because they did not repent.", "21": "“Woe to you, Chorazin! Woe to you, Bethsaida! For if the mighty works done in you had been done in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.", "22": "But I tell you, it will be more bearable for Tyre and Sidon on the day of judgment than for you.", "23": "And you, Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had been done in Sodom, it would have remained until today.", "24": "But I tell you that it will be more bearable for the land of Sodom on the day of judgment than for you.”", "25": "At that time Jesus answered and said, “I praise You, Father, Lord of heaven and earth, because You hid these things from the wise and understanding and revealed them to little children.", "26": "Yes, Father, for this was pleasing before You.", "27": "All things have been handed over to Me by My Father. No one fully knows the Son except the Father, nor does anyone fully know the Father except the Son and anyone to whom the Son chooses to reveal Him.", "28": "Come to Me, all who labor and are burdened, and I will give you rest.", "29": "Take My yoke upon you and learn from Me, for I am gentle and humble in heart, and you will find rest for your souls.", "30": "For My yoke is easy [also: kind, well-fitting], and My burden is light.”"},
12:{"1": "At that time Jesus went through the grainfields on the Sabbath. His disciples became hungry and began to pluck heads of grain and eat.", "2": "When the Pharisees saw it, they said to Him, “Behold, Your disciples are doing what is not lawful to do on the Sabbath.”", "3": "But He said to them, “Have you not read what David did when he and those with him were hungry?", "4": "He entered the house of God and ate the bread of the Presence, which it was not lawful for him or those with him to eat, but only for the priests.", "5": "Or have you not read in the Law that on the Sabbath the priests in the temple profane the Sabbath and are guiltless?", "6": "But I tell you that something greater than the temple is here.", "7": "If you had known what this means, ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.", "8": "For the Son of Man is Lord of the Sabbath.”", "9": "Departing from there, He went into their synagogue.", "10": "And behold, there was a man with a withered hand. They asked Him, “Is it lawful to heal on the Sabbath?” so that they might accuse Him.", "11": "He said to them, “What man among you, having one sheep, if it falls into a pit on the Sabbath, will not take hold of it and lift it out?", "12": "How much more valuable, then, is a human being than a sheep! Therefore it is lawful to do good on the Sabbath.”", "13": "Then He said to the man, “Stretch out your hand.” He stretched it out, and it was restored, healthy like the other.", "14": "But the Pharisees went out and took counsel against Him as to how they might destroy Him.", "15": "Jesus, knowing this, withdrew from there. Many followed Him, and He healed them all", "16": "and warned them not to make Him known.", "17": "This was so that what was spoken through Isaiah the prophet might be fulfilled:", "18": "“Behold My servant whom I chose, My beloved in whom My soul delights. I will put My Spirit upon Him, and He will proclaim justice to the Gentiles.", "19": "He will not quarrel or cry out, nor will anyone hear His voice in the streets.", "20": "A bruised reed He will not break, and a smoldering wick He will not extinguish, until He brings justice to victory.", "21": "And in His name the Gentiles will hope.”", "22": "Then a demon-possessed man who was blind and mute was brought to Him, and He healed him, so that the mute man spoke and saw.", "23": "All the crowds were amazed and said, “Can this be the Son of David?”", "24": "But when the Pharisees heard it, they said, “This man does not cast out demons except by Beelzebul, ruler of the demons.”", "25": "Knowing their thoughts, He said to them, “Every kingdom divided against itself is laid waste, and every city or house divided against itself will not stand.", "26": "And if Satan casts out Satan, he is divided against himself. How then will his kingdom stand?", "27": "And if I cast out demons by Beelzebul, by whom do your sons cast them out? Therefore they will be your judges.", "28": "But if I cast out demons by the Spirit of God, then the kingdom of God has come upon you.", "29": "Or how can someone enter the strong man’s house and plunder his possessions unless he first binds the strong man? Then he will plunder his house.", "30": "The one who is not with Me is against Me, and the one who does not gather with Me scatters.", "31": "Therefore I tell you, every sin and blasphemy will be forgiven people, but blasphemy against the Spirit will not be forgiven.", "32": "And whoever speaks a word against the Son of Man will be forgiven; but whoever speaks against the Holy Spirit will not be forgiven, either in this age or in the age to come.", "33": "Either make the tree good and its fruit good, or make the tree bad and its fruit bad, for the tree is known by its fruit.", "34": "Offspring of vipers! How can you, being evil, speak good things? For out of the abundance of the heart the mouth speaks.", "35": "The good person brings good things out of the good treasure, and the evil person brings evil things out of the evil treasure.", "36": "But I tell you that for every useless word people speak, they will give an account on the day of judgment.", "37": "For by your words you will be justified, and by your words you will be condemned.”", "38": "Then some of the scribes and Pharisees answered Him, saying, “Teacher, we want to see a sign from You.”", "39": "But He answered them, “An evil and adulterous generation seeks a sign, and no sign will be given to it except the sign of Jonah the prophet.", "40": "For just as Jonah was in the belly of the great fish three days and three nights, so the Son of Man will be in the heart of the earth three days and three nights.", "41": "The men of Nineveh will rise up at the judgment with this generation and condemn it, because they repented at the proclamation of Jonah; and behold, something greater than Jonah is here.", "42": "The queen of the South will rise up at the judgment with this generation and condemn it, because she came from the ends of the earth to hear the wisdom of Solomon; and behold, something greater than Solomon is here.", "43": "When the unclean spirit goes out from a person, it passes through waterless places seeking rest and does not find it.", "44": "Then it says, ‘I will return to my house from which I came.’ And when it comes, it finds it empty, swept, and put in order.", "45": "Then it goes and takes with it seven other spirits more evil than itself, and they enter and dwell there; and the last state of that person becomes worse than the first. So also will it be with this evil generation.”", "46": "While He was still speaking to the crowds, behold, His mother and brothers stood outside, seeking to speak to Him.", "47": "[Some manuscripts include: Someone said to Him, “Behold, Your mother and Your brothers are standing outside, seeking to speak to You.”]", "48": "But He answered the one speaking to Him, “Who is My mother, and who are My brothers?”", "49": "And stretching out His hand toward His disciples, He said, “Behold My mother and My brothers!", "50": "For whoever does the will of My Father who is in the heavens, that person is My brother and sister and mother.”"},
13:{"1": "That day Jesus went out of the house and sat beside the sea.", "2": "And large crowds gathered around Him, so that He got into a boat and sat down, while the whole crowd stood on the shore.", "3": "And He spoke many things to them in parables, saying, “Behold, the sower went out to sow.", "4": "And as he sowed, some seeds fell beside the road, and the birds came and devoured them.", "5": "Others fell on rocky places where they did not have much soil, and immediately they sprang up because they had no depth of soil.", "6": "But when the sun rose, they were scorched; and because they had no root, they withered away.", "7": "Others fell among the thorns, and the thorns came up and choked them.", "8": "But others fell on the good soil and produced fruit, some a hundredfold, some sixty, and some thirty.", "9": "The one who has ears, let him hear.”", "10": "And the disciples came and said to Him, “Why do You speak to them in parables?”", "11": "He answered them, “To you it has been given to know the mysteries of the kingdom of the heavens, but to them it has not been given.", "12": "For whoever has, more will be given, and he will have abundance; but whoever does not have, even what he has will be taken away from him.", "13": "Therefore I speak to them in parables, because seeing they do not see, and hearing they do not hear or understand.", "14": "And in them the prophecy of Isaiah is fulfilled, which says, ‘You will indeed hear but never understand, and you will indeed see but never perceive.", "15": "For the heart of this people has become dull; with their ears they have heard heavily, and they have closed their eyes, lest they should see with their eyes, hear with their ears, understand with their heart, turn, and I would heal them.’", "16": "But blessed are your eyes because they see, and your ears because they hear.", "17": "For truly I say to you, many prophets and righteous people desired to see what you see and did not see it, and to hear what you hear and did not hear it.", "18": "You, therefore, hear the parable of the sower.", "19": "When anyone hears the word of the kingdom and does not understand it, the evil one comes and snatches away what was sown in his heart. This is the one sown beside the road.", "20": "The one sown on rocky places is the one who hears the word and immediately receives it with joy,", "21": "yet he has no root in himself but lasts only for a time; and when affliction or persecution arises because of the word, immediately he stumbles.", "22": "The one sown among the thorns is the one who hears the word, but the anxiety of this age and the deceitfulness of riches choke the word, and it becomes unfruitful.", "23": "But the one sown on the good soil is the one who hears the word and understands it, who indeed bears fruit and produces, one a hundredfold, another sixty, and another thirty.”", "24": "He set another parable before them, saying, “The kingdom of the heavens may be compared to a man who sowed good seed in his field.", "25": "But while people were sleeping, his enemy came and sowed weeds among the wheat and went away.", "26": "When the plants sprouted and produced fruit, then the weeds also appeared.", "27": "The servants of the master of the house came and said to him, ‘Master, did you not sow good seed in your field? Where then did the weeds come from?’", "28": "He said to them, ‘An enemy did this.’ The servants said to him, ‘Then do you want us to go and gather them?’", "29": "But he said, ‘No, lest in gathering the weeds you uproot the wheat along with them.", "30": "Let both grow together until the harvest; and at harvest time I will tell the reapers: Gather the weeds first and bind them in bundles to burn them, but gather the wheat into my barn.’”", "31": "He set another parable before them, saying, “The kingdom of the heavens is like a mustard seed that a man took and sowed in his field.", "32": "It is smaller than all the seeds, but when it has grown it is larger than the garden plants and becomes a tree, so that the birds of heaven come and nest in its branches.”", "33": "He spoke another parable to them: “The kingdom of the heavens is like leaven that a woman took and hid in three measures of flour until all of it was leavened.”", "34": "Jesus spoke all these things to the crowds in parables, and apart from a parable He spoke nothing to them.", "35": "This was so that what was spoken through the prophet might be fulfilled: “I will open My mouth in parables; I will utter things hidden from the foundation of the world.”", "36": "Then He left the crowds and went into the house. His disciples came to Him, saying, “Explain to us the parable of the weeds of the field.”", "37": "He answered, “The one who sows the good seed is the Son of Man.", "38": "The field is the world, and the good seed—these are the sons of the kingdom; the weeds are the sons of the evil one.", "39": "The enemy who sowed them is the devil, the harvest is the completion of the age, and the reapers are angels.", "40": "Therefore, just as the weeds are gathered and burned with fire, so it will be at the completion of the age.", "41": "The Son of Man will send His angels, and they will gather out of His kingdom all causes of stumbling and those who practice lawlessness,", "42": "and they will throw them into the furnace of fire. There will be weeping and gnashing of teeth.", "43": "Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.", "44": "The kingdom of the heavens is like treasure hidden in a field, which a man found and hid again; and from his joy he goes and sells all that he has and buys that field.", "45": "Again, the kingdom of the heavens is like a merchant seeking fine pearls.", "46": "When he found one pearl of great value, he went and sold all that he had and bought it.", "47": "Again, the kingdom of the heavens is like a net cast into the sea and gathering every kind.", "48": "When it was full, they drew it up on the shore, sat down, gathered the good into containers, but threw the bad away.", "49": "So it will be at the completion of the age. The angels will go out and separate the evil from among the righteous", "50": "and throw them into the furnace of fire. There will be weeping and gnashing of teeth.", "51": "“Have you understood all these things?” They said to Him, “Yes.”", "52": "And He said to them, “Therefore every scribe who has become a disciple for the kingdom of the heavens is like a master of a house who brings out of his treasure things new and old.”", "53": "When Jesus had finished these parables, He departed from there.", "54": "And coming to His hometown, He taught them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these mighty works?", "55": "Is this not the carpenter’s son? Is not His mother called Mary, and His brothers James and Joseph and Simon and Judas?", "56": "And are not all His sisters with us? Where then did this man get all these things?”", "57": "And they stumbled because of Him. But Jesus said to them, “A prophet is not without honor except in his hometown and in his own household.”", "58": "And He did not do many mighty works there because of their unbelief."},
14:{"1": "At that time Herod the tetrarch heard the report about Jesus", "2": "and said to his servants, “This is John the Baptist. He has been raised from the dead, and therefore these powers are at work in him.”", "3": "For Herod had seized John, bound him, and put him in prison because of Herodias, the wife of Philip his brother.", "4": "For John had been saying to him, “It is not lawful for you to have her.”", "5": "And though he wanted to kill him, he feared the crowd because they regarded John as a prophet.", "6": "But when Herod’s birthday came, the daughter of Herodias danced in their midst and pleased Herod,", "7": "so that with an oath he promised to give her whatever she asked.", "8": "Prompted by her mother, she said, “Give me here on a platter the head of John the Baptist.”", "9": "And the king was grieved, but because of his oaths and those reclining at table with him, he commanded it to be given.", "10": "And he sent and had John beheaded in the prison.", "11": "His head was brought on a platter and given to the girl, and she brought it to her mother.", "12": "And his disciples came, took the body, and buried it; then they went and told Jesus.", "13": "When Jesus heard this, He withdrew from there in a boat to a deserted place by Himself. When the crowds heard it, they followed Him on foot from the cities.", "14": "When He came out, He saw a large crowd, was moved with compassion for them, and healed their sick.", "15": "When evening came, the disciples came to Him, saying, “This place is deserted and the hour is already late. Send the crowds away so that they may go into the villages and buy food for themselves.”", "16": "But Jesus said to them, “They have no need to go away. You give them something to eat.”", "17": "They said to Him, “We have nothing here except five loaves and two fish.”", "18": "And He said, “Bring them here to Me.”", "19": "Then He ordered the crowds to sit down on the grass. Taking the five loaves and the two fish, looking up to heaven, He blessed them; and breaking the loaves, He gave them to the disciples, and the disciples gave them to the crowds.", "20": "And they all ate and were satisfied. They picked up what remained of the broken pieces—twelve baskets full.", "21": "Those who ate were about five thousand men, besides women and children.", "22": "Immediately He compelled the disciples to get into the boat and go ahead of Him to the other side, while He sent the crowds away.", "23": "After sending the crowds away, He went up on the mountain by Himself to pray. When evening came, He was there alone.", "24": "But the boat was already many stadia from the land, being battered by the waves, for the wind was against them.", "25": "And in the fourth watch of the night He came to them, walking on the sea.", "26": "When the disciples saw Him walking on the sea, they were terrified and said, “It is a ghost!” And they cried out in fear.", "27": "But immediately Jesus spoke to them, saying, “Take courage; it is I. Do not be afraid.”", "28": "Peter answered Him, “Lord, if it is You, command me to come to You on the water.”", "29": "And He said, “Come.” Peter got out of the boat and walked on the water and came toward Jesus.", "30": "But seeing the strong wind, he became afraid; and beginning to sink, he cried out, “Lord, save me!”", "31": "Immediately Jesus stretched out His hand and took hold of him, saying, “You of little faith, why did you doubt?”", "32": "And when they got into the boat, the wind ceased.", "33": "Those in the boat bowed before Him, saying, “Truly You are God’s Son.”", "34": "And when they had crossed over, they came to the land of Gennesaret.", "35": "When the men of that place recognized Him, they sent word throughout that whole surrounding region and brought to Him all who were sick.", "36": "And they pleaded with Him that they might only touch the fringe of His garment; and as many as touched it were completely healed."},
15:{"1": "Then Pharisees and scribes came to Jesus from Jerusalem, saying,", "2": "“Why do Your disciples transgress the tradition of the elders? For they do not wash their hands when they eat bread.”", "3": "He answered them, “And why do you transgress the commandment of God because of your tradition?", "4": "For God said, ‘Honor your father and your mother,’ and, ‘The one who speaks evil of father or mother must surely die.’", "5": "But you say, ‘Whoever says to his father or mother, “Whatever benefit you might have received from me is a gift offered to God,”", "6": "need not honor his father.’ Thus you have made the word of God invalid because of your tradition.", "7": "Hypocrites! Isaiah prophesied rightly about you, saying,", "8": "‘This people honors Me with their lips, but their heart is far away from Me.", "9": "In vain they worship Me, teaching as teachings the commandments of men.’”", "10": "And calling the crowd to Him, He said to them, “Hear and understand:", "11": "It is not what enters the mouth that defiles a person, but what comes out of the mouth—this defiles a person.”", "12": "Then the disciples came and said to Him, “Do You know that the Pharisees stumbled when they heard this saying?”", "13": "He answered, “Every plant that My heavenly Father did not plant will be uprooted.", "14": "Leave them. They are blind guides of the blind; and if a blind person guides a blind person, both will fall into a pit.”", "15": "Peter said to Him, “Explain this parable to us.”", "16": "And He said, “Are you also still without understanding?", "17": "Do you not understand that everything entering the mouth goes into the stomach and is expelled into the latrine?", "18": "But the things coming out of the mouth come from the heart, and these defile a person.", "19": "For out of the heart come evil thoughts, murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.", "20": "These are the things that defile a person; but eating with unwashed hands does not defile a person.”", "21": "And Jesus went away from there and withdrew into the region of Tyre and Sidon.", "22": "And behold, a Canaanite woman from that region came out and cried, “Have mercy on me, Lord, Son of David! My daughter is severely demon-possessed.”", "23": "But He did not answer her a word. His disciples came and urged Him, saying, “Send her away, because she keeps crying out behind us.”", "24": "He answered, “I was sent only to the lost sheep of the house of Israel.”", "25": "But she came and bowed before Him, saying, “Lord, help me.”", "26": "He answered, “It is not good to take the children’s bread and throw it to the little dogs.”", "27": "She said, “Yes, Lord, yet even the little dogs eat the crumbs that fall from their masters’ table.”", "28": "Then Jesus answered her, “Woman, great is your faith! Let it be done for you as you desire.” And her daughter was healed from that hour.", "29": "Jesus departed from there and came beside the Sea of Galilee; and going up on the mountain, He sat there.", "30": "Large crowds came to Him, bringing with them the lame, blind, crippled, mute, and many others. They laid them at His feet, and He healed them.", "31": "So the crowd marveled when they saw the mute speaking, the crippled restored, the lame walking, and the blind seeing; and they glorified the God of Israel.", "32": "Jesus called His disciples to Him and said, “I am moved with compassion for the crowd, because they have remained with Me three days already and have nothing to eat. I do not want to send them away hungry, lest they faint on the way.”", "33": "The disciples said to Him, “Where in this deserted place could we get so many loaves as to satisfy such a large crowd?”", "34": "Jesus said to them, “How many loaves do you have?” They said, “Seven, and a few small fish.”", "35": "And He commanded the crowd to sit down on the ground.", "36": "Taking the seven loaves and the fish, He gave thanks, broke them, and gave them to the disciples, and the disciples gave them to the crowds.", "37": "They all ate and were satisfied; and they picked up seven baskets full of the broken pieces that remained.", "38": "Those who ate were four thousand men, besides women and children.", "39": "And after sending the crowds away, He got into the boat and went to the region of Magadan."},
16:{"1": "The Pharisees and Sadducees came and, testing Him, asked Him to show them a sign from heaven.", "2": "He answered them, “When evening comes, you say, ‘It will be fair weather, for the sky is red,’", "3": "and in the morning, ‘Today it will be stormy, for the sky is red and overcast.’ You know how to discern the appearance of the sky, but can you not discern the signs of the times?", "4": "An evil and adulterous generation seeks a sign, but no sign will be given to it except the sign of Jonah.” And He left them and went away.", "5": "When the disciples reached the other side, they had forgotten to bring bread.", "6": "Jesus said to them, “Watch out and beware of the leaven of the Pharisees and Sadducees.”", "7": "They reasoned among themselves, saying, “It is because we brought no bread.”", "8": "Knowing this, Jesus said, “You of little faith, why are you reasoning among yourselves because you have no bread?", "9": "Do you still not understand? Do you not remember the five loaves for the five thousand, and how many baskets you gathered?", "10": "Or the seven loaves for the four thousand, and how many baskets you gathered?", "11": "How is it that you do not understand that I was not speaking to you about bread? But beware of the leaven of the Pharisees and Sadducees.”", "12": "Then they understood that He had not told them to beware of the leaven of bread, but of the teaching of the Pharisees and Sadducees.", "13": "When Jesus came into the region of Caesarea Philippi, He asked His disciples, “Who do people say that the Son of Man is?”", "14": "They said, “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”", "15": "He said to them, “But who do you say that I am?”", "16": "Simon Peter answered, “You are the Christ, the Son of the living God.”", "17": "Jesus answered him, “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you, but My Father who is in heaven.", "18": "And I also say to you that you are Peter, and upon this rock I will build My assembly [also: church], and the gates of Hades will not prevail against it.", "19": "I will give you the keys of the kingdom of the heavens; whatever you bind on earth will have been bound in the heavens, and whatever you loose on earth will have been loosed in the heavens.”", "20": "Then He strictly commanded the disciples to tell no one that He was the Christ.", "21": "From that time Jesus began to show His disciples that He must go to Jerusalem, suffer many things from the elders, chief priests, and scribes, be killed, and on the third day be raised.", "22": "Peter took Him aside and began to rebuke Him, saying, “Far be it from You, Lord! This shall never happen to You!”", "23": "But He turned and said to Peter, “Get behind Me, Satan! You are a stumbling block to Me, because you are not setting your mind on the things of God, but on the things of people.”", "24": "Then Jesus said to His disciples, “If anyone wants to come after Me, let him deny himself, take up his cross, and follow Me.", "25": "For whoever wants to save his life will lose it, but whoever loses his life because of Me will find it.", "26": "For what will it benefit a person if he gains the whole world but forfeits his life? Or what will a person give in exchange for his life?", "27": "For the Son of Man is going to come in the glory of His Father with His angels, and then He will repay each person according to his deeds.", "28": "Truly I say to you, there are some standing here who will certainly not taste death until they see the Son of Man coming in His kingdom.”"},"17":{"1":"Six days later Jesus took Peter, James, and John his brother and brought them up a high mountain by themselves.","2":"And He was transfigured before them; His face shone like the sun, and His garments became white as the light.","3":"And behold, Moses and Elijah appeared to them, talking with Him.","4":"Peter said to Jesus, “Lord, it is good for us to be here. If You wish, I will make three shelters here: one for You, one for Moses, and one for Elijah.”","5":"While he was still speaking, behold, a bright cloud overshadowed them, and a voice from the cloud said, “This is My beloved Son, in whom I delight. Listen to Him!”","6":"When the disciples heard this, they fell facedown and were greatly afraid.","7":"Jesus came and touched them, saying, “Rise, and do not be afraid.”","8":"When they lifted up their eyes, they saw no one except Jesus Himself.","9":"As they were coming down from the mountain, Jesus commanded them, “Tell the vision to no one until the Son of Man is raised from the dead.”","10":"The disciples asked Him, “Why then do the scribes say that Elijah must come first?”","11":"He answered, “Elijah indeed comes and will restore all things.","12":"But I tell you that Elijah has already come, and they did not recognize him but did to him whatever they wished. So also the Son of Man is about to suffer at their hands.”","13":"Then the disciples understood that He had spoken to them about John the Baptist.","14":"When they came to the crowd, a man approached Him, kneeling before Him","15":"and saying, “Lord, have mercy on my son, because he suffers severely from seizures; for he often falls into the fire and often into the water.","16":"I brought him to Your disciples, but they could not heal him.”","17":"Jesus answered, “O unbelieving and twisted generation! How long shall I be with you? How long shall I bear with you? Bring him here to Me.”","18":"And Jesus rebuked the demon, and it came out of him; and the boy was healed from that hour.","19":"Then the disciples came to Jesus privately and said, “Why could we not cast it out?”","20":"He said to them, “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move; and nothing will be impossible for you.”","21":"[Some later manuscripts include: “But this kind does not go out except by prayer and fasting.”]","22":"As they were gathering in Galilee, Jesus said to them, “The Son of Man is about to be handed over into the hands of people,","23":"and they will kill Him, and on the third day He will be raised.” And they were deeply grieved.","24":"When they came to Capernaum, those who collected the two-drachma temple tax came to Peter and said, “Does your teacher not pay the two drachmas?”","25":"He said, “Yes.” When he entered the house, Jesus spoke first: “What do you think, Simon? From whom do the kings of the earth collect toll or tax—from their sons or from others?”","26":"When he said, “From others,” Jesus said to him, “Then the sons are free.","27":"But so that we may not cause them to stumble, go to the sea, cast a hook, and take the first fish that comes up. Open its mouth and you will find a stater. Take that and give it to them for Me and for yourself.”"},"18":{"1":"At that time the disciples came to Jesus, saying, “Who then is greatest in the kingdom of the heavens?”","2":"And calling a little child, He placed the child in their midst","3":"and said, “Truly I say to you, unless you turn and become like little children, you will certainly not enter the kingdom of the heavens.","4":"Therefore whoever humbles himself like this little child is the greatest in the kingdom of the heavens.","5":"And whoever receives one such little child in My name receives Me.","6":"But whoever causes one of these little ones who believe in Me to stumble, it would be better for him that a large millstone be hung around his neck and that he be drowned in the depth of the sea.","7":"Woe to the world because of causes of stumbling! For it is necessary that causes of stumbling come, but woe to the person through whom the cause of stumbling comes!","8":"If your hand or your foot causes you to stumble, cut it off and throw it away. It is better for you to enter life crippled or lame than to have two hands or two feet and be thrown into the eternal fire.","9":"And if your eye causes you to stumble, tear it out and throw it away. It is better for you to enter life with one eye than to have two eyes and be thrown into the Gehenna of fire.","10":"See that you do not despise one of these little ones, for I tell you that in heaven their angels always see the face of My Father who is in heaven.","11":"[Some later manuscripts include: “For the Son of Man came to save what was lost.”]","12":"What do you think? If a man has a hundred sheep and one of them goes astray, will he not leave the ninety-nine on the mountains and go seek the one that went astray?","13":"And if he finds it, truly I say to you, he rejoices over it more than over the ninety-nine that did not go astray.","14":"So it is not the will of your Father who is in heaven that one of these little ones should perish.","15":"If your brother sins against you, go and show him his fault between you and him alone. If he listens to you, you have gained your brother.","16":"But if he does not listen, take one or two more with you, so that every matter may be established by the mouth of two or three witnesses.","17":"If he refuses to listen to them, tell it to the assembly [also: church]. And if he refuses to listen even to the assembly, let him be to you as a Gentile and a tax collector.","18":"Truly I say to you, whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.","19":"Again I say to you that if two of you agree on earth about anything they ask, it will be done for them by My Father who is in heaven.","20":"For where two or three are gathered into My name, there I am in their midst.”","21":"Then Peter came and said to Him, “Lord, how often will my brother sin against me and I forgive him? Up to seven times?”","22":"Jesus said to him, “I do not say to you up to seven times, but up to seventy-seven times [or: seventy times seven].","23":"Therefore the kingdom of the heavens may be compared to a king who wished to settle accounts with his servants.","24":"When he began to settle them, one who owed ten thousand talents was brought to him.","25":"Since he could not pay, the master ordered him to be sold, with his wife and children and all that he had, and payment to be made.","26":"So the servant fell down and bowed before him, saying, ‘Be patient with me, and I will repay you everything.’","27":"Moved with compassion, the master of that servant released him and forgave the debt.","28":"But that servant went out and found one of his fellow servants who owed him a hundred denarii. He seized him and began choking him, saying, ‘Pay what you owe!’","29":"So his fellow servant fell down and pleaded with him, saying, ‘Be patient with me, and I will repay you.’","30":"But he was unwilling; instead, he went and threw him into prison until he should pay what was owed.","31":"When his fellow servants saw what had happened, they were deeply grieved and went and reported to their master everything that had happened.","32":"Then his master summoned him and said, ‘Evil servant! I forgave you all that debt because you pleaded with me.","33":"Should you not also have shown mercy to your fellow servant, just as I showed mercy to you?’","34":"And in anger his master handed him over to the tormentors until he should pay everything he owed.","35":"So also My heavenly Father will do to you if each of you does not forgive his brother from your heart.”"},"19":{"1":"When Jesus had finished these sayings, He departed from Galilee and went into the region of Judea beyond the Jordan.","2":"Large crowds followed Him, and He healed them there.","3":"Pharisees came to Him, testing Him and saying, “Is it lawful for a man to divorce his wife for any reason?”","4":"He answered, “Have you not read that the Creator from the beginning made them male and female","5":"and said, ‘For this reason a man shall leave his father and mother and be joined to his wife, and the two shall become one flesh’?","6":"So they are no longer two, but one flesh. Therefore what God has joined together, let no one separate.”","7":"They said to Him, “Why then did Moses command us to give a certificate of divorce and send her away?”","8":"He said to them, “Because of your hardness of heart Moses allowed you to divorce your wives, but from the beginning it was not so.","9":"And I tell you that whoever divorces his wife, except for sexual immorality, and marries another commits adultery.”","10":"The disciples said to Him, “If such is the situation of a man with his wife, it is better not to marry.”","11":"But He said to them, “Not everyone can receive this saying, but only those to whom it has been given.","12":"For there are eunuchs who were born that way, and there are eunuchs who were made eunuchs by people, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of the heavens. Let the one who can receive this receive it.”","13":"Then little children were brought to Him so that He might lay His hands on them and pray, but the disciples rebuked them.","14":"Jesus said, “Allow the little children, and do not hinder them from coming to Me, for the kingdom of the heavens belongs to such as these.”","15":"And after laying His hands on them, He departed from there.","16":"And behold, a man came to Him and said, “Teacher, what good thing must I do that I may have eternal life?”","17":"He said to him, “Why do you ask Me about what is good? There is One who is good. But if you want to enter life, keep the commandments.”","18":"He said to Him, “Which ones?” Jesus said, “‘You shall not murder. You shall not commit adultery. You shall not steal. You shall not bear false witness.","19":"Honor your father and mother,’ and, ‘You shall love your neighbor as yourself.’”","20":"The young man said to Him, “I have kept all these. What do I still lack?”","21":"Jesus said to him, “If you want to be complete [also: mature, whole], go, sell your possessions and give to the poor, and you will have treasure in heaven; and come, follow Me.”","22":"But when the young man heard this word, he went away sorrowful, for he had many possessions.","23":"Jesus said to His disciples, “Truly I say to you, it is difficult for a rich person to enter the kingdom of the heavens.","24":"Again I tell you, it is easier for a camel to pass through the eye of a needle than for a rich person to enter the kingdom of God.”","25":"When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”","26":"Looking at them, Jesus said, “With people this is impossible, but with God all things are possible.”","27":"Then Peter answered Him, “Behold, we have left everything and followed You. What then will there be for us?”","28":"Jesus said to them, “Truly I say to you, in the renewal, when the Son of Man sits on the throne of His glory, you who have followed Me will also sit on twelve thrones, judging the twelve tribes of Israel.","29":"And everyone who has left houses or brothers or sisters or father or mother or children or fields because of My name will receive a hundredfold and will inherit eternal life.","30":"But many who are first will be last, and the last first."},"20":{"1":"For the kingdom of the heavens is like a master of a house who went out early in the morning to hire workers for his vineyard.","2":"After agreeing with the workers for a denarius for the day, he sent them into his vineyard.","3":"And going out about the third hour, he saw others standing idle in the marketplace.","4":"He said to them, ‘You also go into the vineyard, and whatever is right I will give you.’ So they went.","5":"Again he went out about the sixth and the ninth hour and did the same.","6":"And about the eleventh hour he went out and found others standing there, and he said to them, ‘Why have you been standing here idle all day?’","7":"They said to him, ‘Because no one hired us.’ He said to them, ‘You also go into the vineyard.’","8":"When evening came, the owner of the vineyard said to his manager, ‘Call the workers and pay them their wages, beginning with the last and going to the first.’","9":"Those hired about the eleventh hour came and each received a denarius.","10":"When the first came, they thought they would receive more, but they too each received a denarius.","11":"When they received it, they began grumbling against the master of the house,","12":"saying, ‘These last worked only one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’","13":"But he answered one of them, ‘Friend, I am doing you no wrong. Did you not agree with me for a denarius?","14":"Take what is yours and go. I want to give to this last one the same as I give to you.","15":"Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am generous?’","16":"So the last will be first, and the first last.","17":"As Jesus was going up to Jerusalem, He took the twelve disciples aside by themselves, and on the way He said to them,","18":"“Behold, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn Him to death.","19":"They will hand Him over to the Gentiles to mock and flog and crucify Him, and on the third day He will be raised.”","20":"Then the mother of the sons of Zebedee came to Him with her sons, bowing before Him and asking something from Him.","21":"He said to her, “What do you want?” She said to Him, “Say that these two sons of mine may sit, one at Your right and one at Your left, in Your kingdom.”","22":"Jesus answered, “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to Him, “We are able.”","23":"He said to them, “You will indeed drink My cup, but to sit at My right and at My left is not Mine to give, except to those for whom it has been prepared by My Father.”","24":"When the ten heard this, they were indignant with the two brothers.","25":"But Jesus called them to Himself and said, “You know that the rulers of the Gentiles lord it over them, and their great ones exercise authority over them.","26":"It shall not be so among you. Rather, whoever wants to become great among you shall be your servant,","27":"and whoever wants to be first among you shall be your slave,","28":"just as the Son of Man came not to be served but to serve, and to give His life as a ransom in place of many.”","29":"As they went out from Jericho, a large crowd followed Him.","30":"And behold, two blind men sitting beside the road, when they heard that Jesus was passing by, cried out, “Lord, Son of David, have mercy on us!”","31":"The crowd rebuked them so that they would be silent, but they cried out all the more, “Lord, Son of David, have mercy on us!”","32":"Jesus stopped, called them, and said, “What do you want Me to do for you?”","33":"They said to Him, “Lord, let our eyes be opened.”","34":"Moved with compassion, Jesus touched their eyes, and immediately they received their sight and followed Him."}};

function normGreekKey(s){
  return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\u0370-\u03ff\u1f00-\u1fff]/gi,'').toLowerCase();
}
function surfaceForCore(words,target){
  if(!words||!words.length)return '';
  const targets=(target||'').trim().split(/\s+/).map(normGreekKey).filter(Boolean);
  if(!targets.length)return '';
  const lemmas=words.map(w=>normGreekKey(w.lemma));
  // Single lemma: return the exact inflected surface form in this verse.
  if(targets.length===1){
    const i=lemmas.findIndex(x=>x===targets[0]);
    return i>=0?(words[i].surface||''):'';
  }
  // Phrase: match the lemma sequence and return the exact surface phrase.
  for(let i=0;i<=lemmas.length-targets.length;i++){
    let ok=true;
    for(let j=0;j<targets.length;j++) if(lemmas[i+j]!==targets[j]){ok=false;break;}
    if(ok)return words.slice(i,i+targets.length).map(w=>w.surface).join(' ');
  }
  // Fallback for article-containing phrases: collect target lemmas in verse order.
  const picked=[]; let pos=0;
  for(const t of targets){
    const i=lemmas.findIndex((x,k)=>k>=pos&&x===t);
    if(i<0)return '';
    picked.push(words[i].surface); pos=i+1;
  }
  return picked.join(' ');
}
function annotateCore(text,ch,v,lang,words){
  let out=esc(text||'');
  const items=CORE_GREEK[`${ch}:${v}`]||[];
  if(!words||!words.length)return out;
  for(const item of items){
    const phrase=(lang==='ko'?item[0]:item[1]);
    const target=item[2];
    const surface=item[3]||surfaceForCore(words,target);
    if(!surface)continue;
    const safe=esc(phrase);
    const at=out.indexOf(safe);
    if(at>=0){
      const rep=safe+` <span class="core-gr">(${esc(surface)})</span>`;
      out=out.slice(0,at)+rep+out.slice(at+safe.length);
    }
  }
  return out;
}
function refreshCoreAnnotation(ch,v,words){
  const k=KO[String(ch)]||{}, e=EN[String(ch)]||{};
  const ko=document.getElementById(`ko-${ch}-${v}`);
  const en=document.getElementById(`en-${ch}-${v}`);
  if(ko)ko.innerHTML=annotateCore(k[String(v)]||'',ch,v,'ko',words);
  if(en)en.innerHTML=annotateCore(e[String(v)]||'',ch,v,'en',words);
}

function buildNav(){
  const nav=document.getElementById('nav');
  for(let ch=1;ch<=20;ch++){
    const b=document.createElement('button');
    b.type='button'; b.textContent='Matthew '+ch; b.dataset.ch=String(ch);
    b.addEventListener('click',()=>show(ch));
    nav.appendChild(b);
  }
}

function show(ch){
  currentChapter=ch;
  document.getElementById('title').textContent='Matthew '+ch;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',Number(b.dataset.ch)===ch));
  const k=KO[String(ch)]||{}, e=EN[String(ch)]||{};
  const nums=[...new Set([...Object.keys(k),...Object.keys(e)])].map(Number).sort((a,b)=>a-b);
  let h='';
  for(const v of nums){
    h+=`<section class="verse"><div class="ref">Matthew ${ch}:${v}</div>
    <div class="label">Greek · SBLGNT</div><div class="greek" id="g-${ch}-${v}">헬라어 확인 중…</div>
    <div class="pron" id="p-${ch}-${v}"></div>
    <div class="label">나의 성경 — 한국어 원문 직역</div><div class="ko" id="ko-${ch}-${v}">${esc(k[String(v)]||'')}</div>
    <div class="label">My Bible — Greek-based Translation</div><div class="en" id="en-${ch}-${v}">${esc(e[String(v)]||'')}</div></section>`;
  }
  document.getElementById('reader').innerHTML=h;
  document.getElementById('status').textContent=`Matthew ${ch} · ${nums.length}절 · 내장 본문 표시 완료`;
  try{history.replaceState(null,'','#matthew'+ch)}catch(_e){}
  window.scrollTo(0,0);
  setTimeout(()=>loadGreek(ch),0);
}
